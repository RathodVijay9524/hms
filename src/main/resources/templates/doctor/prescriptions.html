<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Prescriptions - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebars/doctor_sidebar :: doctor_sidebar('doc-rx')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="doctor-header d-flex justify-content-between align-items-center mb-4 text-white">
                <div class="position-relative" style="z-index: 1;">
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit';">Rx Management</h1>
                    <p class="mb-0 opacity-75 small">Review and issue digital prescriptions</p>
                </div>
                <button class="btn btn-sm btn-light text-primary fw-bold px-4 rounded-pill" style="z-index: 1;">
                    <i class="fas fa-file-signature me-2"></i>New Prescription
                </button>
            </div>

            <!-- Prescriptions List -->
            <div class="glass-card table-responsive">
                <table class="table table-hover align-middle mb-0 text-white">
                    <thead class="bg-transparent border-bottom border-secondary">
                        <tr class="text-uppercase small fw-bold text-muted">
                            <th class="ps-4">Date / ID</th>
                            <th>Patient / Visit</th>
                            <th>Medications</th>
                            <th>Notes</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="rx-table-body">
                        <tr>
                            <td colspan="5" class="text-center py-5">
                                <div class="spinner-border text-primary"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadPrescriptions();
        });

        async function loadPrescriptions() {
            const tbody = document.getElementById('rx-table-body');
            try {
                const response = await fetch('/api/doctor/prescriptions/my-list');
                if (!response.ok) throw new Error("Failed to load");
                const result = await response.json();
                const data = result.data || result;

                tbody.innerHTML = '';
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">No prescriptions issued yet.</td></tr>`;
                    return;
                }

                data.forEach(rx => {
                    const medList = rx.medications.map(m => `<span class="badge bg-indigo-subtle text-indigo rounded-pill me-1 mb-1">${m.medicineName} (${m.dosage})</span>`).join(' ');

                    const row = `
                        <tr>
                            <td class="ps-4">
                                <div class="fw-bold text-theme">${rx.visitDate}</div>
                                <div class="small text-muted">#RX-${rx.id}</div>
                            </td>
                            <td>
                                <div class="fw-bold text-theme">${rx.doctorName || 'My Patient'}</div>
                                <div class="small text-muted">Visit #${rx.visitId}</div>
                            </td>
                            <td>
                                <div class="d-flex flex-wrap" style="max-width: 300px;">
                                    ${medList}
                                </div>
                            </td>
                            <td>
                                <div class="small text-muted text-truncate" style="max-width: 200px;">${rx.pharmacistNotes || '-'}</div>
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-light rounded-pill"><i class="fas fa-print"></i></button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-danger">Error loading prescriptions</td></tr>`;
            }
        }
    </script>
</body>

</html>
