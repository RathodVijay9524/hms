<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Consults - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .consult-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .consult-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #6366f1;
        }

        .consult-card.active {
            border-color: rgba(34, 197, 94, 0.4);
        }

        .consult-card.active::before {
            background: #22c55e;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        .video-btn {
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 0.75rem;
            padding: 0.5rem 1.25rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .video-btn:hover {
            background: #4f46e5;
            transform: translateY(-2px);
            color: white;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 0.5rem;
        }

        .status-online {
            background: #22c55e;
            box-shadow: 0 0 5px #22c55e;
        }

        .status-waiting {
            background: #f59e0b;
        }

        .table-premium thead th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/doctor_sidebar :: doctor_sidebar('doc-tele')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Virtual Consults</h1>
                    <p class="text-muted mb-0 small">Secure video consultations with remote patients</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-secondary rounded-pill px-3" onclick="loadConsults()">
                        <i class="fas fa-sync me-2"></i>Refresh
                    </button>
                    <!-- <button class="btn btn-sm btn-outline-secondary rounded-pill px-3">
                        <i class="fas fa-cog me-2"></i>Media Settings
                    </button> -->
                </div>
            </div>

            <!-- Active / Upcoming Consultations Container -->
            <div class="row g-4 mb-4" id="consultContainer">
                <!-- Loaded Dynamically -->
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>

            <!-- Past Consultations (Placeholder for now, could be filtered by status COMPLETED) -->
            <!-- 
            <div class="glass-card p-4">
                <h5 class="fw-bold mb-4 text-theme" style="font-family: 'Outfit';">Recent Activity</h5>
                ...
            </div> 
            -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadConsults();
        });

        async function loadConsults() {
            const container = document.getElementById('consultContainer');
            container.innerHTML = '<div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>';

            try {
                // Fetch today's teleconsult appointments
                const today = new Date().toISOString().split('T')[0];
                const response = await fetch(`/api/appointments/teleconsult?date=${today}`);
                if (!response.ok) throw new Error('Failed to load consults');

                const result = await response.json();
                const appointments = result.data || result;

                renderConsults(appointments);
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="col-12 text-center py-5 text-danger">Error loading consultations.</div>`;
            }
        }

        function renderConsults(appointments) {
            const container = document.getElementById('consultContainer');
            container.innerHTML = '';

            if (appointments.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-video-slash fs-1 text-muted opacity-50 mb-3"></i>
                        <h5 class="text-muted">No virtual consultations scheduled for today.</h5>
                        <p class="small text-muted">Appointments with type 'TELECONSULT' will appear here.</p>
                    </div>
                `;
                return;
            }

            appointments.forEach(appt => {
                // Determine card style based on status/time
                let isActive = appt.status === 'CHECKED_IN' || appt.status === 'IN_PROGRESS';
                let cardClass = isActive ? 'consult-card active' : 'consult-card';
                let badgeClass = isActive ? 'bg-success bg-opacity-10 text-success' : 'bg-warning bg-opacity-10 text-warning';
                let badgeText = isActive ? 'Live Now' : 'Scheduled';
                let statusDot = isActive ? 'status-online' : 'status-waiting';
                let statusText = isActive ? 'Patient in Lobby' : 'Expected';

                if (appt.status === 'COMPLETED') {
                    cardClass = 'consult-card opacity-75';
                    badgeClass = 'bg-secondary bg-opacity-10 text-secondary';
                    badgeText = 'Completed';
                    statusDot = 'bg-secondary';
                    statusText = 'Ended';
                }

                const timeStr = appt.appointmentTime ? formatTime(appt.appointmentTime) : '--:--';

                const cardHtml = `
                    <div class="col-md-4">
                        <div class="${cardClass} p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge ${badgeClass} rounded-pill px-3">${badgeText}</span>
                                <span class="text-muted small">${timeStr} Slot</span>
                            </div>
                            <h5 class="fw-bold mb-1 text-theme">${appt.patientName}</h5>
                            <p class="text-muted small mb-4">${appt.reasonForVisit || 'General Consult'} • ${appt.patientUhid || 'No UHID'}</p>
                            <div class="d-flex align-items-center justify-content-between">
                                <div class="small fw-bold text-theme">
                                    <span class="status-dot ${statusDot}"></span>${statusText}
                                </div>
                                ${getActionBtn(appt)}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        function getActionBtn(appt) {
            if (appt.status === 'COMPLETED' || appt.status === 'CANCELLED') {
                return `<button class="btn btn-sm btn-secondary disabled rounded-pill px-3">View Details</button>`;
            }
            // Link to a video call page (placeholder or actual integration)
            // Using start-call endpoint or just opening a new window
            // For now, let's link to the EMR page where the video widget usually resides
            return `
                <a href="/doctor/emr/${appt.visitId || ''}?video=true" class="video-btn text-decoration-none">
                    <i class="fas fa-video"></i>Join Call
                </a>
             `;
        }

        function formatTime(timeArray) {
            if (Array.isArray(timeArray)) {
                const [h, m] = timeArray;
                const d = new Date(); d.setHours(h); d.setMinutes(m);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return timeArray;
        }
    </script>
</body>

</html>
