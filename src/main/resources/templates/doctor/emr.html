<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMR Hub - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .emr-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: all 0.3s ease;
        }

        .emr-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.15);
        }

        .search-emr {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem 0.75rem 3.5rem;
            color: white;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .emr-table th {
            font-family: 'Outfit';
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1.25rem;
            border-bottom: 2px solid var(--border-color);
        }

        .emr-table td {
            padding: 1.25rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .action-icon {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: rgba(99, 102, 241, 0.05);
            color: #6366f1;
            transition: all 0.2s;
        }

        .action-icon:hover {
            background: #6366f1;
            color: white;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/doctor_sidebar :: doctor_sidebar('doc-emr')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #6366f1;">EMR / Patient Records</h1>
                    <p class="text-muted mb-0">Search and review patient longitudinal medical history</p>
                </div>
                <div class="d-flex gap-2">
                    <div class="position-relative" style="width: 350px;">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-emr" placeholder="Search by name, UHID, Mobile...">
                    </div>
                </div>
            </div>

            <!-- List -->
            <div class="emr-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table emr-table mb-0">
                        <thead>
                            <tr class="text-muted">
                                <th>Patient Details</th>
                                <th>UHID</th>
                                <th>Age/Gender</th>
                                <th>Last Visit</th>
                                <th>Status</th>
                                <th class="text-end">Clinical Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="fw-bold fs-6">John Doe</div>
                                    <div class="small text-muted">+91 98765 43210</div>
                                </td>
                                <td><span class="fw-bold text-white">H101-001</span></td>
                                <td>32y / Male</td>
                                <td>25-Dec-2025</td>
                                <td><span class="badge bg-success-subtle text-success px-3 rounded-pill">Active
                                        OPD</span></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a href="#" class="action-icon" title="View History"><i
                                                class="fas fa-history"></i></a>
                                        <a href="#" class="action-icon" title="Write Note"><i
                                                class="fas fa-edit"></i></a>
                                        <a href="#" class="action-icon" title="Order Tests"><i
                                                class="fas fa-flask"></i></a>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="fw-bold fs-6">Alice Smith</div>
                                    <div class="small text-muted">+91 91234 56789</div>
                                </td>
                                <td><span class="fw-bold text-white">H101-002</span></td>
                                <td>28y / Female</td>
                                <td>24-Dec-2025</td>
                                <td><span
                                        class="badge bg-primary-subtle text-primary px-3 rounded-pill">Tele-Consult</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <a href="#" class="action-icon" title="View History"><i
                                                class="fas fa-history"></i></a>
                                        <a href="#" class="action-icon" title="Write Note"><i
                                                class="fas fa-edit"></i></a>
                                        <a href="#" class="action-icon" title="Order Tests"><i
                                                class="fas fa-flask"></i></a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
