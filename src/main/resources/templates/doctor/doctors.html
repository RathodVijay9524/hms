<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .btn-primary-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
        }

        .table-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
        }

        .table-custom {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .table-custom thead th {
            background: var(--bg-tertiary);
            padding: 1rem;
        }

        .table-custom tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-color: var(--border-light);
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .form-control,
        .form-select {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebars/owner_sidebar :: owner_sidebar('owner-doctors')}"></div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Doctor Profiles</h1>
                <p class="text-muted mb-0">Manage doctor credentials and department mapping</p>
            </div>
            <button class="btn btn-primary-gradient" onclick="openModal()"><i class="fas fa-plus me-1"></i> Add/Link
                Doctor</button>
        </div>

        <div class="table-wrapper">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Doctor Name</th>
                        <th>Department</th>
                        <th>Specialization</th>
                        <th>Reg. Number</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="doctorTableBody">
                    <tr th:each="doc : ${doctors}">
                        <td><strong th:text="${doc.doctorName}">Dr. Vijay Rathod</strong></td>
                        <td th:text="${doc.departmentName}">Cardiology</td>
                        <td th:text="${doc.specialization}">MD Cardiology</td>
                        <td th:text="${doc.registrationNumber}">REG12345</td>
                        <td>
                            <span class="badge" th:classappend="${doc.status ? 'bg-success' : 'bg-danger'}"
                                th:text="${doc.status ? 'Active' : 'Inactive'}">Active</span>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-outline-info"
                                th:onclick="'editDoctor(' + ${doc.userId} + ')'"><i class="fas fa-pen"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="doctorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="docModalTitle">Doctor Profile</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="docForm">
                        <div class="mb-3">
                            <label class="form-label">Select User (Doctor Account)</label>
                            <select id="docUserId" class="form-select" required>
                                <option value="">Loading users...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="docDeptId" class="form-select" required>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <input type="text" id="docSpecialization" class="form-control"
                                placeholder="e.g. MBBD, MD (Cardio)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Registration Number</label>
                            <input type="text" id="docReg" class="form-control">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="docStatus" checked>
                            <label class="form-check-label">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary-gradient" onclick="saveDoctor()">Save Profile</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const docModal = new bootstrap.Modal(document.getElementById('doctorModal'));

        function openModal() {
            loadUsers();
            document.getElementById('docForm').reset();
            docModal.show();
        }

        function loadUsers() {
            fetch('/api/users/role/ROLE_DOCTOR') // Filtered by Role
                .then(r => r.json())
                .then(users => {
                    const select = document.getElementById('docUserId');
                    select.innerHTML = '<option value="">Select User</option>';
                    users.forEach(u => {
                        select.innerHTML += `<option value="${u.id}">${u.name} (${u.username})</option>`;
                    });
                });
        }

        function editDoctor(userId) {
            loadUsers();
            fetch(`/api/masters/doctors/user/${userId}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('docUserId').value = d.userId;
                    document.getElementById('docDeptId').value = d.departmentId;
                    document.getElementById('docSpecialization').value = d.specialization || '';
                    document.getElementById('docReg').value = d.registrationNumber || '';
                    document.getElementById('docStatus').checked = d.status;
                    docModal.show();
                });
        }

        function saveDoctor() {
            const data = {
                userId: document.getElementById('docUserId').value,
                departmentId: document.getElementById('docDeptId').value,
                specialization: document.getElementById('docSpecialization').value,
                registrationNumber: document.getElementById('docReg').value,
                status: document.getElementById('docStatus').checked
            };
            fetch('/api/masters/doctors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => location.reload());
        }
    </script>
</body>

</html>
