<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Schedule - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebars/doctor_sidebar :: doctor_sidebar('doc-app')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header and Date Picker -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #6366f1;">OPD Schedule</h1>
                    <p class="text-muted mb-0">Manage your daily appointments and consultations</p>
                </div>
                <div class="d-flex gap-2">
                    <input type="date" id="scheduleDate" class="form-control rounded-pill px-3" style="width: auto;">
                    <button class="btn btn-indigo" style="background: #6366f1; color: white;"
                        onclick="refreshSchedule()">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                    <!-- <button class="btn btn-outline-light rounded-circle"><i class="fas fa-cog"></i></button> -->
                </div>
            </div>

            <!-- Stats Overview (Optional, kept simple for now) -->
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                        <div class="card-body p-3 d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-primary bg-opacity-10 p-3 text-primary">
                                <i class="fas fa-users fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold" id="totalAppts">0</h3>
                                <small class="text-muted">Total Appointments</small>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                        <div class="card-body p-3 d-flex align-items-center gap-3">
                            <div class="rounded-circle bg-success bg-opacity-10 p-3 text-success">
                                <i class="fas fa-check-circle fs-4"></i>
                            </div>
                            <div>
                                <h3 class="mb-0 fw-bold" id="completedAppts">0</h3>
                                <small class="text-muted">Completed</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Appointments List -->
            <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-header bg-transparent border-0 d-flex justify-content-between align-items-center py-3">
                    <h5 class="mb-0 text-white">Appointments List</h5>
                    <!-- Filter/Search could go here -->
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0 text-white"
                            style="border-color: rgba(255,255,255,0.1);">
                            <thead class="bg-light bg-opacity-10">
                                <tr>
                                    <th class="ps-4">Time</th>
                                    <th>Patient</th>
                                    <th>Reason / Symptoms</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appointmentList">
                                <tr>
                                    <td colspan="5" class="text-center py-5 text-muted">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Set date input to today
            const today = new Date().toISOString().split('T')[0];
            const dateInput = document.getElementById('scheduleDate');
            dateInput.value = today;

            // Initial load
            loadAppointments(today);

            // Listen for date changes
            dateInput.addEventListener('change', (e) => {
                loadAppointments(e.target.value);
            });
        });

        function refreshSchedule() {
            const date = document.getElementById('scheduleDate').value;
            loadAppointments(date);
        }

        async function loadAppointments(date) {
            const tbody = document.getElementById('appointmentList');
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5"><div class="spinner-border text-primary status-spinner"></div></td></tr>`;

            try {
                const response = await fetch(`/api/appointments/my-schedule?date=${date}`);
                if (!response.ok) throw new Error('Failed to load schedule');

                const result = await response.json();
                const appointments = result.data || result; // Handle wrapper if any

                renderAppointments(appointments);
                updateStats(appointments);

            } catch (error) {
                console.error('Error:', error);
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-danger">Error loading schedule. Please try again.</td></tr>`;
                document.getElementById('totalAppts').textContent = '0';
                document.getElementById('completedAppts').textContent = '0';
            }
        }

        function renderAppointments(appointments) {
            const tbody = document.getElementById('appointmentList');
            tbody.innerHTML = '';

            if (appointments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-5 text-muted">No appointments found for this date.</td></tr>`;
                return;
            }

            appointments.forEach(appt => {
                const tr = document.createElement('tr');

                // Status Badge Logic
                let statusClass = 'bg-secondary';
                if (appt.status === 'BOOKED') statusClass = 'bg-primary';
                else if (appt.status === 'CHECKED_IN') statusClass = 'bg-info text-dark';
                else if (appt.status === 'IN_PROGRESS') statusClass = 'bg-warning text-dark';
                else if (appt.status === 'COMPLETED') statusClass = 'bg-success';
                else if (appt.status === 'CANCELLED') statusClass = 'bg-danger';

                const timeStr = appt.appointmentTime ? formatTime(appt.appointmentTime) : '--:--';

                tr.innerHTML = `
                    <td class="ps-4 fw-bold text-primary">${timeStr}</td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                             <div class="rounded-circle bg-light bg-opacity-10 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                <i class="fas fa-user text-muted small"></i>
                            </div>
                            <div>
                                <div class="fw-medium">${appt.patientName}</div>
                                <small class="text-muted" style="font-size: 0.75rem;">${appt.patientUhid || 'No UHID'}</small>
                            </div>
                        </div>
                    </td>
                    <td>
                        <div class="text-truncate" style="max-width: 200px;">${appt.reasonForVisit || '-'}</div>
                    </td>
                    <td><span class="badge ${statusClass}">${appt.status}</span></td>
                    <td>
                        ${getActionButtons(appt)}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function getActionButtons(appt) {
            if (appt.status === 'BOOKED') {
                return `<button class="btn btn-sm btn-outline-info" onclick="updateStatus(${appt.id}, 'CHECKED_IN')">Check In</button>`;
            } else if (appt.status === 'CHECKED_IN') {
                if (appt.patientId) {
                    return `<a href="/doctor/patients/${appt.patientId}" class="btn btn-sm btn-warning text-dark">Start Consult</a>`;
                } else {
                    // Visit missing? Try to "Check In" again to trigger creation
                    return `<button class="btn btn-sm btn-warning text-dark" onclick="updateStatus(${appt.id}, 'CHECKED_IN')">Start Consult</button>`;
                }
            } else if (appt.status === 'IN_PROGRESS') {
                return `<a href="/doctor/patients/${appt.patientId || ''}" class="btn btn-sm btn-primary">Resume</a>`;
            } else {
                return '<small class="text-muted">No actions</small>'; // Completed/Cancelled
            }
        }

        async function updateStatus(id, newStatus) {
            // For Start Consult retry, don't confirm
            if (newStatus !== 'CHECKED_IN' && !confirm(`Are you sure you want to mark this appointment as ${newStatus}?`)) return;

            try {
                const response = await fetch(`/api/appointments/${id}/status?status=${newStatus}`, {
                    method: 'PATCH'
                });
                if (response.ok) {
                    refreshSchedule();
                } else {
                    alert('Failed to update status');
                }
            } catch (e) {
                console.error(e);
                alert('Error updating status');
            }
        }

        function formatTime(timeArray) {
            // Handle array [H, M] or string
            if (Array.isArray(timeArray)) {
                const [h, m] = timeArray;
                const d = new Date(); d.setHours(h); d.setMinutes(m);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return timeArray;
        }

        function updateStats(appointments) {
            document.getElementById('totalAppts').textContent = appointments.length;
            const completed = appointments.filter(a => a.status === 'COMPLETED').length;
            document.getElementById('completedAppts').textContent = completed;
        }
    </script>

</html>
