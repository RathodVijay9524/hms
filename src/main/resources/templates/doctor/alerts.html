<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Alerts - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .alert-item {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 5px solid #ef4444;
            transition: all 0.2s;
        }

        .alert-item:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 20px -10px rgba(239, 68, 68, 0.2);
        }

        .alert-item.INFO {
            border-left-color: #3b82f6;
        }

        .alert-item.WARNING {
            border-left-color: #f59e0b;
        }

        .alert-item.CRITICAL {
            border-left-color: #ef4444;
        }

        .time-ago {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .patient-info {
            font-family: 'Outfit';
            font-weight: 700;
            color: #6366f1;
        }

        .btn-action {
            background: rgba(99, 102, 241, 0.1);
            color: #6366f1;
            border: 1px solid rgba(99, 102, 241, 0.2);
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
        }

        .btn-action:hover {
            background: #6366f1;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 4rem;
            opacity: 0.2;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/doctor_sidebar :: doctor_sidebar('doc-alerts')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #6366f1;">Critical Alerts</h1>
                    <p class="text-muted mb-0">Immediate actions required for high-risk clinical findings</p>
                </div>
                <button class="btn btn-outline-danger rounded-pill px-4" onclick="clearAllAlerts()">Clear All</button>
            </div>

            <div class="row g-4">
                <div class="col-lg-8">
                    <!-- Alert Feed - Dynamic -->
                    <div id="alertsContainer">
                        <div class="text-center py-5">
                            <div class="spinner-border" style="color: #6366f1;"></div>
                            <p class="mt-2 text-muted">Loading alerts...</p>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="glass-card p-4">
                        <h5 class="fw-bold mb-3 text-theme" style="font-family: 'Outfit';">Alert Configuration</h5>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label small text-theme">Browser Notifications</label>
                        </div>
                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" checked>
                            <label class="form-check-label small text-theme">Mobile App Pushes</label>
                        </div>
                        <hr class="opacity-10">
                        <small class="text-muted text-uppercase fw-bold d-block mb-3" style="font-size: 0.65rem;">Notify
                            for:</small>
                        <div class="d-flex flex-wrap gap-2">
                            <span
                                class="badge bg-indigo bg-opacity-10 text-indigo-500 border border-indigo-500 border-opacity-20 px-3 py-2 rounded-pill">Lab
                                Results</span>
                            <span
                                class="badge bg-indigo bg-opacity-10 text-indigo-500 border border-indigo-500 border-opacity-20 px-3 py-2 rounded-pill">Vitals</span>
                            <span
                                class="badge bg-indigo bg-opacity-10 text-indigo-500 border border-indigo-500 border-opacity-20 px-3 py-2 rounded-pill">Med
                                Miss</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadAlerts();
        });

        async function loadAlerts() {
            const container = document.getElementById('alertsContainer');

            try {
                const response = await fetch('/api/doctor/alerts');
                const alerts = await response.json();

                if (alerts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-check-circle text-success"></i>
                            <h4 class="fw-bold">All Clear!</h4>
                            <p class="text-muted">No pending critical alerts at this time.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                alerts.forEach(alert => {
                    const timeAgo = getTimeAgo(alert.createdDate);
                    const severityBadge = getSeverityBadge(alert.severity);
                    const alertTypeIcon = getAlertTypeIcon(alert.alertType);

                    const patientInfo = alert.patientName
                        ? `${alert.patientUhid || 'Unknown'} • ${alert.patientName}${alert.wardName ? ' (' + alert.wardName + ')' : ''}`
                        : (alert.wardName || 'Hospital Alert');

                    const html = `
                        <div class="alert-item ${alert.severity}" id="alert-${alert.id}">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="d-flex align-items-center gap-2">
                                    ${alertTypeIcon}
                                    ${severityBadge}
                                    <span class="time-ago">${timeAgo}</span>
                                </div>
                                <span class="patient-info">${patientInfo}</span>
                            </div>
                            <h6 class="fw-bold mb-2">${getAlertTitle(alert.alertType)}</h6>
                            <p class="text-muted small mb-3">${alert.message}</p>
                            <div class="d-flex gap-2">
                                <button class="btn-action" onclick="acknowledgeAlert(${alert.id})">Acknowledge</button>
                                ${alert.patientId ? `<button class="btn-action" onclick="window.location.href='/doctor/patients/${alert.patientId}'">Open EMR</button>` : ''}
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error('Error loading alerts:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle text-warning"></i>
                        <h4 class="fw-bold">Error Loading Alerts</h4>
                        <p class="text-muted">Could not load alerts. Please try refreshing the page.</p>
                    </div>
                `;
            }
        }

        async function acknowledgeAlert(id) {
            try {
                const response = await fetch(`/api/doctor/alerts/${id}/acknowledge`, {
                    method: 'POST'
                });

                if (response.ok) {
                    // Remove the alert from UI with animation
                    const alertElement = document.getElementById(`alert-${id}`);
                    if (alertElement) {
                        alertElement.style.transition = 'all 0.3s';
                        alertElement.style.opacity = '0';
                        alertElement.style.transform = 'translateX(100%)';
                        setTimeout(() => {
                            alertElement.remove();
                            // Check if container is empty
                            const container = document.getElementById('alertsContainer');
                            if (container.children.length === 0) {
                                loadAlerts();
                            }
                        }, 300);
                    }
                } else {
                    alert('Failed to acknowledge alert');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error acknowledging alert');
            }
        }

        async function clearAllAlerts() {
            if (!confirm('Are you sure you want to acknowledge all alerts?')) return;

            try {
                const response = await fetch('/api/doctor/alerts/clear-all', {
                    method: 'DELETE'
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`Cleared ${result.cleared} alerts`);
                    loadAlerts();
                } else {
                    alert('Failed to clear alerts');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error clearing alerts');
            }
        }

        function getTimeAgo(dateString) {
            if (!dateString) return 'Just now';
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;

            const diffHours = Math.floor(diffMins / 60);
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;

            const diffDays = Math.floor(diffHours / 24);
            return `${diffDays} day${diffDays > 1 ? 's' : ''} ago`;
        }

        function getSeverityBadge(severity) {
            const badges = {
                'CRITICAL': '<span class="badge bg-danger rounded-pill px-3">CRITICAL</span>',
                'WARNING': '<span class="badge bg-warning text-dark rounded-pill px-3">WARNING</span>',
                'INFO': '<span class="badge bg-info rounded-pill px-3">INFO</span>'
            };
            return badges[severity] || badges['INFO'];
        }

        function getAlertTypeIcon(alertType) {
            const icons = {
                'VITAL_ABNORMAL': '<i class="fas fa-heartbeat text-danger fs-5"></i>',
                'MEDICATION_DUE': '<i class="fas fa-pills text-warning fs-5"></i>',
                'STAT_ORDER': '<i class="fas fa-exclamation-triangle text-danger fs-5"></i>',
                'LAB_RESULT': '<i class="fas fa-vial text-warning fs-5"></i>',
                'OTHER': '<i class="fas fa-bell text-info fs-5"></i>'
            };
            return icons[alertType] || icons['OTHER'];
        }

        function getAlertTitle(alertType) {
            const titles = {
                'VITAL_ABNORMAL': 'Abnormal Vital Signs Detected',
                'MEDICATION_DUE': 'Medication Due/Missed',
                'STAT_ORDER': 'STAT Order Required',
                'LAB_RESULT': 'Critical Lab Result',
                'OTHER': 'Clinical Alert'
            };
            return titles[alertType] || 'Clinical Alert';
        }
    </script>
</body>

</html>
