<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursing Station - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        /* Nursing Station Pink Theme */

        .urgent-badge {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .patient-row {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.25rem;
            margin-bottom: 1rem;
            transition: all 0.2s ease;
        }

        .patient-row:hover {
            border-color: rgba(236, 72, 153, 0.4);
            transform: translateX(5px);
        }

        .vitals-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .vitals-normal {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .vitals-warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .vitals-critical {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
        }

        .task-item {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.2s ease;
        }

        .task-item:last-child {
            border-bottom: none;
        }

        .task-item:hover {
            background: rgba(236, 72, 153, 0.05);
        }

        .task-time {
            width: 60px;
            text-align: center;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .quick-action {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .quick-action:hover {
            border-color: #ec4899;
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px -10px rgba(236, 72, 153, 0.4);
            background: rgba(236, 72, 153, 0.08);
        }

        .quick-action i {
            font-size: 1.75rem;
            color: #ec4899;
            transition: transform 0.3s ease;
        }

        .quick-action:hover i {
            transform: scale(1.2) rotate(5deg);
        }

        .section-title {
            font-family: 'Outfit';
            font-weight: 700;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar (Independent Nurse Sidebar) -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-dash')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Innovative Header -->
            <div class="nurse-header d-flex justify-content-between align-items-center mb-4">
                <div class="position-relative" style="z-index: 1;">
                    <h2 class="fw-bold mb-1" style="font-family: 'Outfit';">Nursing Station</h2>
                    <p class="mb-0 opacity-75 small text-white">Patient vitals, medication administration, and ward task
                        management.</p>
                </div>
                <div class="d-flex flex-wrap gap-3" style="z-index: 1;">
                    <select id="wardSelect"
                        class="form-select form-select-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 150px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <select id="shiftSelect"
                        class="form-select form-select-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 120px;">
                        <option value="SHIFT_A" class="text-dark">Shift A</option>
                        <option value="SHIFT_B" class="text-dark">Shift B</option>
                        <option value="SHIFT_C" class="text-dark">Shift C</option>
                    </select>
                    <button class="btn btn-sm btn-light text-pink-600 fw-bold px-4 rounded-pill"
                        onclick="loadDashboard()">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </div>
            </div>

            <!-- Quick Stats Row -->
            <div class="row g-4 mb-4">
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="metric-icon bg-pink-500 bg-opacity-10 text-pink-500">
                                <i class="fas fa-bed"></i>
                            </div>
                            <div>
                                <div class="small text-muted text-uppercase fw-bold">Ward Patients</div>
                                <div class="h3 fw-bold mb-0 text-theme" id="statWardPatients">
                                    0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="metric-icon bg-amber-500 bg-opacity-10 text-amber-500">
                                <i class="fas fa-pills"></i>
                            </div>
                            <div>
                                <div class="small text-muted text-uppercase fw-bold">Meds Due</div>
                                <div class="h3 fw-bold mb-0 text-warning" id="statMedsDue">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="metric-icon bg-blue-500 bg-opacity-10 text-blue-400">
                                <i class="fas fa-heartbeat"></i>
                            </div>
                            <div>
                                <div class="small text-muted text-uppercase fw-bold">Vitals Pending</div>
                                <div class="h3 fw-bold mb-0 text-info" id="statVitalsPending">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 col-lg-3">
                    <div class="metric-card">
                        <div class="d-flex align-items-center gap-3">
                            <div class="metric-icon urgent-badge">
                                <i class="fas fa-exclamation-triangle text-white"></i>
                            </div>
                            <div>
                                <div class="small text-muted text-uppercase fw-bold">Critical Alerts</div>
                                <div class="h3 fw-bold mb-0 text-danger" id="statCriticalAlerts">0</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="row g-4 mb-4">
                <div class="col-12">
                    <h6 class="text-theme-muted smaller fw-bold text-uppercase ls-1 mb-3">Quick Actions</h6>
                </div>
                <div class="col-6 col-md-3">
                    <div class="quick-action">
                        <i class="fas fa-heartbeat"></i>
                        <div class="fw-bold small">Record Vitals</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="quick-action">
                        <i class="fas fa-pills"></i>
                        <div class="fw-bold small">Administer Meds</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="quick-action">
                        <i class="fas fa-notes-medical"></i>
                        <div class="fw-bold small">Add Note</div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="quick-action">
                        <i class="fas fa-bell"></i>
                        <div class="fw-bold small">Alert Doctor</div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Patient Watchlist -->
                <div class="col-lg-7">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="section-title mb-0 text-theme">Patient Watchlist</h5>
                        <a href="#" class="btn btn-sm btn-link text-decoration-none text-pink-500">View All <i
                                class="fas fa-arrow-right ms-1"></i></a>
                    </div>

                    <div id="patientWatchlistContainer">
                        <!-- Dynamic list -->
                    </div>
                </div>

                <!-- Medication Schedule -->
                <div class="col-lg-5">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="section-title mb-0 text-theme">Medication Schedule</h5>
                        <span class="badge rounded-pill bg-pink-500 bg-opacity-10 text-pink-500">Next 2 Hours</span>
                    </div>

                    <div class="task-card" id="medScheduleContainer">
                        <!-- Dynamic schedule -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initShift();
            loadWards();

            document.getElementById('wardSelect').addEventListener('change', loadDashboard);
            document.getElementById('shiftSelect').addEventListener('change', loadDashboard);
        });

        function initShift() {
            const hour = new Date().getHours();
            let shift = 'SHIFT_C';
            if (hour >= 8 && hour < 14) shift = 'SHIFT_A';
            else if (hour >= 14 && hour < 20) shift = 'SHIFT_B';

            document.getElementById('shiftSelect').value = shift;
        }

        async function loadWards() {
            try {
                const response = await fetch('/api/nursing/wards');
                const wards = await response.json();
                const select = document.getElementById('wardSelect');

                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.id;
                    option.textContent = ward.name;
                    option.className = 'text-dark';
                    select.appendChild(option);
                });

                if (wards.length > 0) {
                    select.value = wards[0].id;
                    loadDashboard();
                }
            } catch (error) {
                console.error('Error loading wards:', error);
            }
        }

        async function loadDashboard() {
            const wardId = document.getElementById('wardSelect').value;
            const shift = document.getElementById('shiftSelect').value;

            if (!wardId) return;

            try {
                const response = await fetch(`/api/nursing/dashboard?wardId=${wardId}&shift=${shift}`);
                const data = await response.json();

                updateStats(data);
                renderWatchlist(data.patientWatchlist);
                renderMedSchedule(data.medicationSchedule);
            } catch (error) {
                console.error('Error loading dashboard:', error);
            }
        }

        function updateStats(data) {
            document.getElementById('statWardPatients').textContent = data.wardPatients || 0;
            document.getElementById('statMedsDue').textContent = data.medsDue || 0;
            document.getElementById('statVitalsPending').textContent = data.vitalsPending || 0;
            document.getElementById('statCriticalAlerts').textContent = data.criticalAlerts || 0;
        }

        function renderWatchlist(watchlist) {
            const container = document.getElementById('patientWatchlistContainer');
            if (!watchlist || watchlist.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-muted">No patients in watchlist</div>';
                return;
            }

            container.innerHTML = watchlist.map(p => {
                const stabilityClass = getStabilityClass(p.stability);
                const iconColor = getIconColor(p.stability);
                const bgColor = getBgColor(p.stability);

                return `
                    <div class="patient-row">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center"
                                    style="width: 45px; height: 45px; background: ${bgColor};">
                                    <i class="fas fa-user" style="color: ${iconColor};"></i>
                                </div>
                                <div>
                                    <div class="fw-bold">${p.patientName}</div>
                                    <div class="small text-muted">${p.bedCode || 'No Bed'} • ${p.uhid}</div>
                                </div>
                            </div>
                            <div class="d-flex align-items-center gap-2">
                                <span class="vitals-badge ${stabilityClass}">${p.stability}</span>
                                <span class="small text-muted">BP: ${p.bpSummary || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMedSchedule(schedule) {
            const container = document.getElementById('medScheduleContainer');
            if (!schedule || schedule.length === 0) {
                container.innerHTML = '<div class="p-4 text-center text-muted">No medications scheduled</div>';
                return;
            }

            container.innerHTML = schedule.map(m => {
                const time = new Date(m.scheduledAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                return `
                    <div class="task-item">
                        <div class="task-time text-warning">${time}</div>
                        <div class="flex-grow-1">
                            <div class="fw-bold">${m.patientName} - ${m.bedCode || 'N/A'}</div>
                            <div class="small text-muted">${m.medicineName} ${m.dosage || ''} • ${m.route || ''}</div>
                        </div>
                        <button class="btn btn-sm btn-outline-success rounded-pill" onclick="location.href='/nurse/medications'">Give</button>
                    </div>
                `;
            }).join('');
        }

        function getStabilityClass(stability) {
            if (stability === 'CRITICAL') return 'vitals-critical';
            if (stability === 'OBSERVATION') return 'vitals-warning';
            return 'vitals-normal';
        }

        function getIconColor(stability) {
            if (stability === 'CRITICAL') return '#ef4444';
            if (stability === 'OBSERVATION') return '#f59e0b';
            return '#ec4899';
        }

        function getBgColor(stability) {
            if (stability === 'CRITICAL') return 'rgba(239, 68, 68, 0.1)';
            if (stability === 'OBSERVATION') return 'rgba(245, 158, 11, 0.1)';
            return 'rgba(236, 72, 153, 0.1)';
        }
    </script>
</body>

</html>
