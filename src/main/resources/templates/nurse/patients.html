<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Patients - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .nurse-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            transition: all 0.3s ease;
        }

        .nurse-card:hover {
            border-color: rgba(236, 72, 153, 0.4);
            box-shadow: 0 10px 30px -10px rgba(236, 72, 153, 0.15);
        }

        .stability-pill {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
            text-transform: uppercase;
        }

        .stability-critical {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .stability-stable {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .stability-observation {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .search-container {
            position: relative;
        }

        .search-container i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-container input {
            padding-left: 3rem;
            border-radius: 2rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .patient-row {
            padding: 1.25rem;
            border-bottom: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .patient-row:last-child {
            border-bottom: none;
        }

        .patient-row:hover {
            background: rgba(236, 72, 153, 0.05);
        }

        .bed-tag {
            background: var(--bg-tertiary);
            color: #ec4899;
            padding: 0.2rem 0.6rem;
            border-radius: 0.5rem;
            font-weight: 700;
            font-size: 0.85rem;
            border: 1px solid rgba(236, 72, 153, 0.2);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-patients')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Ward Patients</h1>
                    <p class="text-theme-muted mb-0">Manage patient admissions and assignments.</p>
                </div>
                <!-- Dynamic Ward Selector -->
                <div class="d-flex gap-2">
                    <select id="wardSelect"
                        class="form-select rounded-pill px-4 border-opacity-25 bg-secondary text-theme"
                        style="width: 200px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <button class="btn btn-pink-theme text-white fw-bold px-4 rounded-pill" data-bs-toggle="modal"
                        data-bs-target="#admitPatientModal">
                        <i class="fas fa-plus me-2"></i>Admit Patient
                    </button>
                    <button class="btn btn-sm btn-light text-pink-600 fw-bold px-4 rounded-pill"
                        onclick="loadWardPatients()">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </div>
            </div>

            <!-- Stats & Search -->
            <div class="row g-4 mb-4">
                <div class="col-md-9">
                    <div class="search-container">
                        <i class="fas fa-search"></i>
                        <input type="text" id="patientSearchInput" class="form-control"
                            placeholder="Search by Patient Name, UHID or Bed Number..." onkeyup="filterPatients()">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select rounded-pill bg-tertiary-theme border-color-theme text-theme"
                        id="stabilityFilter" onchange="filterPatients()">
                        <option value="ALL">All Stability Levels</option>
                        <option value="CRITICAL">Critical Only</option>
                        <option value="STABLE">Stable Only</option>
                        <option value="OBSERVATION">Observation Only</option>
                    </select>
                </div>
            </div>

            <!-- Patient List -->
            <div class="nurse-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table mb-0" style="vertical-align: middle;">
                        <thead class="bg-tertiary-theme">
                            <tr>
                                <th class="ps-4 py-3 text-theme-muted small text-uppercase fw-bold">Patient & Bed</th>
                                <th class="py-3 text-theme-muted small text-uppercase fw-bold">UHID / Vitals</th>
                                <th class="py-3 text-theme-muted small text-uppercase fw-bold">Stability</th>
                                <th class="pe-4 py-3 text-end text-theme-muted small text-uppercase fw-bold">Actions
                                </th>
                            </tr>
                        </thead>
                        <tbody id="patientsTableBody">
                            <!-- Dynamic rows will be inserted here -->
                            <tr>
                                <td colspan="4" class="text-center py-4 text-muted">Select a ward to view patients</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Admit Patient Modal -->
    <div class="modal fade" id="admitPatientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-theme">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold">Admit Patient to Ward</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="admitPatientForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Select Patient</label>
                            <select class="form-select bg-tertiary text-theme border-secondary" id="patientSelect"
                                required>
                                <option value="">Loading patients...</option>
                            </select>
                            <div class="form-text text-muted">Select a registered patient to admit.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Bed Code</label>
                            <input type="text" class="form-control bg-tertiary text-theme border-secondary"
                                id="bedCodeInput" placeholder="e.g. ICU-101" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-pink-theme text-white rounded-pill px-4"
                        onclick="submitAdmission()">Admit Patient</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Record Vitals Modal -->
    <div class="modal fade" id="vitalsModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-secondary text-theme">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold">Record Vitals</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="vitalsForm">
                        <input type="hidden" id="vitalsAssignmentId">
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">BP (mmHg)</label>
                                <input type="text" class="form-control bg-tertiary text-theme border-secondary"
                                    id="vitalBP" placeholder="120/80">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Pulse (bpm)</label>
                                <input type="number" class="form-control bg-tertiary text-theme border-secondary"
                                    id="vitalPulse" placeholder="72">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Temp (°C)</label>
                                <input type="number" step="0.1"
                                    class="form-control bg-tertiary text-theme border-secondary" id="vitalTemp"
                                    placeholder="37.0">
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">SpO2 (%)</label>
                                <input type="number" class="form-control bg-tertiary text-theme border-secondary"
                                    id="vitalSpo2" placeholder="98">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-light rounded-pill" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-pink-theme text-white rounded-pill px-4"
                        onclick="saveContextVitals()">Save Vitals</button>
                </div>
            </div>
        </div>
    </div>

    <!-- View Patient Modal -->
    <div class="modal fade" id="viewPatientModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-secondary text-theme">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold">Patient Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="patientDetailsContent" class="text-center py-4">
                        <i class="fas fa-spinner fa-spin"></i> Loading...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        let currentPatients = [];
        let vitalsModal, viewPatientModal;

        document.addEventListener('DOMContentLoaded', function () {
            loadWards();
            loadAllPatientsForSelect();

            // Initialize modals
            const vitalsModalEl = document.getElementById('vitalsModal');
            if (vitalsModalEl) vitalsModal = new bootstrap.Modal(vitalsModalEl);

            const viewPatientModalEl = document.getElementById('viewPatientModal');
            if (viewPatientModalEl) viewPatientModal = new bootstrap.Modal(viewPatientModalEl);

            document.getElementById('wardSelect').addEventListener('change', loadWardPatients);
        });

        async function loadWards() {
            try {
                const response = await fetch('/api/nursing/wards');
                const wards = await response.json();

                const select = document.getElementById('wardSelect');
                select.innerHTML = '<option value="" class="text-dark">Select Ward</option>';

                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.id;
                    option.textContent = `${ward.name} (${ward.code})`;
                    option.className = 'text-dark';
                    select.appendChild(option);
                });

                // Auto-select first ward
                if (wards.length > 0) {
                    select.value = wards[0].id;
                    loadWardPatients();
                }
            } catch (error) {
                console.error('Error loading wards:', error);
            }
        }

        async function loadAllPatientsForSelect() {
            try {
                // Fetch first page of patients
                const response = await fetch('/api/lab/patients?page=0&size=100');
                const data = await response.json();
                const patients = data.content || [];

                const select = document.getElementById('patientSelect');
                select.innerHTML = '<option value="">Select Patient...</option>';

                patients.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.id;
                    option.textContent = `${p.name} (UHID: ${p.uhid || 'N/A'})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading patients:', error);
                document.getElementById('patientSelect').innerHTML = '<option value="">Error loading patients</option>';
            }
        }

        async function loadWardPatients() {
            const wardId = document.getElementById('wardSelect').value;
            const tbody = document.getElementById('patientsTableBody');

            if (!wardId) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">Select a ward to view patients</td></tr>';
                return;
            }

            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted"><i class="fas fa-spinner fa-spin me-2"></i>Loading patients...</td></tr>';

            try {
                const response = await fetch(`/api/nursing/patients?wardId=${wardId}`);
                currentPatients = await response.json(); // Store for filter
                renderPatients(currentPatients);
            } catch (error) {
                console.error('Error loading ward patients:', error);
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-danger">Error loading patients</td></tr>';
            }
        }

        function renderPatients(patients) {
            const tbody = document.getElementById('patientsTableBody');

            if (!patients || patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No patients assigned to this ward</td></tr>';
                return;
            }

            tbody.innerHTML = '';

            patients.forEach(p => {
                const row = document.createElement('tr');
                row.className = 'patient-row';

                const stability = p.stability || 'STABLE';
                let stabilityClass = 'stability-stable';
                if (stability === 'CRITICAL') stabilityClass = 'stability-critical';
                if (stability === 'OBSERVATION') stabilityClass = 'stability-observation';

                row.innerHTML = `
                    <td class="ps-4">
                        <div class="d-flex align-items-center gap-3">
                            <span class="bed-tag">${p.bedCode || 'No Bed'}</span>
                            <div>
                                <div class="fw-bold fs-6">${p.patientName}</div>
                                <div class="small text-muted">${p.gender || 'Unknown'}, ${p.age || '?'}y</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <code>${p.uhid || 'No UHID'}</code>
                        <div class="small text-muted mt-1"><i class="fas fa-heartbeat text-danger me-1"></i>
                            ${p.lastVitals || '--/--'}</div>
                    </td>
                    <td><span class="stability-pill ${stabilityClass}">${stability.charAt(0) + stability.toLowerCase().slice(1)}</span></td>
                    <td class="pe-4 text-end">
                        <button class="btn btn-sm btn-outline-pink rounded-pill px-3" 
                                style="border-color: #ec4899; color: #ec4899;" 
                                onclick="openVitalsModal(${p.id})">Vitals</button>
                        <button class="btn btn-sm btn-pink text-white rounded-pill px-3" 
                                style="background: #ec4899;"
                                onclick="openViewModal(${p.patientId})">View</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        async function submitAdmission() {
            const wardId = document.getElementById('wardSelect').value;
            const patientId = document.getElementById('patientSelect').value;
            const bedCode = document.getElementById('bedCodeInput').value;

            if (!wardId) {
                alert('Please select a ward first.');
                return;
            }
            if (!patientId || !bedCode) {
                alert('Please select a patient and enter a bed code.');
                return;
            }

            try {
                const response = await fetch('/api/nursing/assignments', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        wardId: parseInt(wardId),
                        patientId: parseInt(patientId),
                        bedCode: bedCode
                    })
                });

                if (response.ok) {
                    const modalEl = document.getElementById('admitPatientModal');
                    const modal = bootstrap.Modal.getInstance(modalEl);
                    if (modal) modal.hide();

                    document.getElementById('admitPatientForm').reset();
                    loadWardPatients();
                    alert('Patient admitted successfully!');
                } else {
                    alert('Failed to admit patient. Please check bed availability.');
                }
            } catch (error) {
                console.error('Error admitting patient:', error);
                alert('An error occurred during admission.');
            }
        }

        function filterPatients() {
            const search = document.getElementById('patientSearchInput').value.toLowerCase();
            const stability = document.getElementById('stabilityFilter').value;
            const rows = document.querySelectorAll('.patient-row');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                const rowStabilityText = row.querySelector('.stability-pill').textContent.toUpperCase();

                const matchesSearch = text.includes(search);
                const matchesStability = stability === 'ALL' || rowStabilityText === stability;

                row.style.display = matchesSearch && matchesStability ? '' : 'none';
            });
        }

        // New Logic for Vitals and View
        function openVitalsModal(assignmentId) {
            document.getElementById('vitalsAssignmentId').value = assignmentId;
            document.getElementById('vitalsForm').reset();
            if (vitalsModal) vitalsModal.show();
        }

        async function saveContextVitals() {
            const assignmentId = document.getElementById('vitalsAssignmentId').value;
            const wardId = document.getElementById('wardSelect').value;

            const vitals = {
                assignmentId: parseInt(assignmentId),
                bp: document.getElementById('vitalBP').value,
                pulse: document.getElementById('vitalPulse').value,
                temp: document.getElementById('vitalTemp').value,
                spo2: document.getElementById('vitalSpo2').value
            };

            if (!vitals.bp && !vitals.pulse && !vitals.temp && !vitals.spo2) {
                alert('Enter at least one vital sign');
                return;
            }

            try {
                // Batch endpoint requires array
                const response = await fetch(`/api/nursing/vitals/batch?wardId=${wardId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify([vitals])
                });

                if (response.ok) {
                    vitalsModal.hide();
                    loadWardPatients();
                    alert('Vitals recorded successfully');
                } else {
                    alert('Failed to save vitals');
                }
            } catch (error) {
                console.error(error);
                alert('Error recording vitals');
            }
        }

        async function openViewModal(patientId) {
            if (viewPatientModal) viewPatientModal.show();
            const content = document.getElementById('patientDetailsContent');
            content.innerHTML = '<div class="text-center py-4"><i class="fas fa-spinner fa-spin"></i> Loading details...</div>';

            try {
                const response = await fetch(`/api/lab/patients/${patientId}`);
                if (!response.ok) throw new Error('Failed to fetch');
                const p = await response.json();

                content.innerHTML = `
                    <div class="row text-start px-3">
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted text-uppercase fw-bold">Full Name</label>
                            <div class="fw-bold fs-5">${p.name}</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted text-uppercase fw-bold">UHID</label>
                            <div class="fw-bold fs-5">${p.uhid || 'N/A'}</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted text-uppercase fw-bold">Phone</label>
                            <div>${p.phone || 'N/A'}</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="small text-muted text-uppercase fw-bold">DOB / Age</label>
                            <div>${p.dateOfBirth || '-'} (${p.age || '?'}y)</div>
                        </div>
                         <div class="col-md-12 mb-3">
                            <label class="small text-muted text-uppercase fw-bold">Emergency Contact</label>
                            <div>${p.emergencyContactName || '-'} (${p.emergencyContactRelationship || '-'}) : ${p.emergencyContactPhone || '-'}</div>
                        </div>
                         <div class="col-md-12">
                            <label class="small text-muted text-uppercase fw-bold">Address</label>
                            <div>${p.address || 'N/A'}</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                content.innerHTML = '<div class="text-center text-danger py-4">Failed to load patient details</div>';
            }
        }
    </script>
</body>

</html>
