<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medication Administration - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-meds')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="nurse-header d-flex justify-content-between align-items-center mb-4 text-white">
                <div class="position-relative" style="z-index: 1;">
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit';">Medication Schedule (MAR)</h1>
                    <p class="mb-0 opacity-75 small">Record and monitor medication administration for Ward-C</p>
                </div>
                <div class="d-flex flex-wrap gap-3" style="z-index: 1;">
                    <select id="wardSelect"
                        class="form-select form-select-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 150px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <input type="date" id="marDate"
                        class="form-control form-control-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 160px;">
                    <button class="btn btn-sm btn-light text-theme fw-bold px-4 rounded-pill" onclick="loadMAR()">
                        <i class="fas fa-sync-alt me-2"></i>Refresh
                    </button>
                </div>
            </div>

            <div id="marPatientsContainer">
                <!-- Dynamic MAR content -->
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initDate();
            loadWards();

            document.getElementById('wardSelect').addEventListener('change', loadMAR);
            document.getElementById('marDate').addEventListener('change', loadMAR);
        });

        function initDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('marDate').value = today;
        }

        async function loadWards() {
            try {
                const response = await fetch('/api/nursing/wards');
                const wards = await response.json();
                const select = document.getElementById('wardSelect');

                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.id;
                    option.textContent = ward.name;
                    option.className = 'text-dark';
                    select.appendChild(option);
                });

                if (wards.length > 0) {
                    select.value = wards[0].id;
                    loadMAR();
                }
            } catch (error) {
                console.error('Error loading wards:', error);
            }
        }

        async function loadMAR() {
            const wardId = document.getElementById('wardSelect').value;
            const date = document.getElementById('marDate').value;

            if (!wardId || !date) return;

            try {
                const response = await fetch(`/api/nursing/medications?wardId=${wardId}&date=${date}`);
                const meds = await response.json();

                // Also need patients for this ward to group them
                const pResponse = await fetch(`/api/nursing/patients?wardId=${wardId}`);
                const patients = await pResponse.json();

                renderMAR(patients, meds);
            } catch (error) {
                console.error('Error loading MAR:', error);
            }
        }

        function renderMAR(patients, meds) {
            const container = document.getElementById('marPatientsContainer');
            if (patients.length === 0) {
                container.innerHTML = '<div class="glass-card p-5 text-center text-muted">No patients assigned to this ward</div>';
                return;
            }

            container.innerHTML = patients.map(p => {
                const patientMeds = meds.filter(m => m.assignmentId === p.assignmentId);
                const dueCount = patientMeds.filter(m => m.status === 'DUE').length;
                const statusBadge = dueCount > 0
                    ? `<span class="badge bg-danger rounded-pill px-3">${dueCount} Meds Due</span>`
                    : `<span class="badge bg-success rounded-pill px-3">All Administered</span>`;

                return `
                    <div class="glass-card p-0 mb-4 overflow-hidden border-color-theme">
                        <div class="bg-primary bg-opacity-10 p-3 px-4 border-bottom border-color-theme d-flex justify-content-between align-items-center">
                            <div class="d-flex align-items-center gap-3">
                                <span class="badge bg-secondary py-2 px-3 rounded-pill">${p.bedCode || 'N/A'}</span>
                                <h5 class="fw-bold mb-0" style="font-family: 'Outfit';">${p.patientName}</h5>
                                <span class="text-muted small">${p.uhid} • ${p.age || ''}y / ${p.gender || ''}</span>
                            </div>
                            <div class="text-end">${statusBadge}</div>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-premium align-middle mb-0">
                                <tbody>
                                    ${patientMeds.length > 0 ? patientMeds.map(m => renderMedRow(m)).join('') : '<tr><td colspan="3" class="text-center p-4 text-muted">No medications scheduled for this patient today</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMedRow(m) {
            const time = new Date(m.scheduledAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const isDone = m.status === 'DONE';

            return `
                <tr>
                    <td class="med-info" style="width: 30%;">
                        <div class="fw-bold fs-6">${m.medicineName} ${m.dosage || ''}</div>
                        <div class="small text-muted mb-2">${m.route || ''} ${m.instructions ? '• ' + m.instructions : ''}</div>
                    </td>
                    <td>
                        <div class="d-flex gap-3">
                            <div class="dose-slot ${isDone ? 'done' : 'due'}">
                                <div class="dose-time">${time}</div>
                                <i class="fas ${isDone ? 'fa-check-circle' : 'fa-clock'}"></i>
                                <div class="dose-status">${isDone ? 'Done' : 'Due Now'}</div>
                            </div>
                        </div>
                    </td>
                    <td class="text-end">
                        ${isDone
                    ? '<span class="text-success small"><i class="fas fa-check me-1"></i> Administered</span>'
                    : `<button class="btn btn-pink-theme text-white rounded-pill px-4" onclick="administerMed(${m.id})">Administer</button>`
                }
                    </td>
                </tr>
            `;
        }

        async function administerMed(id) {
            if (!confirm('Confirm administration of this medication?')) return;

            try {
                const response = await fetch(`/api/nursing/medications/${id}/administer`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes: 'Administered at bedside' })
                });

                if (response.ok) {
                    loadMAR();
                } else {
                    alert('Error recording administration');
                }
            } catch (error) {
                console.error('Error administering medication:', error);
                alert('Connection error');
            }
        }
    </script>
</body>

</html>
