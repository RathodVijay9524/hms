<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Alerts - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .alert-feed-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .alert-feed-card:hover {
            transform: scale(1.01);
        }

        .alert-critical {
            border-left: 5px solid #ef4444;
        }

        .alert-warning {
            border-left: 5px solid #f59e0b;
        }

        .alert-info {
            border-left: 5px solid #3b82f6;
        }

        .alert-time {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .acknowledge-btn {
            background: rgba(236, 72, 153, 0.1);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 2rem;
            font-size: 0.8rem;
            padding: 0.35rem 1rem;
            transition: all 0.2s;
        }

        .acknowledge-btn:hover {
            background: #ec4899;
            color: white;
        }

        .patient-mini-tag {
            background: var(--bg-tertiary);
            padding: 0.25rem 0.75rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0);
            }
        }

        .pulse-critical {
            animation: pulse-red 2s infinite;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-alerts')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Critical Alerts</h1>
                    <p class="text-theme-muted mb-0">Real-time clinical monitoring feed for Ward-C</p>
                </div>
                <div class="d-flex gap-2">
                    <select id="wardSelect"
                        class="form-select rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 200px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <button class="btn btn-outline-danger rounded-pill px-4 border-opacity-25">
                        <i class="fas fa-check-double me-2"></i>Acknowledge All
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-12">
                    <div id="alertsContainer"></div>
                </div>
            </div>
            <script>
                document.addEventListener('DOMContentLoaded', function () {
                    loadWards();
                });

                async function loadWards() {
                    try {
                        const response = await fetch('/api/nursing/wards');
                        const wards = await response.json();
                        const select = document.getElementById('wardSelect');

                        if (select) {
                            wards.forEach(ward => {
                                const option = document.createElement('option');
                                option.value = ward.id;
                                option.textContent = ward.name;
                                option.className = 'text-dark';
                                select.appendChild(option);
                            });

                            if (wards.length > 0) {
                                select.value = wards[0].id; // Default to first ward
                                loadAlerts();
                            }

                            select.addEventListener('change', loadAlerts);
                        }
                    } catch (error) {
                        console.error('Error loading wards:', error);
                    }
                }

                async function loadAlerts() {
                    const wardId = document.getElementById('wardSelect').value;
                    const container = document.getElementById('alertsContainer');

                    if (!wardId) return;

                    container.innerHTML = '<div class="text-center p-5"><i class="fas fa-spinner fa-spin fa-2x text-theme"></i></div>';

                    try {
                        const response = await fetch(`/api/nursing/alerts?wardId=${wardId}`);
                        const alerts = await response.json();
                        renderAlerts(alerts);
                    } catch (error) {
                        console.error('Error loading alerts:', error);
                        container.innerHTML = '<div class="text-center p-5 text-danger">Error loading alerts</div>';
                    }
                }

                function renderAlerts(alerts) {
                    const container = document.getElementById('alertsContainer');
                    if (alerts.length === 0) {
                        container.innerHTML = `
                    <div class="alert-feed-card p-5 text-center">
                        <i class="fas fa-check-circle text-success fs-1 mb-3"></i>
                        <h5 class="text-theme fw-bold">All Clear</h5>
                        <p class="text-muted mb-0">No active alerts for this ward.</p>
                    </div>`;
                        return;
                    }

                    container.innerHTML = alerts.map(alert => {
                        const style = getAlertStyle(alert.severity, alert.alertType);
                        const timeAgo = getTimeAgo(alert.createdDate);

                        return `
                    <div class="alert-feed-card ${style.cardClass}" id="alert-${alert.id}">
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="rounded-circle ${style.iconBg} d-flex align-items-center justify-content-center"
                                        style="width: 48px; height: 48px;">
                                        <i class="${style.icon} ${style.iconColor} fs-4"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0 text-white">${formatAlertType(alert.alertType)}</h6>
                                        <span class="alert-time">${timeAgo}</span>
                                    </div>
                                </div>
                                <button class="acknowledge-btn" onclick="acknowledgeAlert(${alert.id})">
                                    ${alert.isAcknowledged ? 'Acknowledged' : 'Confirm Acknowledgement'}
                                </button>
                            </div>
                            <div class="mb-3">
                                ${alert.assignmentId ?
                                `<span class="patient-mini-tag me-2">Assignment #${alert.assignmentId}</span>` :
                                '<span class="patient-mini-tag me-2">General Ward</span>'}
                                <span class="badge ${style.badgeClass} rounded-pill">${alert.severity}</span>
                            </div>
                            <p class="small text-muted mb-0">${alert.message}</p>
                        </div>
                    </div>
                `;
                    }).join('');
                }

                async function acknowledgeAlert(id) {
                    try {
                        const res = await fetch(`/api/nursing/alerts/${id}/ack`, { method: 'PATCH' });
                        if (res.ok) {
                            // Remove from view or mark visually
                            const card = document.getElementById(`alert-${id}`);
                            if (card) {
                                card.style.opacity = '0.5';
                                setTimeout(() => card.remove(), 1000); // Remove after delay
                            }
                            loadAlerts(); // Reload to be sure
                        }
                    } catch (e) { console.error(e); }
                }

                function getAlertStyle(severity, type) {
                    if (severity === 'CRITICAL') {
                        return {
                            cardClass: 'alert-critical pulse-critical',
                            iconBg: 'bg-danger-subtle',
                            icon: 'fas fa-heart-pulse',
                            iconColor: 'text-danger',
                            badgeClass: 'bg-danger'
                        };
                    } else if (severity === 'HIGH' || severity === 'WARNING') { // Handle WARNING if mapped
                        return {
                            cardClass: 'alert-warning',
                            iconBg: 'bg-warning-subtle',
                            icon: 'fas fa-exclamation-triangle',
                            iconColor: 'text-warning',
                            badgeClass: 'bg-warning text-dark'
                        };
                    } else {
                        return {
                            cardClass: 'alert-info',
                            iconBg: 'bg-primary-subtle',
                            icon: 'fas fa-info-circle',
                            iconColor: 'text-primary',
                            badgeClass: 'bg-primary'
                        };
                    }
                }

                function formatAlertType(type) {
                    return type ? type.replace(/_/g, ' ') : 'Alert';
                }

                function getTimeAgo(dateString) {
                    if (!dateString) return '';
                    const date = new Date(dateString);
                    const now = new Date();
                    const diffMs = now - date;
                    const diffMins = Math.floor(diffMs / 60000);

                    if (diffMins < 1) return 'Just now';
                    if (diffMins < 60) return `${diffMins} mins ago`;
                    const diffHours = Math.floor(diffMins / 60);
                    if (diffHours < 24) return `${diffHours} hours ago`;
                    return date.toLocaleDateString();
                }
            </script>
</body>

</html>
