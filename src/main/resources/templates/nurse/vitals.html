<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals Tracking - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .vitals-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .batch-table th {
            background: var(--bg-tertiary);
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem;
        }

        .vitals-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            width: 100%;
            text-align: center;
        }

        .vitals-input:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        .abnormal-pulse {
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        .save-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 5rem;
            border: 1px solid rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            width: fit-content;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-vitals')}"></div>

    <main class="main-content" style="padding-bottom: 8rem;">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Batch Vitals Entry</h1>
                    <p class="text-theme-muted mb-0">Record vitals for all patients in Ward-C</p>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <select id="wardSelect"
                        class="form-select rounded-pill px-4 border-opacity-25 bg-transparent text-white"
                        style="width: 200px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <span class="badge rounded-pill bg-success-subtle text-success px-3 py-2"
                        id="lastSyncTime">Syncing...</span>
                </div>
            </div>

            <div class="vitals-card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" style="vertical-align: middle;">
                        <thead class="bg-tertiary-theme">
                            <tr>
                                <th style="width: 250px;" class="text-theme-muted small text-uppercase fw-bold">Patient
                                    Name</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Bed</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">BP (systolic/dia)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Temp (°F)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Pulse (bpm)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">SpO2 (%)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="vitalsTableBody">
                            <!-- Dynamic rows will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Float Save Bar -->
            <div class="save-bar">
                <div class="d-none d-md-block">
                    <span class="text-muted small">Auto-saving in 15s</span>
                </div>
                <div class="divider d-none d-md-block"
                    style="width: 1px; height: 20px; background: rgba(255,255,255,0.1);"></div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary rounded-pill px-4" onclick="location.reload()">Reset
                        Form</button>
                    <button id="saveVitalsBtn" class="btn btn-pink-theme text-white fw-bold px-5 rounded-pill"
                        onclick="saveAllVitals()">
                        Save All Vitals
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            loadWards();
            document.getElementById('wardSelect').addEventListener('change', loadPatients);
        });

        async function loadWards() {
            try {
                const response = await fetch('/api/nursing/wards');
                const wards = await response.json();
                const select = document.getElementById('wardSelect');

                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.id;
                    option.textContent = ward.name;
                    option.className = 'text-dark';
                    select.appendChild(option);
                });

                if (wards.length > 0) {
                    select.value = wards[0].id; // Optional: Default to first ward
                    loadPatients();
                }
            } catch (error) {
                console.error('Error loading wards:', error);
            }
        }

        async function loadPatients() {
            const wardId = document.getElementById('wardSelect').value;
            if (!wardId) return;

            document.getElementById('lastSyncTime').textContent = 'Syncing...';

            try {
                const response = await fetch(`/api/nursing/patients?wardId=${wardId}`);
                const patients = await response.json();
                renderPatients(patients);
                document.getElementById('lastSyncTime').textContent = 'Last Sync: Just Now';
            } catch (error) {
                console.error('Error loading patients:', error);
                document.getElementById('lastSyncTime').textContent = 'Sync Error';
            }
        }

        function renderPatients(patients) {
            const tbody = document.getElementById('vitalsTableBody');
            if (patients.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5 text-muted">No patients assigned to this ward</td></tr>';
                return;
            }

            tbody.innerHTML = patients.map(p => `
                <tr data-patient-id="${p.patientId}">
                    <td>
                        <div class="fw-bold">${p.patientName}</div>
                        <div class="small text-muted">${p.uhid || 'N/A'}</div>
                    </td>
                    <td><span class="badge bg-secondary">${p.bedCode || 'N/A'}</span></td>
                    <td><input type="text" class="vitals-input bp-input" placeholder="120/80" value="${p.bpSummary || ''}"></td>
                    <td><input type="number" step="0.1" class="vitals-input temp-input" placeholder="98.6"></td>
                    <td><input type="number" class="vitals-input pulse-input" placeholder="72"></td>
                    <td><input type="number" class="vitals-input spo2-input" placeholder="98"></td>
                    <td><input type="text" class="vitals-input text-start px-3 remark-input" placeholder="Add remark..."></td>
                </tr>
            `).join('');
        }

        async function saveAllVitals() {
            const wardId = document.getElementById('wardSelect').value;
            if (!wardId) {
                alert('Please select a ward first');
                return;
            }

            const btn = document.getElementById('saveVitalsBtn');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = 'Saving...';

            const entries = [];
            const rows = document.querySelectorAll('#vitalsTableBody tr[data-patient-id]');

            rows.forEach(row => {
                const patientId = row.getAttribute('data-patient-id');
                const bp = row.querySelector('.bp-input').value;
                const temperature = row.querySelector('.temp-input').value;
                const pulse = row.querySelector('.pulse-input').value;
                const oxygenLevel = row.querySelector('.spo2-input').value;

                // Only add if at least one value is entered
                if (bp || temperature || pulse || oxygenLevel) {
                    entries.push({
                        patientId: parseInt(patientId),
                        bp: bp || null,
                        temperature: temperature ? parseFloat(temperature) : null,
                        pulse: pulse ? parseInt(pulse) : null,
                        oxygenLevel: oxygenLevel ? parseInt(oxygenLevel) : null
                    });
                }
            });

            if (entries.length === 0) {
                alert('No data entered to save');
                btn.disabled = false;
                btn.textContent = originalText;
                return;
            }

            try {
                const response = await fetch(`/api/nursing/vitals/batch?wardId=${wardId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(entries)
                });

                if (response.ok) {
                    alert('Vitals saved successfully!');
                    loadPatients(); // Refresh to clear/update
                } else {
                    alert('Error saving vitals');
                }
            } catch (error) {
                console.error('Error saving vitals:', error);
                alert('Connection error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        }
    </script>
</body>

</html>
