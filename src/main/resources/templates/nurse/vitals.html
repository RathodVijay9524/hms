<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitals Tracking - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .vitals-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .batch-table th {
            background: var(--bg-tertiary);
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem;
        }

        .vitals-input {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            color: var(--text-primary);
            padding: 0.5rem 0.75rem;
            width: 100%;
            text-align: center;
        }

        .vitals-input:focus {
            outline: none;
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.1);
        }

        .abnormal-pulse {
            border-color: #ef4444 !important;
            color: #ef4444 !important;
        }

        .save-bar {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-secondary);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            border-radius: 5rem;
            border: 1px solid rgba(236, 72, 153, 0.3);
            display: flex;
            align-items: center;
            gap: 2rem;
            box-shadow: 0 20px 50px -15px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            width: fit-content;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-vitals')}"></div>

    <main class="main-content" style="padding-bottom: 8rem;">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Batch Vitals Entry</h1>
                    <p class="text-theme-muted mb-0">Record vitals for all patients in Ward-C</p>
                </div>
                <div>
                    <span class="badge rounded-pill bg-success-subtle text-success px-3 py-2">Last Sync: 2 mins
                        ago</span>
                </div>
            </div>

            <div class="vitals-card">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" style="vertical-align: middle;">
                        <thead class="bg-tertiary-theme">
                            <tr>
                                <th style="width: 250px;" class="text-theme-muted small text-uppercase fw-bold">Patient
                                    Name</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Bed</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">BP (systolic/dia)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Temp (°F)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Pulse (bpm)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">SpO2 (%)</th>
                                <th class="text-theme-muted small text-uppercase fw-bold">Notes</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="fw-bold">Robert Downey</div>
                                    <div class="small text-muted">Post-Op Recovery</div>
                                </td>
                                <td><span class="badge bg-secondary">C-101</span></td>
                                <td><input type="text" class="vitals-input" placeholder="120/80" value="110/80"></td>
                                <td><input type="text" class="vitals-input" placeholder="98.6" value="98.4"></td>
                                <td><input type="text" class="vitals-input abnormal-pulse" placeholder="72" value="95">
                                </td>
                                <td><input type="text" class="vitals-input" placeholder="98" value="97"></td>
                                <td><input type="text" class="vitals-input text-start px-3" placeholder="Add remark...">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="fw-bold">Wanda Maximoff</div>
                                    <div class="small text-muted">Trauma Ward</div>
                                </td>
                                <td><span class="badge bg-secondary">C-105</span></td>
                                <td><input type="text" class="vitals-input" placeholder="120/80" value="140/95"></td>
                                <td><input type="text" class="vitals-input" placeholder="98.6" value="101.2"></td>
                                <td><input type="text" class="vitals-input" placeholder="72" value="108"></td>
                                <td><input type="text" class="vitals-input abnormal-pulse" placeholder="98" value="92">
                                </td>
                                <td><input type="text" class="vitals-input text-start px-3" placeholder="Add remark...">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="fw-bold">Peter Parker</div>
                                    <div class="small text-muted">Observation</div>
                                </td>
                                <td><span class="badge bg-secondary">C-108</span></td>
                                <td><input type="text" class="vitals-input" placeholder="120/80"></td>
                                <td><input type="text" class="vitals-input" placeholder="98.6"></td>
                                <td><input type="text" class="vitals-input" placeholder="72"></td>
                                <td><input type="text" class="vitals-input" placeholder="98"></td>
                                <td><input type="text" class="vitals-input text-start px-3" placeholder="Add remark...">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Float Save Bar -->
            <div class="save-bar">
                <div class="d-none d-md-block">
                    <span class="text-muted small">Auto-saving in 15s</span>
                </div>
                <div class="divider d-none d-md-block"
                    style="width: 1px; height: 20px; background: rgba(255,255,255,0.1);"></div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary rounded-pill px-4">Reset Form</button>
                    <button class="btn btn-pink-theme text-white fw-bold px-5 rounded-pill">
                        Save All Vitals
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
