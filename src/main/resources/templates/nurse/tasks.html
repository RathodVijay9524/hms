<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ward Tasks - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .task-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .task-card:hover {
            border-color: #ec4899;
            transform: translateX(5px);
        }

        .task-checkbox {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .task-card:hover .task-checkbox {
            border-color: #ec4899;
        }

        .task-tag {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 2rem;
            text-transform: uppercase;
            margin-right: 0.5rem;
        }

        .tag-high {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .tag-medium {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .tag-low {
            background: rgba(34, 197, 94, 0.15);
            color: #22c55e;
        }

        .progress-mini {
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2rem;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/nurse_sidebar :: nurse_sidebar('nurse-tasks')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Ward Tasks</h1>
                    <p class="text-theme-muted mb-0">Daily procedure checklist for Ward-C</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <input type="date" id="taskDate"
                        class="form-control form-control-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: auto;">

                    <select id="wardSelect"
                        class="form-select form-select-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 150px;">
                        <option value="" class="text-dark">Select Ward</option>
                    </select>
                    <select id="shiftSelect"
                        class="form-select form-select-sm rounded-pill px-3 border-opacity-25 bg-transparent text-white"
                        style="width: 120px;">
                        <option value="SHIFT_A" class="text-dark">Shift A</option>
                        <option value="SHIFT_B" class="text-dark">Shift B</option>
                        <option value="SHIFT_C" class="text-dark">Shift C</option>
                    </select>
                    <button class="btn btn-pink-theme text-white fw-bold px-4 rounded-pill" data-bs-toggle="modal"
                        data-bs-target="#addTaskModal">
                        <i class="fas fa-plus me-2"></i>Custom Task
                    </button>
                </div>
            </div>

            <!-- Task Categories -->
            <div class="row g-4">
                <div class="col-lg-12">
                    <div id="tasksContainer">
                        <!-- Dynamic tasks will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-secondary text-white border-color-theme">
                <div class="modal-header border-color-theme">
                    <h5 class="modal-title fw-bold">Create New Ward Task</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTaskForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Task Title</label>
                            <input type="text" id="taskTitle" class="form-control bg-dark text-white border-color-theme"
                                required placeholder="e.g. Dressing Change">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted">Description</label>
                            <textarea id="taskDescription" class="form-control bg-dark text-white border-color-theme"
                                rows="3" placeholder="Additional details..."></textarea>
                        </div>
                        <div class="row mb-3">
                            <div class="col-6">
                                <label class="form-label small text-muted">Priority</label>
                                <select id="taskPriority" class="form-select bg-dark text-white border-color-theme">
                                    <option value="LOW">Low</option>
                                    <option value="MEDIUM" selected>Medium</option>
                                    <option value="HIGH">High</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label small text-muted">Due Time</label>
                                <input type="time" id="taskDueTime"
                                    class="form-control bg-dark text-white border-color-theme">
                            </div>
                        </div>
                        <div class="mb-3" id="patientSelectContainer">
                            <label class="form-label small text-muted">Assign to Patient (Optional)</label>
                            <select id="taskAssignmentId" class="form-select bg-dark text-white border-color-theme">
                                <option value="">General Ward Task</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-color-theme">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-pink-theme text-white" onclick="saveCustomTask()">Save
                        Task</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            initShift();
            document.getElementById('taskDate').valueAsDate = new Date();
            loadWards();

            document.getElementById('wardSelect').addEventListener('change', () => {
                loadTasks();
                loadPatientsForAssign();
            });
            document.getElementById('shiftSelect').addEventListener('change', loadTasks);
            document.getElementById('taskDate').addEventListener('change', loadTasks);
        });

        function initShift() {
            const hour = new Date().getHours();
            let shift = 'SHIFT_C';
            if (hour >= 8 && hour < 14) shift = 'SHIFT_A';
            else if (hour >= 14 && hour < 20) shift = 'SHIFT_B';

            document.getElementById('shiftSelect').value = shift;
        }

        async function loadWards() {
            try {
                const response = await fetch('/api/nursing/wards');
                const wards = await response.json();
                const select = document.getElementById('wardSelect');

                wards.forEach(ward => {
                    const option = document.createElement('option');
                    option.value = ward.id;
                    option.textContent = ward.name;
                    option.className = 'text-dark';
                    select.appendChild(option);
                });

                if (wards.length > 0) {
                    select.value = wards[0].id;
                    loadTasks();
                    loadPatientsForAssign();
                }
            } catch (error) {
                console.error('Error loading wards:', error);
            }
        }

        async function loadPatientsForAssign() {
            const wardId = document.getElementById('wardSelect').value;
            if (!wardId) return;

            try {
                const response = await fetch(`/api/nursing/patients?wardId=${wardId}`);
                const patients = await response.json();
                const select = document.getElementById('taskAssignmentId');

                select.innerHTML = '<option value="">General Ward Task</option>';
                patients.forEach(p => {
                    const option = document.createElement('option');
                    option.value = p.assignmentId;
                    option.textContent = `${p.patientName} (${p.bedCode || 'No Bed'})`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading patients for assignment:', error);
            }
        }

        async function loadTasks() {
            const wardId = document.getElementById('wardSelect').value;
            const shift = document.getElementById('shiftSelect').value;
            const date = document.getElementById('taskDate').value;

            if (!wardId) return;

            try {
                const response = await fetch(`/api/nursing/tasks?wardId=${wardId}&shift=${shift}&date=${date}`);
                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                console.error('Error loading tasks:', error);
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById('tasksContainer');
            if (tasks.length === 0) {
                container.innerHTML = '<div class="task-card p-5 text-center text-muted">No tasks for this shift</div>';
                return;
            }

            container.innerHTML = tasks.map(t => {
                const isCompleted = t.status === 'COMPLETED';
                const priorityClass = `tag-${t.priority.toLowerCase()}`;
                const dueTime = t.dueAt ? new Date(t.dueAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'No Time';

                return `
                    <div class="task-card d-flex align-items-start gap-4 ${isCompleted ? 'border-success' : ''}" 
                         style="${isCompleted ? 'border-left: 4px solid #22c55e;' : ''}">
                        <div class="task-checkbox mt-1 ${isCompleted ? 'bg-success border-success' : ''}" onclick="${isCompleted ? '' : `completeTask(${t.id})`}">
                            <i class="fas fa-check small text-white" style="${isCompleted ? '' : 'display:none;'}"></i>
                        </div>
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="fw-bold mb-1 ${isCompleted ? 'text-muted' : ''}">
                                        ${isCompleted ? `<del>${t.title}</del>` : t.title}
                                    </h6>
                                    <div class="small text-muted">
                                        <i class="fas fa-clock me-1"></i> Due: ${dueTime} • 
                                        ${t.assignmentId ? `<i class="fas fa-user-circle me-1"></i> Assignment: ${t.assignmentId}` : 'General Ward Task'}
                                    </div>
                                </div>
                                ${isCompleted
                        ? '<span class="badge bg-success-subtle text-success small">Completed</span>'
                        : `<span class="task-tag ${priorityClass}">${t.priority}</span>`}
                            </div>
                            <p class="small text-muted mb-0">${t.description || 'No description provided.'}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function completeTask(id) {
            try {
                const response = await fetch(`/api/nursing/tasks/${id}/complete`, { method: 'POST' });
                if (response.ok) {
                    loadTasks();
                } else {
                    alert('Error completing task');
                }
            } catch (error) {
                console.error('Error completing task:', error);
            }
        }

        async function saveCustomTask() {
            const wardId = document.getElementById('wardSelect').value;
            const shift = document.getElementById('shiftSelect').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDescription').value;
            const priority = document.getElementById('taskPriority').value;
            const dueTime = document.getElementById('taskDueTime').value;
            const assignmentId = document.getElementById('taskAssignmentId').value;

            if (!title) {
                alert('Title is required');
                return;
            }

            // Combine today's date with dueTime
            let dueAt = null;
            if (dueTime) {
                const today = new Date().toISOString().split('T')[0];
                dueAt = `${today}T${dueTime}:00`;
            }

            const payload = {
                wardId: parseInt(wardId),
                assignmentId: assignmentId ? parseInt(assignmentId) : null,
                title: title,
                description: description,
                shift: shift,
                priority: priority,
                dueAt: dueAt
            };

            try {
                const response = await fetch('/api/nursing/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addTaskModal'));
                    modal.hide();
                    document.getElementById('addTaskForm').reset();
                    loadTasks();
                } else {
                    alert('Error creating task');
                }
            } catch (error) {
                console.error('Error creating task:', error);
            }
        }
    </script>
</body>

</html>
