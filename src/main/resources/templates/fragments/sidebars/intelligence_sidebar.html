<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="intelligence_sidebar(activeLink)" class="sidebar sidebar-intelligence">
        <!-- Intelligence Header -->
        <div class="mb-4 px-2">
            <div class="d-flex align-items-center mb-3">
                <div class="flex-shrink-0 rounded-3 p-2 me-3"
                    style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: rgba(99, 102, 241, 0.1);">
                    <i class="fas fa-brain fs-5" style="color: #6366f1;"></i>
                </div>
                <div>
                    <small class="text-muted text-uppercase fw-bold d-block" style="font-size: 0.6rem;">Neural
                        Layer</small>
                    <span class="fw-bold" style="font-family: 'Outfit';">AI Intelligence</span>
                </div>
            </div>
            <hr style="opacity: 0.1; margin: 0 -1rem;">
        </div>

        <!-- Navigation Links -->
        <div class="px-2">
            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem;">Command
                    Center</small></div>

            <a th:href="@{/intelligence/hub}" class="sidebar-link"
                th:classappend="${activeLink == 'intel-hub' ? 'active' : ''}">
                <i class="fas fa-microchip"></i>
                <span>Intelligence Hub</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem;">Neural
                    Modules</small></div>

            <a th:href="@{/intelligence/predictive}" class="sidebar-link"
                th:classappend="${activeLink == 'intel-predict' ? 'active' : ''}">
                <i class="fas fa-heart-pulse"></i>
                <span>Predictive Brain</span>
            </a>

            <a th:href="@{/intelligence/operations}" class="sidebar-link"
                th:classappend="${activeLink == 'intel-ops' ? 'active' : ''}">
                <i class="fas fa-chart-line"></i>
                <span>Operational Forecasting</span>
            </a>

            <a th:href="@{/intelligence/genai}" class="sidebar-link"
                th:classappend="${activeLink == 'intel-gen' ? 'active' : ''}">
                <i class="fas fa-wand-magic-sparkles"></i>
                <span>Generative Admin</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.65rem;">System</small></div>

            <a th:href="@{/select-role}" class="sidebar-link">
                <i class="fas fa-th-large"></i>
                <span>Switch Portal</span>
            </a>
        </div>
    </div>
</body>

</html>
