<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="intelligence_sidebar(activePage)" class="sidebar-wrapper sidebar-intelligence">
        <div class="sidebar-header p-4 d-flex align-items-center">
            <div class="rounded-3 bg-indigo-500 bg-opacity-20 text-indigo-400 p-2 me-3">
                <i class="fas fa-brain fs-4"></i>
            </div>
            <div>
                <h6 class="mb-0 fw-bold text-white ls-1">INTELLIGENCE</h6>
                <div class="smaller text-muted">Neural Layer</div>
            </div>
        </div>

        <nav class="sidebar-nav px-3">
            <div class="nav-section mb-4">
                <div class="smaller text-muted text-uppercase fw-bold mb-3 ls-1 ps-2">AI Command Dashboard</div>
                <a th:href="@{/intelligence/hub}" class="nav-link rounded-pill mb-2 p-3 d-flex align-items-center"
                    th:classappend="${activePage == 'intel-hub'} ? 'active' : ''">
                    <i class="fas fa-microchip me-3"></i>
                    <span>Intelligence Hub</span>
                </a>
            </div>

            <div class="nav-section mb-4">
                <div class="smaller text-muted text-uppercase fw-bold mb-3 ls-1 ps-2">Neural Modules</div>
                <a th:href="@{/intelligence/predictive}"
                    class="nav-link rounded-pill mb-2 p-3 d-flex align-items-center"
                    th:classappend="${activePage == 'intel-predict'} ? 'active' : ''">
                    <i class="fas fa-heart-pulse me-3"></i>
                    <span>Predictive Brain</span>
                </a>
                <a th:href="@{/intelligence/operations}"
                    class="nav-link rounded-pill mb-2 p-3 d-flex align-items-center"
                    th:classappend="${activePage == 'intel-ops'} ? 'active' : ''">
                    <i class="fas fa-chart-line me-3"></i>
                    <span>Operational Forecasting</span>
                </a>
                <a th:href="@{/intelligence/genai}" class="nav-link rounded-pill mb-2 p-3 d-flex align-items-center"
                    th:classappend="${activePage == 'intel-gen'} ? 'active' : ''">
                    <i class="fas fa-wand-magic-sparkles me-3"></i>
                    <span>Generative Administration</span>
                </a>
            </div>

            <div class="nav-section mt-5">
                <a th:href="@{/select-role}" class="nav-link rounded-pill p-3 d-flex align-items-center text-muted">
                    <i class="fas fa-arrow-left-long me-3"></i>
                    <span>Back to Portals</span>
                </a>
            </div>
        </nav>
    </div>
</body>

</html>
