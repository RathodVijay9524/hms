<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>
    <div th:fragment="owner_sidebar(activeLink)" class="sidebar sidebar-owner">
        <!-- Owner Header -->
        <div class="mb-4 px-2">
            <div class="d-flex align-items-center mb-3">
                <div class="flex-shrink-0 bg-warning bg-opacity-10 text-warning rounded-3 p-2 me-3"
                    style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                    <i class="fas fa-hospital-user fs-5"></i>
                </div>
                <div>
                    <small class="text-muted text-uppercase fw-bold d-block" style="font-size: 0.6rem;">Executive
                        Portal</small>
                    <span class="fw-bold" style="font-family: 'Outfit';">Owner Mgmt</span>
                </div>
            </div>
            <hr style="opacity: 0.1; margin: 0 -1rem;">
        </div>

        <!-- Navigation Links -->
        <div class="px-2">
            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.65rem;">Administration</small></div>

            <a th:href="@{/owner/dashboard}" class="sidebar-link"
                th:classappend="${activeLink == 'owner-dash' ? 'active' : ''}">
                <i class="fas fa-chart-line"></i>
                <span>Executive Dashboard</span>
            </a>

            <a th:href="@{/owner/workers}" class="sidebar-link"
                th:classappend="${activeLink == 'owner-workers' ? 'active' : ''}">
                <i class="fas fa-users-cog"></i>
                <span>Staff Management</span>
            </a>

            <a th:href="@{/owner/departments}" class="sidebar-link"
                th:classappend="${activeLink == 'owner-depts' ? 'active' : ''}">
                <i class="fas fa-sitemap"></i>
                <span>Clinical Hierarchy</span>
            </a>

            <a th:href="@{/owner/doctors}" class="sidebar-link"
                th:classappend="${activeLink == 'owner-doctors' ? 'active' : ''}">
                <i class="fas fa-user-md"></i>
                <span>Physician Roster (Doctors)</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold" style="font-size: 0.65rem;">Clinical
                    Oversight</small></div>

            <a th:href="@{/doctor/dashboard}" class="sidebar-link">
                <i class="fas fa-stethoscope"></i>
                <span>Doctor Dashboard</span>
            </a>

            <a th:href="@{/lab/dashboard}" class="sidebar-link">
                <i class="fas fa-flask"></i>
                <span>Lab Operations</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.65rem;">Financials</small></div>

            <a th:href="@{/owner/billing}" class="sidebar-link"
                th:classappend="${activeLink == 'billing-dash' ? 'active' : ''}">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Revenue Oversight</span>
            </a>

            <a th:href="@{/owner/charges}" class="sidebar-link"
                th:classappend="${activeLink == 'charges' ? 'active' : ''}">
                <i class="fas fa-list-check"></i>
                <span>Charge Master</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.65rem;">System</small></div>

            <a th:href="@{/select-role}" class="sidebar-link">
                <i class="fas fa-th-large"></i>
                <span>Switch Portal</span>
            </a>
        </div>
    </div>
</body>

</html>
