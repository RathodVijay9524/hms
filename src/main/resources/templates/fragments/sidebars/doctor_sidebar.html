<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head></head>

<body>
    <div th:fragment="doctor_sidebar(activeLink)" class="sidebar">
        <!-- Doctor Module Profile -->
        <div class="mb-4 px-2">
            <div class="d-flex align-items-center mb-3">
                <div class="flex-shrink-0 bg-indigo-subtle text-indigo-500 rounded-3 p-2 me-3"
                    style="background: rgba(99, 102, 241, 0.1); color: #6366f1;">
                    <i class="fas fa-user-md fs-5"></i>
                </div>
                <div>
                    <small class="text-muted text-uppercase fw-bold d-block"
                        style="font-size: 0.65rem; letter-spacing: 0.05em;">Duty Portal</small>
                    <span class="fw-bold" style="font-family: 'Outfit'; color: #6366f1;">Clinical Care</span>
                </div>
            </div>
            <hr style="border-color: var(--border-color); opacity: 0.1; margin: 0 -1rem;">
        </div>

        <!-- Main Workspace -->
        <div class="px-2">
            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Clinical Desktop</small></div>

            <a th:href="@{/doctor/clinical-ai}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-ai' ? 'active' : ''}">
                <i class="fas fa-brain"></i>
                <span>AI Clinical Hub</span>
            </a>

            <a th:href="@{/doctor/dashboard}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-dash' ? 'active' : ''}">
                <i class="fas fa-columns"></i>
                <span>My Dashboard</span>
            </a>

            <a th:href="@{/doctor/appointments}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-app' ? 'active' : ''}">
                <i class="fas fa-calendar-check"></i>
                <span>OPD Schedule</span>
            </a>

            <a th:href="@{/doctor/teleconsult}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-tele' ? 'active' : ''}">
                <i class="fas fa-video"></i>
                <span>Virtual Consults</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Patient Care</small></div>

            <a th:href="@{/doctor/ipd}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-ipd' ? 'active' : ''}">
                <i class="fas fa-bed"></i>
                <span>In-Patient (IPD)</span>
            </a>

            <a th:href="@{/doctor/surgeries}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-surgeries' ? 'active' : ''}">
                <i class="fas fa-scalpel"></i>
                <span>OT Schedule</span>
            </a>

            <a th:href="@{/doctor/emr}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-emr' ? 'active' : ''}">
                <i class="fas fa-file-medical"></i>
                <span>EMR Records</span>
            </a>

            <a th:href="@{/doctor/consults}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-consults' ? 'active' : ''}">
                <i class="fas fa-user-md-chat"></i>
                <span>Internal Consults</span>
            </a>

            <a th:href="@{/doctor/prescriptions}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-rx' ? 'active' : ''}">
                <i class="fas fa-prescription"></i>
                <span>Rx / Orders</span>
            </a>

            <a th:href="@{/doctor/alerts}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-alerts' ? 'active' : ''}">
                <i class="fas fa-bell"></i>
                <span>Critical Alerts</span>
                <span class="badge rounded-pill bg-danger ms-auto" style="font-size: 0.6rem;">2</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Investigations</small></div>

            <a th:href="@{/lab/orders}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-labs' ? 'active' : ''}">
                <i class="fas fa-flask-vial"></i>
                <span>Diagnostic Hub</span>
            </a>

            <a th:href="@{/doctor/schedules}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-schedules' ? 'active' : ''}">
                <i class="fas fa-clock"></i>
                <span>My Availability</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Insights</small></div>

            <a th:href="@{/doctor/analytics}" class="sidebar-link"
                th:classappend="${activeLink == 'doc-analytics' ? 'active' : ''}">
                <i class="fas fa-chart-line"></i>
                <span>Performance Suite</span>
            </a>

            <div class="mb-3 mt-4"><small class="text-muted text-uppercase fw-bold"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">System</small></div>

            <a th:href="@{/select-role}" class="sidebar-link">
                <i class="fas fa-th-large"></i>
                <span>Switch Portal</span>
            </a>
        </div>
    </div>
</body>

</html>
