<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Schedules - MedLab Pro</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Theme CSS -->
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .card-custom {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
        }

        .btn-primary-custom {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        .slot-preview {
            background: var(--bg-tertiary);
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
        }

        .slot-badge {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 5px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
            margin: 2px;
            font-size: 0.85rem;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebar :: sidebar('schedules')}"></div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 style="font-family: 'Outfit'; font-weight: 700;">Doctor Schedules</h2>
                <p class="text-muted">Configure weekly availability and slot generation durations.</p>
            </div>
        </div>

        <div class="row g-4">
            <!-- Schedule Form -->
            <div class="col-lg-4">
                <div class="card card-custom p-4">
                    <h5 class="mb-3">Add/Update Schedule</h5>
                    <form id="scheduleForm">
                        <div class="mb-3">
                            <label class="form-label">Select Doctor</label>
                            <select id="doctorId" class="form-select" required onchange="loadDoctorSchedules()">
                                <option value="">Choose a doctor...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Day of Week</label>
                            <select id="dayOfWeek" class="form-select" required>
                                <option value="MONDAY">Monday</option>
                                <option value="TUESDAY">Tuesday</option>
                                <option value="WEDNESDAY">Wednesday</option>
                                <option value="THURSDAY">Thursday</option>
                                <option value="FRIDAY">Friday</option>
                                <option value="SATURDAY">Saturday</option>
                                <option value="SUNDAY">Sunday</option>
                            </select>
                        </div>
                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">Start Time</label>
                                <input type="time" id="startTime" class="form-control" required>
                            </div>
                            <div class="col">
                                <label class="form-label">End Time</label>
                                <input type="time" id="endTime" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Slot Duration (Minutes)</label>
                            <select id="slotDuration" class="form-select" required>
                                <option value="15">15 Minutes</option>
                                <option value="20">20 Minutes</option>
                                <option value="30">30 Minutes</option>
                                <option value="45">45 Minutes</option>
                                <option value="60">60 Minutes</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100">
                            <i class="fas fa-save me-2"></i>Save Schedule
                        </button>
                    </form>
                </div>
            </div>

            <!-- Current Schedules List -->
            <div class="col-lg-8">
                <div class="card card-custom p-4">
                    <h5 class="mb-3">Current Weekly Schedule</h5>
                    <div class="table-responsive">
                        <table class="table text-primary">
                            <thead>
                                <tr>
                                    <th>Day</th>
                                    <th>Start Time</th>
                                    <th>End Time</th>
                                    <th>Duration</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="schedulesTableBody">
                                <tr>
                                    <td colspan="5" class="text-center text-muted py-4">Select a doctor to view
                                        schedules</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="card card-custom p-4 mt-4">
                    <h5 class="mb-3">Slot Preview</h5>
                    <div class="row align-items-end mb-3">
                        <div class="col-md-5">
                            <label class="form-label">Preview Date</label>
                            <input type="date" id="previewDate" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <button class="btn btn-outline-primary w-100" onclick="previewSlots()">
                                <i class="fas fa-eye me-2"></i>Preview
                            </button>
                        </div>
                    </div>
                    <div id="slotsPreviewContainer" class="slot-preview d-flex flex-wrap gap-2">
                        <p class="text-muted w-100 text-center py-4">Select a date to preview generated slots</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDoctors();
            document.getElementById('scheduleForm').addEventListener('submit', saveSchedule);

            // Set default date for preview to tomorrow
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            document.getElementById('previewDate').value = tomorrow.toISOString().split('T')[0];
        });

        async function loadDoctors() {
            try {
                const response = await fetch('/api/masters/doctors');
                const doctors = await response.json();
                const select = document.getElementById('doctorId');

                doctors.forEach(doc => {
                    const option = document.createElement('option');
                    option.value = doc.userId; // This is the ID used in our new Scheduling table (doctor_id links to DoctorProfile which we find by userId)
                    // Wait, the DoctorSchedule entity expects DoctorProfile ID. 
                    // Let's re-verify the controller. The request has doctorId.
                    // Actually, DoctorMasterController returns DoctorProfileDTO which has an 'id' (the DoctorProfile primary key).
                    option.value = doc.id;
                    option.textContent = doc.doctorName + ' (' + doc.departmentName + ')';
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading doctors:', error);
            }
        }

        async function loadDoctorSchedules() {
            const doctorId = document.getElementById('doctorId').value;
            if (!doctorId) {
                document.getElementById('schedulesTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">Select a doctor to view schedules</td></tr>';
                return;
            }

            try {
                const response = await fetch(`/api/scheduling/doctor-schedule/${doctorId}`);
                const data = await response.json();
                const schedules = data.data || [];

                const tbody = document.getElementById('schedulesTableBody');
                tbody.innerHTML = '';

                if (schedules.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">No schedules configured for this doctor</td></tr>';
                    return;
                }

                schedules.sort((a, b) => {
                    const days = ['MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY', 'SUNDAY'];
                    return days.indexOf(a.dayOfWeek) - days.indexOf(b.dayOfWeek);
                });

                schedules.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${s.dayOfWeek}</strong></td>
                        <td>${s.startTime.substring(0, 5)}</td>
                        <td>${s.endTime.substring(0, 5)}</td>
                        <td>${s.slotDuration} min</td>
                        <td>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteSchedule(${s.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading schedules:', error);
            }
        }

        async function saveSchedule(e) {
            e.preventDefault();
            const payload = {
                doctorId: document.getElementById('doctorId').value,
                dayOfWeek: document.getElementById('dayOfWeek').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                slotDuration: parseInt(document.getElementById('slotDuration').value),
                active: true
            };

            try {
                const response = await fetch('/api/scheduling/doctor-schedule', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    loadDoctorSchedules();
                    alert('Schedule saved successfully!');
                } else {
                    alert('Error saving schedule');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        async function deleteSchedule(id) {
            if (!confirm('Are you sure you want to delete this schedule?')) return;
            try {
                const response = await fetch(`/api/scheduling/doctor-schedule/${id}`, { method: 'DELETE' });
                if (response.ok) loadDoctorSchedules();
            } catch (error) {
                console.error('Error deleting schedule:', error);
            }
        }

        async function previewSlots() {
            const doctorId = document.getElementById('doctorId').value;
            const date = document.getElementById('previewDate').value;

            if (!doctorId || !date) {
                alert('Please select doctor and date');
                return;
            }

            const container = document.getElementById('slotsPreviewContainer');
            container.innerHTML = '<div class="text-center w-100 py-4"><div class="spinner-border text-primary"></div><p class="mt-2">Generating slots...</p></div>';

            try {
                const response = await fetch(`/api/scheduling/slots?doctorId=${doctorId}&date=${date}`);
                const data = await response.json();
                const slots = data.data || [];

                container.innerHTML = '';
                if (slots.length === 0) {
                    container.innerHTML = '<p class="text-muted w-100 text-center py-4">No slots available for this day. Ensure a schedule is configured for this day of the week.</p>';
                    return;
                }

                slots.forEach(slot => {
                    const badge = document.createElement('div');
                    badge.className = 'slot-badge';
                    badge.textContent = slot.startTime.substring(0, 5);
                    container.appendChild(badge);
                });
            } catch (error) {
                console.error('Error previewing slots:', error);
                container.innerHTML = '<p class="text-danger w-100 text-center py-4">Error loading preview</p>';
            }
        }
    </script>
</body>

</html>
