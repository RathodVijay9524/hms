<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurse Management - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .nav-pills .nav-link {
            color: var(--text-muted);
            border-radius: 50rem;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
        }

        .nav-pills .nav-link.active {
            background-color: var(--primary-color);
            color: white;
        }

        .shift-column {
            background: var(--bg-secondary);
            border-radius: 1rem;
            padding: 1rem;
            min-height: 200px;
        }

        .roster-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem;
            margin-bottom: 0.75rem;
            display: flex;
            justify-content: location;
            align-items: center;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('nurses')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Nurse Management</h1>
                    <p class="text-theme-muted mb-0">Manage nursing staff and shift rosters</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm"
                        onclick="openAssignModal()">
                        <i class="fas fa-calendar-plus me-2"></i>Assign Shift
                    </button>
                    <button class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm" data-bs-toggle="modal"
                        data-bs-target="#addNurseModal">
                        <i class="fas fa-user-plus me-2"></i>New Nurse
                    </button>
                </div>
            </div>

            <!-- Tabs -->
            <ul class="nav nav-pills mb-4" id="nurseTabs" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active" id="roster-tab" data-bs-toggle="pill"
                        data-bs-target="#roster-content" type="button">Shift Roster</button>
                </li>
                <li class="nav-item">
                    <button class="nav-link" id="directory-tab" data-bs-toggle="pill"
                        data-bs-target="#directory-content" type="button">Staff Directory</button>
                </li>
            </ul>

            <div class="tab-content">
                <!-- Roster Tab -->
                <div class="tab-pane fade show active" id="roster-content">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <input type="date" id="rosterDate"
                            class="form-control bg-secondary text-theme border-secondary rounded-pill"
                            style="width: auto;">
                        <button class="btn btn-sm btn-outline-theme rounded-circle" onclick="loadRoster()"><i
                                class="fas fa-sync-alt"></i></button>
                    </div>

                    <div class="row g-4">
                        <div class="col-md-4">
                            <div class="shift-column">
                                <h6 class="text-theme fw-bold text-center mb-3">MORNING SHIFT</h6>
                                <div id="shift-MORNING"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="shift-column">
                                <h6 class="text-theme fw-bold text-center mb-3">EVENING SHIFT</h6>
                                <div id="shift-EVENING"></div>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="shift-column">
                                <h6 class="text-theme fw-bold text-center mb-3">NIGHT SHIFT</h6>
                                <div id="shift-NIGHT"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Directory Tab -->
                <div class="tab-pane fade" id="directory-content">
                    <div class="glass-card shadow-sm p-0 overflow-hidden">
                        <div class="table-responsive">
                            <table class="table premium-table mb-0">
                                <thead class="text-muted">
                                    <tr>
                                        <th class="ps-4">Name / Username</th>
                                        <th>Contact</th>
                                        <th>Status</th>
                                        <th>Joined</th>
                                        <th class="text-end pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="nursesTableBody">
                                    <!-- Dynamic Content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Nurse Modal -->
    <div class="modal fade" id="addNurseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-theme">Add New Nurse</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addNurseForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Full Name</label>
                            <input type="text" class="form-control bg-secondary text-theme border-secondary"
                                id="nurseName" required>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Username</label>
                                <input type="text" class="form-control bg-secondary text-theme border-secondary"
                                    id="nurseUsername" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Password</label>
                                <input type="password" class="form-control bg-secondary text-theme border-secondary"
                                    id="nursePassword" required>
                            </div>
                        </div>
                        <div class="row g-3 mt-1">
                            <div class="col-md-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Email</label>
                                <input type="email" class="form-control bg-secondary text-theme border-secondary"
                                    id="nurseEmail" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small text-muted text-uppercase fw-bold">Phone</label>
                                <input type="tel" class="form-control bg-secondary text-theme border-secondary"
                                    id="nursePhone">
                            </div>
                        </div>
                        <div class="mt-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">About</label>
                            <textarea class="form-control bg-secondary text-theme border-secondary" id="nurseAbout"
                                rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-link text-muted text-decoration-none"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-emerald-theme fw-bold px-4 rounded-pill"
                        onclick="saveNurse()">Create Nurse</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Assign Shift Modal -->
    <div class="modal fade" id="assignShiftModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content glass-card border-0">
                <div class="modal-header border-bottom border-secondary">
                    <h5 class="modal-title fw-bold text-theme">Assign Shift</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="assignShiftForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Date</label>
                            <input type="date" class="form-control bg-secondary text-theme border-secondary"
                                id="assignDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Shift</label>
                            <select class="form-select bg-secondary text-theme border-secondary" id="assignShiftSelect">
                                <option value="MORNING">Morning (7AM - 3PM)</option>
                                <option value="EVENING">Evening (3PM - 10PM)</option>
                                <option value="NIGHT">Night (10PM - 7AM)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Nurse</label>
                            <select class="form-select bg-secondary text-theme border-secondary" id="assignNurseSelect"
                                required>
                                <option value="">Select Nurse</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted text-uppercase fw-bold">Ward (Optional)</label>
                            <select class="form-select bg-secondary text-theme border-secondary" id="assignWardSelect">
                                <option value="">No Specific Ward</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top border-secondary">
                    <button type="button" class="btn btn-emerald-theme fw-bold px-4 rounded-pill"
                        onclick="saveAssignment()">Assign</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('rosterDate').valueAsDate = new Date();
            document.getElementById('assignDate').valueAsDate = new Date();

            // Listeners
            document.getElementById('rosterDate').addEventListener('change', loadRoster);

            loadNurses();
            loadWards();
            loadRoster();
        });

        // --- Directory Logic ---
        async function loadNurses() {
            const tbody = document.getElementById('nursesTableBody');
            const select = document.getElementById('assignNurseSelect');

            tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4">Loading...</td></tr>';

            try {
                const response = await fetch('/api/admin/nurses');
                const users = await response.json();

                // Populate Directory
                tbody.innerHTML = '';
                select.innerHTML = '<option value="">Select Nurse</option>';

                if (users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No nurses found.</td></tr>';
                }

                users.forEach(u => {
                    // Populate Table
                    const row = `
                        <tr>
                            <td class="ps-4">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="rounded-circle d-flex align-items-center justify-content-center"
                                        style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                                        <i class="fas fa-user-nurse"></i>
                                    </div>
                                    <div>
                                        <div class="fw-bold text-theme">${u.name}</div>
                                        <div class="small text-muted">@${u.username}</div>
                                    </div>
                                </div>
                            </td>
                            <td>
                                <div class="text-theme small">${u.email}</div>
                                <div class="text-muted small">${u.phoNo || '-'}</div>
                            </td>
                            <td>
                                <span class="badge bg-success-subtle text-success rounded-pill px-3 py-1 fs-12 fw-bold border border-success/20">
                                    ${(u.accountStatus && u.accountStatus.isActive) ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td class="text-muted small">
                                ${new Date(u.createdOn).toLocaleDateString()}
                            </td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-danger action-icon-btn rounded-circle" 
                                    title="Remove" onclick="deleteNurse(${u.id})">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.insertAdjacentHTML('beforeend', row);

                    // Populate Dropdown
                    const opt = document.createElement('option');
                    opt.value = u.id; // Worker ID mapped to user id in response? No, worker id.
                    // WorkerResponse should have ID.
                    opt.textContent = `${u.name} (@${u.username})`;
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error(e);
            }
        }

        async function saveNurse() {
            const formData = {
                name: document.getElementById('nurseName').value,
                username: document.getElementById('nurseUsername').value,
                password: document.getElementById('nursePassword').value,
                email: document.getElementById('nurseEmail').value,
                phoNo: document.getElementById('nursePhone').value,
                about: document.getElementById('nurseAbout').value
            };

            if (!formData.name || !formData.username || !formData.password || !formData.email) {
                alert('Please fill required fields'); return;
            }

            try {
                const response = await fetch('/api/admin/nurses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                if (response.ok) {
                    const modal = bootstrap.Modal.getInstance(document.getElementById('addNurseModal'));
                    modal.hide();
                    document.getElementById('addNurseForm').reset();
                    loadNurses();
                    alert('Nurse Created!');
                } else {
                    const err = await response.json();
                    alert('Error: ' + (err.message || 'Failed'));
                }
            } catch (e) { console.error(e); alert('Failed'); }
        }

        async function deleteNurse(id) {
            if (!confirm('Are you sure?')) return;
            try {
                await fetch(`/api/admin/nurses/${id}`, { method: 'DELETE' });
                loadNurses();
            } catch (e) { }
        }

        // --- Roster Logic ---

        async function loadWards() {
            // Reusing existing ward API
            try {
                const res = await fetch('/api/nursing/wards');
                // Assuming admin can access this, or create separate endpoint.
                // Actually /api/nursing/wards is filtered by Owner, so Admin (Owner) can see it.
                if (res.ok) {
                    const wards = await res.json();
                    const select = document.getElementById('assignWardSelect');
                    wards.forEach(w => {
                        const opt = document.createElement('option');
                        opt.value = w.id;
                        opt.textContent = w.name;
                        select.appendChild(opt);
                    });
                }
            } catch (e) { }
        }

        function openAssignModal() {
            document.getElementById('assignDate').value = document.getElementById('rosterDate').value;
            new bootstrap.Modal(document.getElementById('assignShiftModal')).show();
        }

        async function saveAssignment() {
            const dto = {
                nurseId: document.getElementById('assignNurseSelect').value,
                scheduleDate: document.getElementById('assignDate').value,
                shiftName: document.getElementById('assignShiftSelect').value,
                wardId: document.getElementById('assignWardSelect').value || null
            };

            if (!dto.nurseId || !dto.scheduleDate) { alert('Fill fields'); return; }

            try {
                const res = await fetch('/api/admin/nurses/schedules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dto)
                });
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('assignShiftModal')).hide();
                    loadRoster();
                    alert('Assigned!');
                } else {
                    alert((await res.text()));
                }
            } catch (e) { console.error(e); }
        }

        async function loadRoster() {
            const date = document.getElementById('rosterDate').value;
            // Clear lists
            document.getElementById('shift-MORNING').innerHTML = '';
            document.getElementById('shift-EVENING').innerHTML = '';
            document.getElementById('shift-NIGHT').innerHTML = '';

            try {
                const res = await fetch(`/api/admin/nurses/schedules?date=${date}`);
                const schedules = await res.json();

                schedules.forEach(s => {
                    const container = document.getElementById(`shift-${s.shiftName}`);
                    if (container) {
                        const card = `
                            <div class="roster-card">
                                <div class="d-flex w-100 justify-content-between align-items-center">
                                    <div>
                                        <div class="fw-bold text-theme">${s.nurseName}</div>
                                        <div class="small text-muted">${s.wardName ? 'Ward: ' + s.wardName : 'General'}</div>
                                    </div>
                                    <button class="btn btn-sm text-danger" onclick="deleteSchedule(${s.id})">
                                        <i class="fas fa-times"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                        container.insertAdjacentHTML('beforeend', card);
                    }
                });
            } catch (e) { console.error(e); }
        }

        async function deleteSchedule(id) {
            if (!confirm('Remove assignment?')) return;
            try {
                await fetch(`/api/admin/nurses/schedules/${id}`, { method: 'DELETE' });
                loadRoster();
            } catch (e) { }
        }
    </script>
</body>

</html>
