<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments Management - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .dept-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .dept-card:hover {
            border-color: #10b981;
            transform: translateY(-5px);
        }

        .dept-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #10b981;
            opacity: 0.1;
        }

        .dept-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            margin-bottom: 1rem;
        }

        .staff-count {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2rem;
            padding: 0.25rem 0.75rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('departments')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #10b981;">Organizational Units</h1>
                    <p class="text-muted mb-0">Manage clinical and administrative departments across hospital nodes</p>
                </div>
                <button class="btn text-dark fw-bold px-4 rounded-pill" style="background: #10b981;">
                    <i class="fas fa-sitemap me-2"></i>New Department
                </button>
            </div>

            <div class="row g-4">
                <div class="col-md-6 col-lg-4" th:each="dept : ${departments}">
                    <div class="dept-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="dept-icon">
                                <i class="fas" th:classappend="${dept.icon != null ? dept.icon : 'fa-hospital'}"></i>
                            </div>
                            <span class="staff-count text-muted" th:text="${#lists.size(dept.workers)} + ' Staff'">24
                                Staff</span>
                        </div>
                        <h5 class="fw-bold mb-1 text-white" th:text="${dept.name}">Cardiology</h5>
                        <p class="text-muted small mb-3">Managed by Dr. Sarah J. • Floor 3</p>

                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3">Edit Unit</button>
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3">View Details</button>
                        </div>
                    </div>
                </div>

                <!-- Fallback if empty -->
                <div class="col-md-6 col-lg-4" th:if="${#lists.isEmpty(departments)}">
                    <div class="dept-card">
                        <div class="d-flex justify-content-between align-items-start">
                            <div class="dept-icon">
                                <i class="fas fa-microscope"></i>
                            </div>
                            <span class="staff-count text-muted">15 Staff</span>
                        </div>
                        <h5 class="fw-bold mb-1 text-white">Pathology</h5>
                        <p class="text-muted small mb-3">Central Hub • Ground Floor</p>

                        <div class="d-flex gap-2">
                            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3">Edit Unit</button>
                            <button class="btn btn-sm btn-outline-light rounded-pill px-3">View Details</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
