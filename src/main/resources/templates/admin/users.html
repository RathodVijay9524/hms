<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .user-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            border-color: rgba(16, 185, 129, 0.4);
            box-shadow: 0 10px 30px -10px rgba(16, 185, 129, 0.15);
        }

        .search-container {
            position: relative;
            max-width: 400px;
        }

        .search-input {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 2rem;
            padding: 0.75rem 1.5rem 0.75rem 3.5rem;
            color: white;
            width: 100%;
        }

        .search-icon {
            position: absolute;
            left: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .user-table th {
            font-family: 'Outfit';
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            padding: 1.25rem;
            border-bottom: 2px solid var(--border-color);
        }

        .user-table td {
            padding: 1.25rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .action-btn {
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.75rem;
            background: rgba(16, 185, 129, 0.05);
            color: #10b981;
            transition: all 0.2s;
            border: none;
        }

        .action-btn:hover {
            background: #10b981;
            color: white;
        }

        .action-btn.danger {
            background: rgba(239, 68, 68, 0.05);
            color: #ef4444;
        }

        .action-btn.danger:hover {
            background: #ef4444;
            color: white;
        }

        .role-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 0.5rem;
            text-transform: uppercase;
        }

        .status-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 0.35rem 0.75rem;
            border-radius: 2rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('users')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #10b981;">User Management</h1>
                    <p class="text-muted mb-0">Manage system users, roles, and security access</p>
                </div>
                <div class="d-flex gap-2">
                    <div class="search-container">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" class="search-input" placeholder="Search users...">
                    </div>
                    <button class="btn text-dark fw-bold px-4 rounded-pill" style="background: #10b981;">
                        <i class="fas fa-user-plus me-2"></i>New User
                    </button>
                </div>
            </div>

            <!-- User List Card -->
            <div class="user-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table user-table mb-0">
                        <thead class="text-muted">
                            <tr>
                                <th>User</th>
                                <th>Roles</th>
                                <th>Last Login</th>
                                <th>Created</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                                            style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-white" th:text="${user.name}">John Doe</div>
                                            <div class="small text-muted" th:text="${user.email}">john@medlab.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span th:each="role : ${user.roles}" class="role-badge"
                                            th:classappend="'role-' + ${#strings.toLowerCase(role.name)}"
                                            th:text="${role.name}"
                                            style="background: rgba(16, 185, 129, 0.1); color: #10b981;">ADMIN</span>
                                    </div>
                                </td>
                                <td>2 hours ago</td>
                                <td>24-Dec-2025</td>
                                <td><span class="status-badge bg-success-subtle text-success">Active</span></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="action-btn" title="Edit User"><i
                                                class="fas fa-edit"></i></button>
                                        <button class="action-btn" title="Reset Password"><i
                                                class="fas fa-key"></i></button>
                                        <button class="action-btn danger" title="Deactivate"><i
                                                class="fas fa-ban"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <!-- Fallback/Static rows if no users -->
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                                            style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-white">System Admin</div>
                                            <div class="small text-muted">admin@medlab.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td><span class="role-badge"
                                        style="background: rgba(16, 185, 129, 0.1); color: #10b981;">SUPER ADMIN</span>
                                </td>
                                <td>Now</td>
                                <td>01-Jan-2025</td>
                                <td><span class="status-badge bg-success-subtle text-success">Active</span></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="action-btn" title="Edit User"><i
                                                class="fas fa-edit"></i></button>
                                        <button class="action-btn" title="Reset Password"><i
                                                class="fas fa-key"></i></button>
                                        <button class="action-btn danger" title="Deactivate"><i
                                                class="fas fa-ban"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
