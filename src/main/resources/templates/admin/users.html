<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('users')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">User Management</h1>
                    <p class="text-theme-muted mb-0">Manage system users, roles, and security access</p>
                </div>
                <div class="d-flex gap-2">
                    <div class="position-relative" style="max-width: 400px;">
                        <i class="fas fa-search position-absolute text-theme-muted"
                            style="left: 1.25rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="text" class="form-control rounded-pill ps-5 py-2 fs-14"
                            placeholder="Search users...">
                    </div>
                    <button class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm">
                        <i class="fas fa-user-plus me-2"></i>New User
                    </button>
                </div>
            </div>

            <!-- User List Card -->
            <div class="glass-card shadow-sm p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table premium-table mb-0">
                        <thead class="text-muted">
                            <tr>
                                <th>User</th>
                                <th>Roles</th>
                                <th>Last Login</th>
                                <th>Created</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                                            style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-white" th:text="${user.name}">John Doe</div>
                                            <div class="small text-muted" th:text="${user.email}">john@medlab.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span th:each="role : ${user.roles}"
                                            class="badge bg-emerald-500 bg-opacity-10 text-emerald-400 rounded-pill px-2 py-1 fs-10 fw-bold border border-emerald-500/20"
                                            th:text="${role.name}">ADMIN</span>
                                    </div>
                                </td>
                                <td>2 hours ago</td>
                                <td>24-Dec-2025</td>
                                <td><span
                                        class="badge bg-success-subtle text-success rounded-pill px-3 py-1 fs-12 fw-bold border border-success/20">Active</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn btn-sm btn-outline-emerald action-icon-btn"
                                            title="Edit User"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-info action-icon-btn"
                                            title="Reset Password"><i class="fas fa-key"></i></button>
                                        <button class="btn btn-sm btn-outline-danger action-icon-btn"
                                            title="Deactivate"><i class="fas fa-ban"></i></button>
                                    </div>
                                </td>
                            </tr>
                            <!-- Fallback/Static rows if no users -->
                            <tr th:if="${#lists.isEmpty(users)}">
                                <td>
                                    <div class="d-flex align-items-center gap-3">
                                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                                            style="width: 40px; height: 40px; background: rgba(16, 185, 129, 0.1); color: #10b981;">
                                            <i class="fas fa-user"></i>
                                        </div>
                                        <div>
                                            <div class="fw-bold text-white">System Admin</div>
                                            <div class="small text-muted">admin@medlab.com</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-1">
                                        <span
                                            class="badge bg-emerald-500 bg-opacity-10 text-emerald-400 rounded-pill px-2 py-1 fs-10 fw-bold border border-emerald-500/20">SUPER
                                            ADMIN</span>
                                    </div>
                                </td>
                                <td>Now</td>
                                <td>01-Jan-2025</td>
                                <td><span class="status-badge bg-success-subtle text-success">Active</span></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2">
                                        <button class="btn btn-sm btn-outline-emerald action-icon-btn"
                                            title="Edit User"><i class="fas fa-edit"></i></button>
                                        <button class="btn btn-sm btn-outline-info action-icon-btn"
                                            title="Reset Password"><i class="fas fa-key"></i></button>
                                        <button class="btn btn-sm btn-outline-danger action-icon-btn"
                                            title="Deactivate"><i class="fas fa-ban"></i></button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
