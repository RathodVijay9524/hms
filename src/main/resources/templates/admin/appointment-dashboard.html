<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Dashboard - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .card-custom {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: var(--shadow-md);
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .status-booked {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
        }

        .status-checked_in {
            background: rgba(16, 185, 129, 0.1);
            color: #34d399;
        }

        .status-completed {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }

        .status-cancelled {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        .status-no_show {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
        }

        .appointment-row {
            transition: background 0.2s;
        }

        .appointment-row:hover {
            background: var(--bg-tertiary);
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" th:href="@{/dashboard}"
                style="font-family: 'Outfit'; font-weight: 700; background: var(--gradient-primary); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                <i class="fas fa-flask-vial me-2"></i>MedLab Pro
            </a>
            <div class="ms-auto d-flex align-items-center">
                <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm">Logout</a>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <div class="mb-4"><small class="text-muted text-uppercase">Management</small></div>
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a th:href="@{/lab/patients}" class="sidebar-link"><i class="fas fa-user-injured"></i> Patients & EMR</a>
        <a th:href="@{/lab/appointments}" class="sidebar-link"><i class="fas fa-calendar-plus"></i> Book Appointment</a>
        <a th:href="@{/admin/appointment-dashboard}" class="sidebar-link active"><i class="fas fa-list-ul"></i> Today's
            Queue</a>
        <hr style="border-color: var(--border-color);">
        <a th:href="@{/admin/schedules}" class="sidebar-link"><i class="fas fa-calendar-alt"></i> Doctor Schedules</a>
        <hr style="border-color: var(--border-color);">
        <div class="mb-4"><small class="text-muted text-uppercase">Revenue & Billing</small></div>
        <a th:href="@{/admin/billing}" class="sidebar-link"><i class="fas fa-file-invoice-dollar"></i> Patient
            Billing</a>
        <a th:href="@{/masters/charges}" class="sidebar-link"><i class="fas fa-list-check"></i> Charge Master</a>
    </div>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 style="font-family: 'Outfit'; font-weight: 700;">Front Desk Dashboard</h2>
                <p class="text-muted" id="currentDateDisplay">Today's Appointments - </p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-primary" onclick="loadAppointments()">
                    <i class="fas fa-sync-alt me-2"></i>Refresh List
                </button>
                <a th:href="@{/lab/appointments}" class="btn btn-primary-gradient">
                    <i class="fas fa-plus me-2"></i>New Booking
                </a>
            </div>
        </div>

        <div class="card card-custom p-0 overflow-hidden">
            <div class="table-responsive">
                <table class="table table-borderless align-middle mb-0 text-primary">
                    <thead style="background: var(--bg-tertiary);">
                        <tr>
                            <th class="ps-4 py-3">Time</th>
                            <th class="py-3">Appt #</th>
                            <th class="py-3">Patient Details</th>
                            <th class="py-3">Doctor</th>
                            <th class="py-3">Status</th>
                            <th class="py-3 text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentsTableBody">
                        <!-- Appointments will be loaded here -->
                        <tr>
                            <td colspan="6" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Loading appointments...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').textContent += new Date().toLocaleDateString(undefined, options);
            loadAppointments();

            // Auto refresh every 2 minutes
            setInterval(loadAppointments, 120000);
        });

        async function loadAppointments() {
            try {
                const response = await fetch('/api/appointments/today');
                const data = await response.json();
                const appointments = data.data || [];

                const tbody = document.getElementById('appointmentsTableBody');
                tbody.innerHTML = '';

                if (appointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="fas fa-calendar-day fa-3x mb-3 opacity-25"></i><p>No appointments booked for today.</p></td></tr>';
                    return;
                }

                // Sort by time
                appointments.sort((a, b) => a.appointmentTime.localeCompare(b.appointmentTime));

                appointments.forEach(appt => {
                    const row = document.createElement('tr');
                    row.className = 'appointment-row border-bottom';
                    row.innerHTML = `
                        <td class="ps-4">
                            <div class="fw-bold">${appt.appointmentTime.substring(0, 5)}</div>
                        </td>
                        <td><small class="text-muted">${appt.appointmentNumber}</small></td>
                        <td>
                            <div class="fw-bold">${appt.patientName}</div>
                            <div class="small text-muted">UHID: ${appt.patientUhid || 'N/A'}</div>
                        </td>
                        <td>
                            <div>Dr. ${appt.doctorName}</div>
                        </td>
                        <td>
                            <span class="status-badge status-${appt.status.toLowerCase()}">${appt.status.replace('_', ' ')}</span>
                        </td>
                        <td class="text-end pe-4">
                            ${appt.status === 'BOOKED' ? `
                                <button class="btn btn-sm btn-success me-1" onclick="updateStatus(${appt.id}, 'CHECKED_IN')" title="Check-in">
                                    <i class="fas fa-user-check"></i>
                                </button>
                            ` : ''}
                            ${appt.status === 'CHECKED_IN' ? `
                                <a href="/lab/patients/${appt.patientId}?visitId=${appt.visitId}" class="btn btn-sm btn-primary me-1" title="Open EMR Visit">
                                    <i class="fas fa-notes-medical"></i>
                                </a>
                                <button class="btn btn-sm btn-outline-success me-1" onclick="updateStatus(${appt.id}, 'COMPLETED')" title="Mark as Completed">
                                    <i class="fas fa-check-double"></i>
                                </button>
                            ` : ''}
                            ${appt.status === 'BOOKED' ? `
                                <button class="btn btn-sm btn-outline-danger" onclick="updateStatus(${appt.id}, 'CANCELLED')" title="Cancel">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading appointments:', error);
                document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Failed to load appointments.</td></tr>';
            }
        }

        async function updateStatus(id, status) {
            const confirmMsg = status === 'CANCELLED' ? 'Are you sure you want to cancel this appointment?' : `Update status to ${status.replace('_', ' ')}?`;
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch(`/api/appointments/${id}/status?status=${status}`, {
                    method: 'PATCH'
                });

                if (response.ok) {
                    loadAppointments();
                } else {
                    alert('Failed to update status.');
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }
    </script>
</body>

</html>
