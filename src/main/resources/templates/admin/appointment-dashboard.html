<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Dashboard - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('queue')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Front Desk Dashboard</h1>
                    <p class="text-theme-muted mb-0" id="currentDateDisplay">Today's Appointments - </p>
                </div>
                <div class="d-flex gap-3">
                    <button class="btn btn-outline-theme rounded-pill px-4 shadow-sm border-theme-light text-theme"
                        onclick="loadAppointments()">
                        <i class="fas fa-sync-alt me-2"></i>Refresh List
                    </button>
                    <a th:href="@{/lab/appointments}" class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm">
                        <i class="fas fa-plus me-2"></i>New Booking
                    </a>
                </div>
            </div>

            <div class="glass-card p-0 overflow-hidden shadow-sm">
                <div class="table-responsive">
                    <table class="table premium-table mb-0">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Appt #</th>
                                <th>Patient Details</th>
                                <th>Doctor</th>
                                <th>Status</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appointmentsTableBody">
                            <!-- Appointments will be loaded here -->
                            <tr>
                                <td colspan="6" class="text-center py-5">
                                    <div class="spinner-border text-emerald-500" role="status"></div>
                                    <p class="mt-2 text-theme-muted">Loading appointments...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('currentDateDisplay').textContent += new Date().toLocaleDateString(undefined, options);
            loadAppointments();

            // Auto refresh every 2 minutes
            setInterval(loadAppointments, 120000);
        });

        async function loadAppointments() {
            try {
                const response = await fetch('/api/appointments/today');
                const data = await response.json();
                const appointments = data.data || [];

                const tbody = document.getElementById('appointmentsTableBody');
                tbody.innerHTML = '';

                if (appointments.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5 text-muted"><i class="fas fa-calendar-day fa-3x mb-3 opacity-25"></i><p>No appointments booked for today.</p></td></tr>';
                    return;
                }

                // Sort by time
                appointments.sort((a, b) => a.appointmentTime.localeCompare(b.appointmentTime));

                appointments.forEach(appt => {
                    const row = document.createElement('tr');
                    row.className = 'appointment-row border-bottom';
                    row.innerHTML = `
                        <td class="ps-4">
                            <div class="fw-bold">${appt.appointmentTime.substring(0, 5)}</div>
                        </td>
                        <td><small class="text-muted">${appt.appointmentNumber}</small></td>
                        <td>
                            <div class="fw-bold">${appt.patientName}</div>
                            <div class="small text-muted">UHID: ${appt.patientUhid || 'N/A'}</div>
                        </td>
                        <td>
                            <div>Dr. ${appt.doctorName}</div>
                        </td>
                    <td>
                        <span class="badge rounded-pill px-3 py-1 fs-10 fw-bold border ${statusClass}">${appt.status.replace('_', ' ')}</span>
                    </td>
                        <td class="text-end pe-4">
                            ${appt.status === 'BOOKED' ? `
                                <button class="btn btn-sm btn-emerald-theme me-1 shadow-sm" onclick="updateStatus(${appt.id}, 'CHECKED_IN')" title="Check-in">
                                    <i class="fas fa-user-check"></i>
                                </button>
                            ` : ''}
                            ${appt.status === 'CHECKED_IN' ? `
                                <a href="/lab/patients/${appt.patientId}?visitId=${appt.visitId}" class="btn btn-sm btn-emerald-soft me-1 shadow-sm" title="Open EMR Visit">
                                    <i class="fas fa-notes-medical"></i>
                                </a>
                                <button class="btn btn-sm btn-outline-emerald-theme me-1 shadow-sm" onclick="updateStatus(${appt.id}, 'COMPLETED')" title="Mark as Completed">
                                    <i class="fas fa-check-double"></i>
                                </button>
                            ` : ''}
                            ${appt.status === 'BOOKED' ? `
                                <button class="btn btn-sm btn-outline-danger shadow-sm" onclick="updateStatus(${appt.id}, 'CANCELLED')" title="Cancel">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading appointments:', error);
                document.getElementById('appointmentsTableBody').innerHTML = '<tr><td colspan="6" class="text-center py-5 text-danger">Failed to load appointments.</td></tr>';
            }
        }

        async function updateStatus(id, status) {
            const confirmMsg = status === 'CANCELLED' ? 'Are you sure you want to cancel this appointment?' : `Update status to ${status.replace('_', ' ')}?`;
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch(`/api/appointments/${id}/status?status=${status}`, {
                    method: 'PATCH'
                });

                if (response.ok) {
                    loadAppointments();
                } else {
                    alert('Failed to update status.');
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }
    </script>
</body>

</html>
