<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Billing Dashboard - Hospital Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --success-color: #2ec4b6;
            --warning-color: #ff9f1c;
            --danger-color: #e71d36;
            --card-border-radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        [data-theme="dark"] body {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #ffffff;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
        }

        [data-theme="dark"] .sidebar {
            background: #1e293b;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
        }

        .card {
            border: none;
            border-radius: var(--card-border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background: #fff;
        }

        [data-theme="dark"] .card {
            background: #1e293b;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 0.35rem 0.65rem;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-DRAFT {
            background: #e0e7ff;
            color: #4338ca;
        }

        .status-GENERATED {
            background: #fef3c7;
            color: #92400e;
        }

        .status-PARTIALLY_PAID {
            background: #dcfce7;
            color: #166534;
        }

        .status-PAID {
            background: #10b981;
            color: #fff;
        }

        .status-CANCELLED {
            background: #fee2e2;
            color: #991b1b;
        }

        .stat-card i {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body data-theme="light">
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column p-3">
        <a href="/dashboard" class="d-flex align-items-center mb-4 me-md-auto text-decoration-none text-primary">
            <i class="fas fa-hospital-user fs-4 me-2"></i>
            <span class="fs-4 fw-bold">HMS Billing</span>
        </a>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a href="/dashboard" class="nav-link text-body">
                    <i class="fas fa-home me-2"></i> Dashboard
                </a>
            </li>
            <li>
                <a href="/masters/charges" class="nav-link text-body">
                    <i class="fas fa-list-check me-2"></i> Charge Master
                </a>
            </li>
            <li>
                <a href="/admin/billing" class="nav-link active">
                    <i class="fas fa-file-invoice-dollar me-2"></i> Patient Billing
                </a>
            </li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold mb-0">Billing Dashboard</h2>
                <p class="text-muted">Monitor hospital revenue and manage invoices</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary" id="themeToggle">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn-primary" onclick="loadBills()">
                    <i class="fas fa-sync-alt me-2"></i> Refresh
                </button>
            </div>
        </div>

        <!-- Revenue Stats -->
        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <i class="fas fa-wallet bg-primary text-white"></i>
                    <div class="text-muted small">Total Collections</div>
                    <div class="fs-4 fw-bold" id="totalCollections">₹0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <i class="fas fa-hand-holding-dollar bg-warning text-white"></i>
                    <div class="text-muted small">Pending Dues</div>
                    <div class="fs-4 fw-bold text-warning" id="pendingDues">₹0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <i class="fas fa-file-invoice bg-success text-white"></i>
                    <div class="text-muted small">Invoices Today</div>
                    <div class="fs-4 fw-bold text-success" id="billsToday">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card p-3 stat-card">
                    <i class="fas fa-user-clock bg-info text-white"></i>
                    <div class="text-muted small">Partially Paid</div>
                    <div class="fs-4 fw-bold text-info" id="partialCount">0</div>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="card mb-4">
            <div class="card-body p-3">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="billSearch" class="form-control"
                            placeholder="Search by Bill No or Patient Name...">
                    </div>
                    <div class="col-md-3">
                        <select id="statusFilter" class="form-select">
                            <option value="">All Statuses</option>
                            <option value="DRAFT">Draft</option>
                            <option value="GENERATED">Generated</option>
                            <option value="PARTIALLY_PAID">Partially Paid</option>
                            <option value="PAID">Paid</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Invoices Table -->
        <div class="card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="bg-light">
                        <tr>
                            <th class="ps-4 text-nowrap">Bill No</th>
                            <th class="text-nowrap">Patient Details</th>
                            <th class="text-nowrap">Net Amount</th>
                            <th class="text-nowrap">Paid</th>
                            <th class="text-nowrap">Balance</th>
                            <th class="text-nowrap">Status</th>
                            <th class="text-nowrap">Date</th>
                            <th class="text-end pe-4">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="billTableBody">
                        <!-- Loaded via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/theme.js"></script>
    <script>
        let bills = [];
        const token = localStorage.getItem('token');

        async function loadBills() {
            try {
                const res = await fetch('/api/billing/bills', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const response = await res.json();
                bills = response.data;
                renderBills();
                updateStats();
            } catch (err) {
                console.error('Failed to load bills:', err);
            }
        }

        function renderBills() {
            const tbody = document.getElementById('billTableBody');
            const search = document.getElementById('billSearch').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;

            const filtered = bills.filter(b =>
                (b.billNumber.toLowerCase().includes(search) || b.patientName.toLowerCase().includes(search)) &&
                (!status || b.status === status)
            );

            tbody.innerHTML = filtered.map(b => `
                <tr>
                    <td class="ps-4 fw-bold">#${b.billNumber}</td>
                    <td>
                        <div class="fw-medium">${b.patientName}</div>
                        <div class="text-muted extra-small">${b.patientUhid}</div>
                    </td>
                    <td class="fw-bold">₹${b.netAmount.toFixed(2)}</td>
                    <td class="text-success">₹${b.paidAmount.toFixed(2)}</td>
                    <td class="text-danger">₹${b.balanceAmount.toFixed(2)}</td>
                    <td><span class="status-badge status-${b.status}">${b.status.replace('_', ' ')}</span></td>
                    <td>${new Date(b.createdOn).toLocaleDateString()}</td>
                    <td class="text-end pe-4">
                        <a href="/admin/invoice/${b.id}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="fas fa-eye me-1"></i> View
                        </a>
                    </td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const collections = bills.reduce((sum, b) => sum + b.paidAmount, 0);
            const dues = bills.reduce((sum, b) => sum + b.balanceAmount, 0);
            const today = new Date().toLocaleDateString();
            const todayCount = bills.filter(b => new Date(b.createdOn).toLocaleDateString() === today).length;
            const partials = bills.filter(b => b.status === 'PARTIALLY_PAID').length;

            document.getElementById('totalCollections').textContent = `₹${collections.toLocaleString()}`;
            document.getElementById('pendingDues').textContent = `₹${dues.toLocaleString()}`;
            document.getElementById('billsToday').textContent = todayCount;
            document.getElementById('partialCount').textContent = partials;
        }

        document.getElementById('billSearch').oninput = renderBills;
        document.getElementById('statusFilter').onchange = renderBills;

        loadBills();
    </script>
</body>

</html>
