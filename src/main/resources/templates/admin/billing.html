<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <title>Billing Dashboard - Hospital Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Sidebar -->
<div th:replace="~{fragments/sidebars/owner_sidebar :: owner_sidebar('billing-dash')}"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Billing Dashboard</h1>
            <p class="text-theme-muted mb-0">Monitor hospital revenue and manage invoices</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm" onclick="loadBills()">
                <i class="fas fa-sync-alt me-2"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Revenue Stats -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="metric-card glass-card h-100 p-4">
                <div class="metric-icon bg-emerald-500 bg-opacity-10 text-emerald-500 mb-3">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="text-theme-muted small fw-bold text-uppercase mb-1"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Total Collections</div>
                <div class="insight-value text-theme fw-bold fs-4" id="totalCollections">₹0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card glass-card h-100 p-4">
                <div class="metric-icon bg-warning bg-opacity-10 text-warning mb-3">
                    <i class="fas fa-hand-holding-dollar"></i>
                </div>
                <div class="text-theme-muted small fw-bold text-uppercase mb-1"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Pending Dues</div>
                <div class="insight-value text-warning fw-bold fs-4" id="pendingDues">₹0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card glass-card h-100 p-4">
                <div class="metric-icon bg-success bg-opacity-10 text-success mb-3">
                    <i class="fas fa-file-invoice"></i>
                </div>
                <div class="text-theme-muted small fw-bold text-uppercase mb-1"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Invoices Today</div>
                <div class="insight-value text-success fw-bold fs-4" id="billsToday">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric-card glass-card h-100 p-4">
                <div class="metric-icon bg-info bg-opacity-10 text-info mb-3">
                    <i class="fas fa-user-clock"></i>
                </div>
                <div class="text-theme-muted small fw-bold text-uppercase mb-1"
                    style="font-size: 0.7rem; letter-spacing: 0.05em;">Partially Paid</div>
                <div class="insight-value text-info fw-bold fs-4" id="partialCount">0</div>
            </div>
        </div>
    </div>

    <!-- Filters -->
    <div class="glass-card mb-4 p-3">
        <div class="row g-3">
            <div class="col-md-6">
                <div class="position-relative">
                    <i class="fas fa-search position-absolute text-theme-muted"
                        style="left: 1.25rem; top: 50%; transform: translateY(-50%);"></i>
                    <input type="text" id="billSearch"
                        class="form-control rounded-pill ps-5 border-theme-light bg-theme-light"
                        placeholder="Search by Bill No or Patient Name...">
                </div>
            </div>
            <div class="col-md-4">
                <select id="statusFilter" class="form-select rounded-pill border-theme-light bg-theme-light">
                    <option value="">All Statuses</option>
                    <option value="DRAFT">Draft</option>
                    <option value="GENERATED">Generated</option>
                    <option value="PARTIALLY_PAID">Partially Paid</option>
                    <option value="PAID">Paid</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Invoices Table -->
    <div class="glass-card p-0 overflow-hidden shadow-sm">
        <div class="table-responsive">
            <table class="table premium-table align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">Bill No</th>
                        <th>Patient Details</th>
                        <th>Net Amount</th>
                        <th>Paid</th>
                        <th>Balance</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="billTableBody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/theme.js"></script>
<script>
    let bills = [];
    const token = localStorage.getItem('token');

    async function loadBills() {
        try {
            const res = await fetch('/api/billing/bills', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const response = await res.json();
            bills = response.data;
            renderBills();
            updateStats();
        } catch (err) {
            console.error('Failed to load bills:', err);
        }
    }

    function renderBills() {
        const tbody = document.getElementById('billTableBody');
        const search = document.getElementById('billSearch').value.toLowerCase();
        const status = document.getElementById('statusFilter').value;

        const filtered = bills.filter(b =>
            (b.billNumber.toLowerCase().includes(search) || b.patientName.toLowerCase().includes(search)) &&
            (!status || b.status === status)
        );

        tbody.innerHTML = filtered.map(b => `
                <tr>
                    <td class="ps-4 fw-bold text-theme">#${b.billNumber}</td>
                    <td>
                        <div class="fw-bold text-theme">${b.patientName}</div>
                        <div class="text-theme-muted smaller">${b.patientUhid}</div>
                    </td>
                    <td class="fw-bold text-theme">₹${b.netAmount.toFixed(2)}</td>
                    <td class="text-emerald-400">₹${b.paidAmount.toFixed(2)}</td>
                    <td class="text-red-400">₹${b.balanceAmount.toFixed(2)}</td>
                    <td><span class="badge bg-emerald-500 bg-opacity-10 text-emerald-400 rounded-pill px-3 py-1 fs-12 fw-bold border border-emerald-500/20">${b.status.replace('_', ' ')}</span></td>
                    <td class="text-theme-muted small">${new Date(b.createdOn).toLocaleDateString()}</td>
                    <td class="text-end pe-4">
                        <a href="/admin/invoice/${b.id}" class="btn btn-sm btn-outline-emerald action-icon-btn">
                            <i class="fas fa-eye"></i>
                        </a>
                    </td>
                </tr>
            `).join('');
    }

    function updateStats() {
        const collections = bills.reduce((sum, b) => sum + b.paidAmount, 0);
        const dues = bills.reduce((sum, b) => sum + b.balanceAmount, 0);
        const today = new Date().toLocaleDateString();
        const todayCount = bills.filter(b => new Date(b.createdOn).toLocaleDateString() === today).length;
        const partials = bills.filter(b => b.status === 'PARTIALLY_PAID').length;

        document.getElementById('totalCollections').textContent = `₹${collections.toLocaleString()}`;
        document.getElementById('pendingDues').textContent = `₹${dues.toLocaleString()}`;
        document.getElementById('billsToday').textContent = todayCount;
        document.getElementById('partialCount').textContent = partials;
    }

    document.getElementById('billSearch').oninput = renderBills;
    document.getElementById('statusFilter').onchange = renderBills;

    loadBills();
</script>
</body>

</html>
