<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Network - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('hospitals')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1 text-theme" style="font-family: 'Outfit';">Hospital Network</h1>
                    <p class="text-theme-muted mb-0">Manage clinical nodes and infrastructure across the hospital system
                    </p>
                </div>
                <button class="btn btn-emerald-theme fw-bold px-4 rounded-pill shadow-sm">
                    <i class="fas fa-plus me-2"></i>Add New Node
                </button>
            </div>

            <div class="row g-4">
                <!-- Hospital Card 1 -->
                <div class="glass-card p-0 overflow-hidden shadow-sm h-100">
                    <div class="d-flex align-items-center justify-content-center"
                        style="height: 120px; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
                        <i class="fas fa-hospital text-white opacity-25" style="font-size: 4rem;"></i>
                    </div>
                    <div class="p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="fw-bold mb-0 text-theme">City General Hospital</h5>
                            <span class="badge bg-success-subtle text-success rounded-pill px-3">Active</span>
                        </div>
                        <p class="text-theme-muted small mb-4"><i
                                class="fas fa-map-marker-alt me-2 text-emerald-500"></i>Main Square,
                            Sector 12</p>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <div class="bg-tertiary-theme border border-color-theme rounded-3 p-3 text-center">
                                    <div class="small text-theme-muted">Doctors</div>
                                    <div class="fw-bold text-theme">45</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-tertiary-theme border border-color-theme rounded-3 p-3 text-center">
                                    <div class="small text-theme-muted">Nurses</div>
                                    <div class="fw-bold text-theme">120</div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between small mb-1">
                                <span class="text-theme-muted">Bed Capacity</span>
                                <span class="fw-bold text-success">85% Full</span>
                            </div>
                            <div class="progress"
                                style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.05);">
                                <div class="progress-bar bg-emerald-500" role="progressbar" style="width: 85%;"
                                    aria-valuenow="85" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-emerald-theme w-100 rounded-pill py-2">Configure</button>
                            <button class="btn btn-outline-secondary rounded-pill"><i
                                    class="fas fa-ellipsis-v"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Hospital Card 2 -->
                <div class="glass-card p-0 overflow-hidden shadow-sm h-100">
                    <div class="d-flex align-items-center justify-content-center"
                        style="height: 120px; background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);">
                        <i class="fas fa-hospital-alt text-white opacity-25" style="font-size: 4rem;"></i>
                    </div>
                    <div class="p-4">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <h5 class="fw-bold mb-0 text-theme">Metro Health Center</h5>
                            <span class="badge bg-success-subtle text-success rounded-pill px-3">Active</span>
                        </div>
                        <p class="text-theme-muted small mb-4"><i
                                class="fas fa-map-marker-alt me-2 text-blue-500"></i>Downside Road,
                            Block B</p>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <div class="bg-tertiary-theme border border-color-theme rounded-3 p-3 text-center">
                                    <div class="small text-theme-muted">Doctors</div>
                                    <div class="fw-bold text-theme">32</div>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="bg-tertiary-theme border border-color-theme rounded-3 p-3 text-center">
                                    <div class="small text-theme-muted">Nurses</div>
                                    <div class="fw-bold text-theme">84</div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between small mb-1">
                                <span class="text-theme-muted">Bed Capacity</span>
                                <span class="fw-bold text-blue-400">60% Full</span>
                            </div>
                            <div class="progress"
                                style="height: 8px; border-radius: 4px; background: rgba(255,255,255,0.05);">
                                <div class="progress-bar bg-blue-500" role="progressbar" style="width: 60%;"
                                    aria-valuenow="60" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-blue-theme w-100 rounded-pill py-2">Configure</button>
                            <button class="btn btn-outline-secondary rounded-pill"><i
                                    class="fas fa-ellipsis-v"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
