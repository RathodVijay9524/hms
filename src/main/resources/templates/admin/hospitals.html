<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Network - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .network-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
        }

        .network-card:hover {
            transform: translateY(-5px);
            border-color: rgba(16, 185, 129, 0.4);
        }

        .hospital-banner {
            height: 120px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            position: relative;
        }

        .capacity-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .capacity-fill {
            height: 100%;
            background: #10b981;
            border-radius: 4px;
        }

        .node-stat {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/admin_sidebar :: admin_sidebar('hospitals')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #10b981;">Hospital Network</h1>
                    <p class="text-muted mb-0">Manage clinical nodes and infrastructure across the hospital system</p>
                </div>
                <button class="btn text-dark fw-bold px-4 rounded-pill" style="background: #10b981;">
                    <i class="fas fa-plus me-2"></i>Add New Node
                </button>
            </div>

            <div class="row g-4">
                <!-- Hospital Card 1 -->
                <div class="col-md-6 col-lg-4">
                    <div class="network-card shadow-sm">
                        <div class="hospital-banner d-flex align-items-center justify-content-center">
                            <i class="fas fa-hospital text-white opacity-25" style="font-size: 4rem;"></i>
                        </div>
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="fw-bold mb-0">City General Hospital</h5>
                                <span class="badge bg-success rounded-pill">Active</span>
                            </div>
                            <p class="text-muted small mb-4"><i class="fas fa-map-marker-alt me-2"></i>Main Square,
                                Sector 12</p>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <div class="node-stat">
                                        <div class="small text-muted">Doctors</div>
                                        <div class="fw-bold">45</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="node-stat">
                                        <div class="small text-muted">Nurses</div>
                                        <div class="fw-bold">120</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between small mb-1">
                                    <span class="text-muted">Bed Capacity</span>
                                    <span class="fw-bold">85% Full</span>
                                </div>
                                <div class="capacity-bar">
                                    <div class="capacity-fill" style="width: 85%;"></div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-indigo w-100 rounded-pill"
                                    style="background: #10b981; color: #000; border: none;">Configure</button>
                                <button class="btn btn-outline-secondary rounded-pill"><i
                                        class="fas fa-ellipsis-v"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Hospital Card 2 -->
                <div class="col-md-6 col-lg-4">
                    <div class="network-card shadow-sm">
                        <div class="hospital-banner d-flex align-items-center justify-content-center"
                            style="background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);">
                            <i class="fas fa-hospital-alt text-white opacity-25" style="font-size: 4rem;"></i>
                        </div>
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <h5 class="fw-bold mb-0">Metro Health Center</h5>
                                <span class="badge bg-success rounded-pill">Active</span>
                            </div>
                            <p class="text-muted small mb-4"><i class="fas fa-map-marker-alt me-2"></i>Downside Road,
                                Block B</p>

                            <div class="row g-2 mb-4">
                                <div class="col-6">
                                    <div class="node-stat">
                                        <div class="small text-muted">Doctors</div>
                                        <div class="fw-bold">32</div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="node-stat">
                                        <div class="small text-muted">Nurses</div>
                                        <div class="fw-bold">84</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <div class="d-flex justify-content-between small mb-1">
                                    <span class="text-muted">Bed Capacity</span>
                                    <span class="fw-bold">60% Full</span>
                                </div>
                                <div class="capacity-bar">
                                    <div class="capacity-fill" style="width: 60%; background: #3b82f6;"></div>
                                </div>
                            </div>

                            <div class="d-flex gap-2">
                                <button class="btn btn-indigo w-100 rounded-pill"
                                    style="background: #10b981; color: #000; border: none;">Configure</button>
                                <button class="btn btn-outline-secondary rounded-pill"><i
                                        class="fas fa-ellipsis-v"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
