<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .section-title {
            font-family: 'Outfit';
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .stat-icon.green {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .stat-icon.blue {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .stat-icon.purple {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        .stat-value {
            font-family: 'Outfit';
            font-size: 2rem;
            font-weight: 700;
        }

        @media (max-width: 992px) {
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('admin-dash')}"></div>

    <div class="main-content">
        <h1 class="section-title">Hospital Administration</h1>

        <div class="row g-4 mb-4">
            <div class="col-md-6 col-lg-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="stat-value" th:text="${totalPatients}">0</div>
                            <div class="text-muted">Total Patients</div>
                        </div>
                        <div class="stat-icon green"><i class="fas fa-users"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="stat-value" th:text="${totalTests}">0</div>
                            <div class="text-muted">Active Services</div>
                        </div>
                        <div class="stat-icon blue"><i class="fas fa-flask"></i></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 col-lg-3">
                <div class="stat-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <div class="stat-value" th:text="${pendingOrders}">0</div>
                            <div class="text-muted">Pending Orders</div>
                        </div>
                        <div class="stat-icon purple"><i class="fas fa-clock"></i></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="stat-card h-100">
                    <h5 class="mb-4">System Utilities</h5>
                    <div class="list-group list-group-flush">
                        <a th:href="@{/owner/workers}"
                            class="list-group-item bg-transparent text-primary border-0 px-0 d-flex align-items-center">
                            <i class="fas fa-user-shield me-3"></i> User Access Control
                        </a>
                        <a th:href="@{/owner/departments}"
                            class="list-group-item bg-transparent text-primary border-0 px-0 d-flex align-items-center">
                            <i class="fas fa-building me-3"></i> Infrastructure Management
                        </a>
                        <a th:href="@{/admin/billing}"
                            class="list-group-item bg-transparent text-primary border-0 px-0 d-flex align-items-center">
                            <i class="fas fa-file-invoice-dollar me-3"></i> Revenue Oversight
                        </a>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="stat-card h-100 text-center d-flex flex-column justify-content-center">
                    <i class="fas fa-shield-halved fa-3x mb-3 text-muted opacity-50"></i>
                    <h4>Security & Audit</h4>
                    <p class="text-muted">Monitor system logs and user activities from the audit trail module.</p>
                    <div class="mt-3">
                        <button class="btn btn-outline-primary btn-sm">View System Logs</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
