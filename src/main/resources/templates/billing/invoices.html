<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Invoices - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/billing_sidebar :: billing_sidebar('invoices')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="billing-header d-flex justify-content-between align-items-center mb-4 text-white">
                <div class="position-relative" style="z-index: 1;">
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit';">All Invoices</h1>
                    <p class="mb-0 opacity-75 small">Overview of all patient billings and payment statuses</p>
                </div>
                <div class="d-flex gap-2" style="z-index: 1;">
                    <button class="btn btn-sm btn-outline-light rounded-pill px-4">
                        <i class="fas fa-file-export me-2"></i>Export
                    </button>
                    <button class="btn btn-sm btn-light text-theme fw-bold px-4 rounded-pill">
                        <i class="fas fa-plus me-2"></i>New Invoice
                    </button>
                </div>
            </div>

            <!-- Stats & Search -->
            <div class="row g-4 mb-4">
                <div class="col-md-9">
                    <div class="position-relative">
                        <i class="fas fa-search position-absolute text-theme-muted"
                            style="left: 1.25rem; top: 1rem;"></i>
                        <input type="text" class="form-control rounded-pill bg-primary bg-opacity-10 border-0 px-5 py-2"
                            placeholder="Search by Invoice #, Patient Name or UHID...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select class="form-select rounded-pill bg-primary bg-opacity-10 border-0 text-theme py-2">
                        <option>All Statuses</option>
                        <option>Paid Only</option>
                        <option>Unpaid Only</option>
                        <option>Partial Payments</option>
                    </select>
                </div>
            </div>

            <!-- Invoice List -->
            <div class="glass-card p-0 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-premium align-middle mb-0">
                        <thead class="bg-primary bg-opacity-10">
                            <tr class="text-theme-muted small text-uppercase fw-bold ls-1 border-0">
                                <th class="ps-4 py-3">Invoice #</th>
                                <th class="py-3">Patient Details</th>
                                <th class="py-3">Date</th>
                                <th class="py-3">Amount</th>
                                <th class="py-3">Status</th>
                                <th class="pe-4 py-3 text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="invoicesTableBody">
                            <!-- Invoices will be loaded dynamically -->
                            <tr>
                                <td colspan="6" class="text-center text-theme-muted py-4">
                                    <i class="fas fa-spinner fa-spin me-2"></i> Loading invoices...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        // Load all bills
        async function loadInvoices() {
            try {
                const response = await fetch('/api/billing/bills');
                const result = await response.json();

                if (result.status === 'success' && result.data) {
                    const bills = result.data;
                    const tbody = document.getElementById('invoicesTableBody');

                    if (bills.length === 0) {
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="6" class="text-center text-theme-muted py-5">
                                    <i class="fas fa-file-invoice fa-3x mb-3 opacity-25"></i>
                                    <div>No invoices found</div>
                                </td>
                            </tr>`;
                        return;
                    }

                    tbody.innerHTML = bills.map(bill => {
                        const statusBadge = getStatusBadge(bill.status);
                        const createdDate = new Date(bill.createdOn);

                        return `
                            <tr class="invoice-row">
                                <td class="ps-4">
                                    <div class="fw-bold">${bill.billNumber}</div>
                                    <div class="small text-muted">${bill.items && bill.items.length > 0 ? bill.items[0].itemName : 'General Billing'}</div>
                                </td>
                                <td>
                                    <div class="fw-bold fs-6">${bill.patientName}</div>
                                    <div class="small text-muted">${bill.patientUhid}</div>
                                </td>
                                <td>
                                    <div>${createdDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })}</div>
                                    <div class="small text-muted">${createdDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</div>
                                </td>
                                <td>
                                    <div class="fw-bold">₹ ${parseFloat(bill.netAmount || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
                                </td>
                                <td>${statusBadge}</td>
                                <td class="pe-4 text-end">
                                    <button class="btn btn-sm btn-outline-pink rounded-pill px-3" onclick="printBill(${bill.id})">Print</button>
                                    <button class="btn btn-sm btn-pink-theme rounded-pill px-3" onclick="viewBill(${bill.id})">View</button>
                                </td>
                            </tr>`;
                    }).join('');
                } else {
                    showError();
                }
            } catch (error) {
                console.error('Error loading invoices:', error);
                showError();
            }
        }

        function getStatusBadge(status) {
            const statusMap = {
                'PAID': '<span class="badge bg-emerald-500 bg-opacity-10 text-emerald-400 rounded-pill px-3">Paid</span>',
                'PARTIALLY_PAID': '<span class="badge bg-amber-500 bg-opacity-10 text-amber-400 rounded-pill px-3">Partial</span>',
                'GENERATED': '<span class="badge bg-blue-500 bg-opacity-10 text-blue-400 rounded-pill px-3">Generated</span>',
                'DRAFT': '<span class="badge bg-gray-500 bg-opacity-10 text-gray-400 rounded-pill px-3">Draft</span>',
                'CANCELLED': '<span class="badge bg-red-500 bg-opacity-10 text-red-400 rounded-pill px-3">Cancelled</span>'
            };
            return statusMap[status] || '<span class="badge bg-red-500 bg-opacity-10 text-red-400 rounded-pill px-3">Unpaid</span>';
        }

        function showError() {
            document.getElementById('invoicesTableBody').innerHTML = `
                <tr>
                    <td colspan="6" class="text-center text-danger py-5">
                        <i class="fas fa-exclamation-triangle fa-2x mb-3"></i>
                        <div>Error loading invoices. Please refresh the page.</div>
                    </td>
                </tr>`;
        }

        function viewBill(billId) {
            // Fetch and display bill details
            fetch(`/api/billing/bills/${billId}`)
                .then(r => r.json())
                .then(result => {
                    if (result.status === 'success' && result.data) {
                        const bill = result.data;
                        const items = bill.items || [];
                        const itemsList = items.map(i => `${i.itemName}: ₹${i.totalAmount}`).join('\n');
                        alert(`Bill Details:\n\nBill #: ${bill.billNumber}\nPatient: ${bill.patientName}\nUHID: ${bill.patientUhid}\n\nItems:\n${itemsList}\n\nTotal: ₹${bill.netAmount}\nStatus: ${bill.status}`);
                    }
                })
                .catch(err => alert('Error loading bill details'));
        }

        function printBill(billId) {
            // For now, just show the bill details
            // You can create a proper print template later
            fetch(`/api/billing/bills/${billId}`)
                .then(r => r.json())
                .then(result => {
                    if (result.status === 'success' && result.data) {
                        // Open print dialog with bill info
                        const bill = result.data;
                        const printWindow = window.open('', '_blank');
                        printWindow.document.write(`
                            <html>
                            <head>
                                <title>Invoice ${bill.billNumber}</title>
                                <style>
                                    body { font-family: Arial; padding: 20px; }
                                    h1 { color: #333; }
                                    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
                                    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                                    th { background: #f4f4f4; }
                                </style>
                            </head>
                            <body>
                                <h1>Invoice ${bill.billNumber}</h1>
                                <p><strong>Patient:</strong> ${bill.patientName}</p>
                                <p><strong>UHID:</strong> ${bill.patientUhid}</p>
                                <p><strong>Date:</strong> ${new Date(bill.createdOn).toLocaleDateString()}</p>
                                <table>
                                    <tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr>
                                    ${(bill.items || []).map(i => `
                                        <tr>
                                            <td>${i.itemName}</td>
                                            <td>${i.quantity}</td>
                                            <td>₹${i.unitPrice}</td>
                                            <td>₹${i.totalAmount}</td>
                                        </tr>
                                    `).join('')}
                                </table>
                                <p><strong>Total Amount: ₹${bill.netAmount}</strong></p>
                                <p><strong>Status: ${bill.status}</strong></p>
                            </body>
                            </html>
                        `);
                        printWindow.document.close();
                        printWindow.print();
                    }
                })
                .catch(err => alert('Error loading bill for printing'));
        }

        // Load invoices on page load
        document.addEventListener('DOMContentLoaded', loadInvoices);
    </script>
</body>

</html>
