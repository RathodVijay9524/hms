<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections Terminal - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .terminal-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            padding: 2rem;
            height: 100%;
        }

        .payment-mode-btn {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .payment-mode-btn:hover {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.05);
        }

        .payment-mode-btn.active {
            border-color: #f43f5e;
            background: rgba(244, 63, 94, 0.1);
            box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.2);
        }

        .payment-mode-btn i {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: #f43f5e;
        }

        .collection-table th {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            padding: 1rem;
        }

        .collection-table td {
            padding: 1rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        .amount-display {
            font-family: 'Outfit';
            font-weight: 700;
            font-size: 2rem;
            color: #f43f5e;
            text-align: right;
            padding: 1rem;
            background: var(--bg-primary);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/billing_sidebar :: billing_sidebar('collections')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #f43f5e;">Collections Terminal</h1>
                    <p class="text-muted mb-0">Daily cash/payment collection and shift reconciliation</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary rounded-pill px-4">
                        <i class="fas fa-print me-2"></i>Daily Summary
                    </button>
                    <button class="btn text-white fw-bold px-4 rounded-pill" style="background: #f43f5e;">
                        <i class="fas fa-lock me-2"></i>Close Shift
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <!-- Payment Entry -->
                <div class="col-lg-5">
                    <div class="terminal-card">
                        <h5 class="fw-bold mb-4" style="font-family: 'Outfit';">Receive Payment</h5>

                        <div class="mb-4">
                            <label class="small text-muted mb-2">Invoice Number</label>
                            <div class="input-group">
                                <input type="text" class="form-control bg-primary border-0 text-white"
                                    style="border-radius: 0.75rem 0 0 0.75rem; padding: 0.75rem;"
                                    placeholder="e.g. INV-2025-0812">
                                <button class="btn btn-danger px-4"
                                    style="background: #f43f5e; border-radius: 0 0.75rem 0.75rem 0;">Fetch</button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="small text-muted mb-2">Payment Mode</label>
                            <div class="row g-3">
                                <div class="col-4">
                                    <div class="payment-mode-btn active">
                                        <i class="fas fa-money-bill-wave"></i>
                                        <div class="small fw-bold">Cash</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="payment-mode-btn">
                                        <i class="fas fa-credit-card"></i>
                                        <div class="small fw-bold">Card</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="payment-mode-btn">
                                        <i class="fas fa-qrcode"></i>
                                        <div class="small fw-bold">UPI</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="small text-muted mb-2">Amount to Collect</label>
                            <div class="amount-display">₹ 0.00</div>
                        </div>

                        <button class="btn text-white fw-bold w-100 py-3 rounded-pill shadow-lg"
                            style="background: #f43f5e;">
                            Confirm Receipt & Print
                        </button>
                    </div>
                </div>

                <!-- Recent Collections -->
                <div class="col-lg-7">
                    <div class="terminal-card">
                        <h5 class="fw-bold mb-4" style="font-family: 'Outfit';">Recent Activity (Today)</h5>
                        <div class="table-responsive">
                            <table class="table collection-table mb-0">
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Invoice #</th>
                                        <th>Mode</th>
                                        <th class="text-end">Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="small text-muted">14:20 PM</td>
                                        <td class="fw-bold">INV-0812</td>
                                        <td><span class="badge bg-success-subtle text-success">CASH</span></td>
                                        <td class="text-end fw-bold">₹ 1,250.00</td>
                                    </tr>
                                    <tr>
                                        <td class="small text-muted">13:45 PM</td>
                                        <td class="fw-bold">INV-0810</td>
                                        <td><span class="badge bg-primary-subtle text-primary">UPI</span></td>
                                        <td class="text-end fw-bold">₹ 850.00</td>
                                    </tr>
                                    <tr>
                                        <td class="small text-muted">11:12 AM</td>
                                        <td class="fw-bold">INV-0798</td>
                                        <td><span class="badge bg-secondary-subtle text-white">CARD</span></td>
                                        <td class="text-end fw-bold">₹ 5,400.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
