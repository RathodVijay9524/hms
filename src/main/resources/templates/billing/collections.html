<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collections Terminal - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/billing_sidebar :: billing_sidebar('collections')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <div class="billing-header d-flex justify-content-between align-items-center mb-4 text-white">
                <div class="position-relative" style="z-index: 1;">
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit';">Collections Terminal</h1>
                    <p class="mb-0 opacity-75 small">Daily cash/payment collection and shift reconciliation</p>
                </div>
                <div class="d-flex gap-2" style="z-index: 1;">
                    <button class="btn btn-sm btn-outline-light rounded-pill px-4">
                        <i class="fas fa-print me-2"></i>Daily Summary
                    </button>
                    <button class="btn btn-sm btn-light text-theme fw-bold px-4 rounded-pill">
                        <i class="fas fa-lock me-2"></i>Close Shift
                    </button>
                </div>
            </div>

            <div class="row g-4">
                <!-- Payment Entry -->
                <div class="col-lg-5">
                    <div class="glass-card">
                        <h5 class="fw-bold mb-4 text-theme" style="font-family: 'Outfit';">Receive Payment</h5>

                        <div class="mb-4">
                            <label class="small text-theme-muted mb-2">Invoice Number</label>
                            <div class="input-group">
                                <input type="text" class="form-control bg-primary bg-opacity-10 border-0 text-theme"
                                    style="border-radius: 0.75rem 0 0 0.75rem; padding: 0.75rem;"
                                    placeholder="e.g. INV-2025-0812">
                                <button class="btn btn-pink-theme px-4"
                                    style="border-radius: 0 0.75rem 0.75rem 0;">Fetch</button>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="small text-theme-muted mb-2">Payment Mode</label>
                            <div class="row g-3">
                                <div class="col-4">
                                    <div class="hub-link text-center active p-3">
                                        <i class="fas fa-money-bill-wave text-emerald-400 fs-3 mb-2"></i>
                                        <div class="small fw-bold text-theme">Cash</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="hub-link text-center p-3">
                                        <i class="fas fa-credit-card text-blue-400 fs-3 mb-2"></i>
                                        <div class="small fw-bold text-theme">Card</div>
                                    </div>
                                </div>
                                <div class="col-4">
                                    <div class="hub-link text-center p-3">
                                        <i class="fas fa-qrcode text-purple-400 fs-3 mb-2"></i>
                                        <div class="small fw-bold text-theme">UPI</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4 text-end">
                            <label class="small text-theme-muted mb-2 d-block">Amount to Collect</label>
                            <div class="insight-value text-theme py-2 px-3 bg-primary bg-opacity-10 rounded-4">₹ 0.00
                            </div>
                        </div>

                        <button class="btn btn-pink-theme w-100 py-3 rounded-pill shadow-lg fw-bold">
                            Confirm Receipt & Print
                        </button>
                    </div>
                </div>

                <!-- Recent Collections -->
                <div class="col-lg-7">
                    <div class="glass-card">
                        <h5 class="fw-bold mb-4 text-theme" style="font-family: 'Outfit';">Recent Activity (Today)</h5>
                        <div class="table-responsive">
                            <table class="table table-premium align-middle mb-0">
                                <thead>
                                    <tr class="text-theme-muted small text-uppercase fw-bold ls-1 border-0">
                                        <th>Time</th>
                                        <th>Invoice #</th>
                                        <th>Mode</th>
                                        <th class="text-end">Amount</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="small text-muted">14:20 PM</td>
                                        <td class="fw-bold">INV-0812</td>
                                        <td><span class="badge bg-success-subtle text-success">CASH</span></td>
                                        <td class="text-end fw-bold">₹ 1,250.00</td>
                                    </tr>
                                    <tr>
                                        <td class="small text-muted">13:45 PM</td>
                                        <td class="fw-bold">INV-0810</td>
                                        <td><span class="badge bg-primary-subtle text-primary">UPI</span></td>
                                        <td class="text-end fw-bold">₹ 850.00</td>
                                    </tr>
                                    <tr>
                                        <td class="small text-muted">11:12 AM</td>
                                        <td class="fw-bold">INV-0798</td>
                                        <td><span class="badge bg-secondary-subtle text-white">CARD</span></td>
                                        <td class="text-end fw-bold">₹ 5,400.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
