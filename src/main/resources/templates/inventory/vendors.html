<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Directory - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebars/inventory_sidebar :: inventory_sidebar('inv-vendors')}"></div>

    <main class="main-content bg-inventory-dark min-vh-100">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #0d9488;">Vendor Directory</h1>
                    <p class="text-muted mb-0">Supplier Contacts & Performance Tracking</p>
                </div>
                <button class="btn btn-teal rounded-pill px-4" style="background: #0d9488; color: white;">
                    <i class="fas fa-plus me-2"></i>Register Vendor
                </button>
            </div>

            <div class="row g-4">
                <div class="col-md-4">
                    <div class="glass-card p-4 h-100 shadow-lg">
                        <div class="d-flex justify-content-between mb-4">
                            <div class="rounded-4 bg-teal-500 bg-opacity-10 text-teal-400 p-3 fs-3 d-flex align-items-center justify-content-center"
                                style="width: 64px; height: 64px;">
                                <i class="fas fa-building-ngo"></i>
                            </div>
                            <span
                                class="badge bg-success bg-opacity-10 text-success rounded-pill align-self-start py-2 px-3 border border-success border-opacity-20">
                                Platinum Partner
                            </span>
                        </div>
                        <h5 class="fw-bold text-white mb-2" style="font-family: 'Outfit'; font-size: 1.25rem;">Sun
                            Pharmaceuticals</h5>
                        <p class="text-muted small mb-4">Primary Medical Supplier</p>
                        <div class="glass-card bg-opacity-10 p-3 mb-4 border-light">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted smaller text-uppercase fw-bold">Total Orders</span>
                                <span class="text-white fw-bold">152</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted smaller text-uppercase fw-bold">Payment Terms</span>
                                <span class="text-white fw-bold">Net 30 Days</span>
                            </div>
                        </div>
                        <button class="btn btn-premium-teal w-100 rounded-pill py-2 fw-bold">View Full Profile</button>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="glass-card p-4 h-100 shadow-lg">
                        <div class="d-flex justify-content-between mb-4">
                            <div class="rounded-4 bg-blue-500 bg-opacity-10 text-blue-400 p-3 fs-3 d-flex align-items-center justify-content-center"
                                style="width: 64px; height: 64px;">
                                <i class="fas fa-microscope"></i>
                            </div>
                            <span
                                class="badge bg-teal-500 bg-opacity-10 text-teal-400 rounded-pill align-self-start py-2 px-3 border border-teal-500 border-opacity-20">
                                Top Rated
                            </span>
                        </div>
                        <h5 class="fw-bold text-white mb-2" style="font-family: 'Outfit'; font-size: 1.25rem;">Roche
                            Diagnostics</h5>
                        <p class="text-muted small mb-4">Lab Equipment & Reagents</p>
                        <div class="glass-card bg-opacity-10 p-3 mb-4 border-light">
                            <div class="d-flex justify-content-between mb-2">
                                <span class="text-muted smaller text-uppercase fw-bold">Total Orders</span>
                                <span class="text-white fw-bold">84</span>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="text-muted smaller text-uppercase fw-bold">Last Order</span>
                                <span class="text-white fw-bold">2 days ago</span>
                            </div>
                        </div>
                        <button class="btn btn-premium-teal w-100 rounded-pill py-2 fw-bold">View Full Profile</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <style>
        .btn-outline-teal {
            color: #0d9488;
            border-color: #0d9488;
        }

        .btn-outline-teal:hover {
            background-color: #0d9488;
            color: white;
        }
    </style>
</body>

</html>
