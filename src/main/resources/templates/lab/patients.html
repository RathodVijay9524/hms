<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .navbar-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
            transition: all 0.3s;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-primary-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
        }

        .btn-primary-gradient:hover {
            opacity: 0.9;
            color: white;
        }

        .patient-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .patient-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-md);
        }

        .patient-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: white;
            font-weight: 600;
        }

        .patient-name {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.25rem;
            color: var(--text-primary);
        }

        .patient-info {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .patient-meta {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .patient-meta-item {
            display: flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .patient-meta-item i {
            margin-right: 6px;
            color: var(--primary-color);
        }

        .search-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            width: 300px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--input-bg-focus);
            color: var(--text-primary);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .badge-gender {
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }

        .badge-male {
            background: var(--info-bg);
            color: var(--info);
        }

        .badge-female {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border-color);
        }

        .form-control,
        .form-select {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus,
        .form-select:focus {
            background: var(--input-bg-focus);
            border-color: var(--primary-color);
            color: var(--text-primary);
            box-shadow: none;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--primary-color);
        }

        @media (max-width: 992px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-flask-vial me-2"></i>MedLab Pro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-2">
                        <button class="theme-toggle" title="Toggle Theme">
                            <i class="fas fa-sun icon-sun"></i><i class="fas fa-moon icon-moon"
                                style="display:none;"></i>
                        </button>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}"><i
                                class="fas fa-sign-out-alt me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <div class="mb-4"><small class="text-muted text-uppercase">Main Menu</small></div>
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a th:href="@{/lab/tests}" class="sidebar-link"><i class="fas fa-flask"></i> Lab Tests</a>
        <a th:href="@{/lab/patients}" class="sidebar-link active"><i class="fas fa-user-injured"></i> Patients</a>
        <a th:href="@{/lab/orders}" class="sidebar-link"><i class="fas fa-clipboard-list"></i> Lab Orders</a>
        <hr style="border-color: var(--border-color);"><a href="#" class="sidebar-link"><i class="fas fa-cog"></i>
            Settings</a>
    </div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Patients</h1>
                <p class="text-muted mb-0">Manage patient records</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" class="search-box" placeholder="Search patients...">
                <button class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#patientModal"><i
                        class="fas fa-plus me-1"></i> Add Patient</button>
            </div>
        </div>

        <div class="row g-4" id="patientsGrid">
            <div class="col-md-6 col-lg-4" th:each="patient : ${patientsPage.content}"
                th:id="'patient-card-' + ${patient.id}">
                <div class="patient-card">
                    <div class="d-flex align-items-start">
                        <div class="patient-avatar"
                            th:text="${#strings.substring(patient.name, 0, 1)} + ${#strings.contains(patient.name, ' ') ? #strings.substring(patient.name, #strings.indexOf(patient.name, ' ')+1, #strings.indexOf(patient.name, ' ')+2) : ''}">
                            JD</div>
                        <div class="ms-3 flex-grow-1">
                            <div class="d-flex justify-content-between">
                                <div class="patient-name" th:text="${patient.name}">John Doe</div>
                                <span class="badge badge-gender"
                                    th:classappend="${#strings.toLowerCase(patient.gender) == 'male' ? 'badge-male' : 'badge-female'}"
                                    th:text="${patient.gender}">Male</span>
                            </div>
                            <div class="patient-info" th:text="${patient.email}">johndoe@email.com</div>
                        </div>
                        <div class="dropdown">
                            <button class="btn btn-link text-muted p-0" data-bs-toggle="dropdown">
                                <i class="fas fa-ellipsis-v"></i>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#"
                                        th:onclick="'editPatient(' + ${patient.id} + ')'"><i
                                            class="fas fa-pen me-2"></i>Edit</a></li>
                                <li><a class="dropdown-item text-danger" href="#"
                                        th:onclick="'deletePatient(' + ${patient.id} + ')'"><i
                                            class="fas fa-trash me-2"></i>Delete</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="patient-meta">
                        <div class="patient-meta-item"><i class="fas fa-calendar"></i> <span
                                th:text="${patient.age}">35</span> years</div>
                        <div class="patient-meta-item"><i class="fas fa-phone"></i> <span th:text="${patient.phone}">+91
                                98765 43210</span></div>
                    </div>
                </div>
            </div>
            <div class="col-12 text-center text-muted" th:if="${patientsPage.empty}">
                No patient records found.
            </div>
        </div>

        <!-- Pagination -->
        <nav class="mt-4" th:if="${patientsPage.totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${patientsPage.first ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/lab/patients(page=${patientsPage.number - 1})}">Previous</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(0, patientsPage.totalPages - 1)}"
                    th:classappend="${i == patientsPage.number ? 'active' : ''}">
                    <a class="page-link" th:href="@{/lab/patients(page=${i})}" th:text="${i + 1}">1</a>
                </li>
                <li class="page-item" th:classappend="${patientsPage.last ? 'disabled' : ''}">
                    <a class="page-link" th:href="@{/lab/patients(page=${patientsPage.number + 1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>

    <!-- Add/Edit Patient Modal -->
    <div class="modal fade" id="patientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Patient</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="patientForm">
                        <input type="hidden" id="patientId">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="patientName" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" id="patientEmail" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" id="patientPhone" class="form-control" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" id="patientDob" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Gender</label>
                                <select id="patientGender" class="form-select" required>
                                    <option value="MALE">Male</option>
                                    <option value="FEMALE">Female</option>
                                    <option value="OTHER">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Address</label>
                            <textarea id="patientAddress" class="form-control" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-gradient" onclick="savePatient()">Save Patient</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        const patientModal = new bootstrap.Modal(document.getElementById('patientModal'));
        const patientForm = document.getElementById('patientForm');

        function editPatient(id) {
            document.getElementById('modalTitle').innerText = 'Edit Patient Record';
            fetch(`/api/lab/patients/${id}`)
                .then(response => response.json())
                .then(patient => {
                    document.getElementById('patientId').value = patient.id;
                    document.getElementById('patientName').value = patient.name;
                    document.getElementById('patientEmail').value = patient.email || '';
                    document.getElementById('patientPhone').value = patient.phone;
                    document.getElementById('patientDob').value = patient.dateOfBirth;
                    document.getElementById('patientGender').value = patient.gender;
                    document.getElementById('patientAddress').value = patient.address || '';
                    patientModal.show();
                });
        }

        function deletePatient(id) {
            if (confirm('Are you sure you want to delete this patient record?')) {
                fetch(`/api/lab/patients/${id}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        } else {
                            alert('Failed to delete patient');
                        }
                    });
            }
        }

        function savePatient() {
            const id = document.getElementById('patientId').value;
            const patientData = {
                name: document.getElementById('patientName').value,
                email: document.getElementById('patientEmail').value,
                phone: document.getElementById('patientPhone').value,
                dateOfBirth: document.getElementById('patientDob').value,
                gender: document.getElementById('patientGender').value,
                address: document.getElementById('patientAddress').value
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/lab/patients/${id}` : '/api/lab/patients';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(patientData)
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Failed to save patient');
                }
            });
        }

        // Reset modal on close
        document.getElementById('patientModal').addEventListener('hidden.bs.modal', function () {
            patientForm.reset();
            document.getElementById('patientId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Patient';
        });

        document.addEventListener('themeChanged', (e) => {
            const theme = e.detail.theme;
            document.querySelectorAll('.theme-toggle').forEach(btn => {
                const sun = btn.querySelector('.icon-sun');
                const moon = btn.querySelector('.icon-moon');
                if (theme === 'dark') { sun.style.display = 'inline'; moon.style.display = 'none'; }
                else { sun.style.display = 'none'; moon.style.display = 'inline'; }
            });
        });
    </script>
</body>

</html>
