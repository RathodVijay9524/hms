<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Orders - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css?v=1.0}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .navbar-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
            transition: all 0.3s;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-primary-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
        }

        .btn-primary-gradient:hover {
            opacity: 0.9;
            color: white;
        }

        .table-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.3s;
        }

        .table-custom {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .table-custom thead th {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem;
        }

        .table-custom tbody td {
            border-color: var(--border-light);
            padding: 1rem;
            vertical-align: middle;
        }

        .table-custom tbody tr:hover {
            background: var(--bg-tertiary);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s;
            margin-right: 0.25rem;
            text-decoration: none;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-icon.view:hover {
            color: var(--secondary-color);
        }

        .btn-icon.ai:hover {
            color: var(--accent-color);
        }

        .btn-icon.pdf:hover {
            color: var(--warning);
        }

        .badge-status {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.75rem;
        }

        .badge-ordered {
            background: var(--info-bg);
            color: var(--info);
        }

        .badge-collected {
            background: var(--warning-bg);
            color: var(--warning);
        }

        .badge-verified {
            background: var(--success-bg);
            color: var(--success);
        }

        .badge-process {
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }

        .badge-result {
            background: rgba(6, 182, 212, 0.2);
            color: #22d3ee;
        }

        .search-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            width: 300px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--input-bg-focus);
            color: var(--text-primary);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            border-radius: 50px;
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-tab:hover,
        .filter-tab.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border-color);
        }

        .form-control,
        .form-select {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus,
        .form-select:focus {
            background: var(--input-bg-focus);
            border-color: var(--primary-color);
            color: var(--text-primary);
            box-shadow: none;
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--primary-color);
        }

        @media (max-width: 992px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-flask-vial me-2"></i>MedLab Pro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-2">
                        <button class="theme-toggle" title="Toggle Theme">
                            <i class="fas fa-sun icon-sun"></i><i class="fas fa-moon icon-moon"
                                style="display:none;"></i>
                        </button>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}"><i
                                class="fas fa-sign-out-alt me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <div class="mb-4"><small class="text-muted text-uppercase">Main Menu</small></div>
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a th:href="@{/lab/tests}" class="sidebar-link"><i class="fas fa-flask"></i> Lab Tests</a>
        <a th:href="@{/lab/patients}" class="sidebar-link"><i class="fas fa-user-injured"></i> Patients</a>
        <a th:href="@{/lab/orders}" class="sidebar-link active"><i class="fas fa-clipboard-list"></i> Lab Orders</a>
        <hr style="border-color: var(--border-color);"><a href="#" class="sidebar-link"><i class="fas fa-cog"></i>
            Settings</a>
    </div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Lab Orders</h1>
                <p class="text-muted mb-0">Track and manage laboratory orders</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" class="search-box" placeholder="Search orders...">
                <button class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#createOrderModal"><i
                        class="fas fa-plus me-1"></i> New Order</button>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active">All Orders</button>
            <button class="filter-tab">Ordered</button>
            <button class="filter-tab">Sample Collected</button>
            <button class="filter-tab">In Process</button>
            <button class="filter-tab">Verified</button>
        </div>

        <div class="table-wrapper">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Order #</th>
                        <th>Patient</th>
                        <th>Tests</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>ORD-7823</strong></td>
                        <td>John Doe</td>
                        <td>CBC, Lipid Profile</td>
                        <td><span class="badge badge-status badge-verified"><i
                                    class="fas fa-check me-1"></i>Verified</span></td>
                        <td>Dec 24, 2025</td>
                        <td><a href="#" class="btn-icon view" title="View Details"><i class="fas fa-eye"></i></a><a
                                href="#" class="btn-icon ai" title="Generate AI Summary"><i
                                    class="fas fa-brain"></i></a><a href="#" class="btn-icon pdf"
                                title="Download PDF"><i class="fas fa-file-pdf"></i></a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="createOrderModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Create New Lab Order</h5><button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3"><label class="form-label">Select Patient</label><select class="form-select">
                                <option>John Doe</option>
                                <option>Jane Smith</option>
                            </select></div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">Cancel</button><button type="button"
                        class="btn btn-primary-gradient">Create Order</button></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        // Local UI state management for theme icons
        document.addEventListener('themeChanged', (e) => {
            const theme = e.detail.theme;
            document.querySelectorAll('.theme-toggle').forEach(btn => {
                const sun = btn.querySelector('.icon-sun');
                const moon = btn.querySelector('.icon-moon');
                if (theme === 'dark') { sun.style.display = 'inline'; moon.style.display = 'none'; }
                else { sun.style.display = 'none'; moon.style.display = 'inline'; }
            });
        });
    </script>
</body>

</html>
