<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Tests - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .navbar-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            color: var(--text-muted) !important;
            font-weight: 500;
        }

        .nav-link:hover {
            color: var(--text-primary) !important;
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
            transition: all 0.3s;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-primary-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
        }

        .btn-primary-gradient:hover {
            opacity: 0.9;
            color: white;
        }

        .table-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.3s;
        }

        .table-custom {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .table-custom thead th {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem;
        }

        .table-custom tbody td {
            border-color: var(--border-light);
            padding: 1rem;
            vertical-align: middle;
        }

        .table-custom tbody tr:hover {
            background: var(--bg-tertiary);
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s;
            margin-right: 0.25rem;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-icon.edit:hover {
            color: var(--secondary-color);
        }

        .btn-icon.delete:hover {
            color: var(--danger);
        }

        .badge-category {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-weight: 500;
            font-size: 0.75rem;
            background: rgba(139, 92, 246, 0.2);
            color: #a78bfa;
        }

        .badge-active {
            background: var(--success-bg);
            color: var(--success);
        }

        .badge-inactive {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .search-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            width: 300px;
            transition: all 0.3s;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--input-bg-focus);
            color: var(--text-primary);
        }

        .search-box::placeholder {
            color: var(--text-muted);
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .modal-header,
        .modal-footer {
            border-color: var(--border-color);
        }

        .form-control,
        .form-select {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }

        .form-control:focus,
        .form-select:focus {
            background: var(--input-bg-focus);
            border-color: var(--primary-color);
            color: var(--text-primary);
            box-shadow: none;
        }

        .form-label {
            color: var(--text-primary);
        }

        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--primary-color);
        }

        @media (max-width: 992px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container-fluid px-4">
            <button class="btn btn-link me-3 d-lg-none" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <a class="navbar-brand" th:href="@{/}"><i class="fas fa-flask-vial me-2"></i>MedLab Pro</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span
                    class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-2">
                        <button class="theme-toggle" title="Toggle Theme">
                            <i class="fas fa-sun icon-sun"></i><i class="fas fa-moon icon-moon"
                                style="display:none;"></i>
                        </button>
                    </li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/logout}"><i
                                class="fas fa-sign-out-alt me-1"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="sidebar">
        <div class="mb-4"><small class="text-muted text-uppercase">Main Menu</small></div>
        <a th:href="@{/dashboard}" class="sidebar-link"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a th:href="@{/lab/tests}" class="sidebar-link active"><i class="fas fa-flask"></i> Lab Tests</a>
        <a th:href="@{/lab/patients}" class="sidebar-link"><i class="fas fa-user-injured"></i> Patients</a>
        <a th:href="@{/lab/orders}" class="sidebar-link"><i class="fas fa-clipboard-list"></i> Lab Orders</a>
        <hr style="border-color: var(--border-color);"><a href="#" class="sidebar-link"><i class="fas fa-cog"></i>
            Settings</a>
    </div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Lab Tests</h1>
                <p class="text-muted mb-0">Manage your laboratory test catalog</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" class="search-box" placeholder="Search tests...">
                <button class="btn btn-primary-gradient" data-bs-toggle="modal" data-bs-target="#testModal"><i
                        class="fas fa-plus me-1"></i> Add Test</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Test Name</th>
                        <th>Code</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="testsTableBody">
                    <tr th:each="test : ${tests}" th:id="'test-row-' + ${test.id}">
                        <td><strong th:text="${test.name}">Complete Blood Count (CBC)</strong></td>
                        <td th:text="${test.code}">CBC-001</td>
                        <td><span class="badge badge-category" th:text="${test.category}">Hematology</span></td>
                        <td th:text="'₹' + ${test.basePrice}">₹450</td>
                        <td>
                            <span class="badge" th:classappend="${test.active ? 'badge-active' : 'badge-inactive'}"
                                th:text="${test.active ? 'Active' : 'Inactive'}">Active</span>
                        </td>
                        <td>
                            <button class="btn-icon edit" title="Edit" th:onclick="'editTest(' + ${test.id} + ')'">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button class="btn-icon delete" title="Delete"
                                th:onclick="'deleteTest(' + ${test.id} + ')'">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(tests)}">
                        <td colspan="6" class="text-center text-muted">No lab tests found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Add/Edit Test Modal -->
    <div class="modal fade" id="testModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Lab Test</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="testForm">
                        <input type="hidden" id="testId">
                        <div class="mb-3">
                            <label class="form-label">Test Name</label>
                            <input type="text" id="testName" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Test Code</label>
                                <input type="text" id="testCode" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price (₹)</label>
                                <input type="number" id="testPrice" class="form-control" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select id="testCategory" class="form-select" required>
                                <option value="HEMATOLOGY">Hematology</option>
                                <option value="BIOCHEMISTRY">Biochemistry</option>
                                <option value="MICROBIOLOGY">Microbiology</option>
                                <option value="URINALYSIS">Urinalysis</option>
                                <option value="IMMUNOLOGY">Immunology</option>
                                <option value="PATHOLOGY">Pathology</option>
                                <option value="RADIOLOGY">Radiology</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="testDescription" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="testActive" checked>
                            <label class="form-check-label" for="testActive">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary-gradient" onclick="saveTest()">Save Test</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        const testModal = new bootstrap.Modal(document.getElementById('testModal'));
        const testForm = document.getElementById('testForm');

        function editTest(id) {
            document.getElementById('modalTitle').innerText = 'Edit Lab Test';
            fetch(`/api/lab/tests/${id}`)
                .then(response => response.json())
                .then(test => {
                    document.getElementById('testId').value = test.id;
                    document.getElementById('testName').value = test.name;
                    document.getElementById('testCode').value = test.code;
                    document.getElementById('testPrice').value = test.basePrice;
                    document.getElementById('testCategory').value = test.category;
                    document.getElementById('testDescription').value = test.description || '';
                    document.getElementById('testActive').checked = test.active;
                    testModal.show();
                });
        }

        function deleteTest(id) {
            if (confirm('Are you sure you want to delete this test?')) {
                fetch(`/api/lab/tests/${id}`, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        } else {
                            alert('Failed to delete test');
                        }
                    });
            }
        }

        function saveTest() {
            const id = document.getElementById('testId').value;
            const testData = {
                name: document.getElementById('testName').value,
                code: document.getElementById('testCode').value,
                basePrice: document.getElementById('testPrice').value,
                category: document.getElementById('testCategory').value,
                description: document.getElementById('testDescription').value,
                active: document.getElementById('testActive').checked
            };

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/lab/tests/${id}` : '/api/lab/tests';

            fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(testData)
            }).then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('Failed to save test');
                }
            });
        }

        // Reset modal on close
        document.getElementById('testModal').addEventListener('hidden.bs.modal', function () {
            testForm.reset();
            document.getElementById('testId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Lab Test';
        });

        document.addEventListener('themeChanged', (e) => {
            const theme = e.detail.theme;
            document.querySelectorAll('.theme-toggle').forEach(btn => {
                const sun = btn.querySelector('.icon-sun');
                const moon = btn.querySelector('.icon-moon');
                if (theme === 'dark') { sun.style.display = 'inline'; moon.style.display = 'none'; }
                else { sun.style.display = 'none'; moon.style.display = 'inline'; }
            });
        });
    </script>
</body>

</html>
