<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Inventory - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .inv-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.25rem;
            transition: all 0.3s ease;
        }

        .inv-card:hover {
            border-color: rgba(245, 158, 11, 0.4);
        }

        .stock-indicator {
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.05);
            margin-top: 10px;
        }

        .stock-fill {
            height: 100%;
            border-radius: 3px;
        }

        .status-adequate {
            color: #10b981;
        }

        .status-low {
            color: #f59e0b;
        }

        .status-critical {
            color: #ef4444;
        }

        .status-out_of_stock {
            color: #ef4444;
        }

        .status-expired {
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebars/lab_sidebar :: lab_sidebar('lab-inv')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #f59e0b;">
                        <i class="fas fa-boxes me-2"></i>Inventory Hub
                    </h1>
                    <p class="text-muted mb-0">Reagent Tracking & Stock Management System</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-warning px-4 rounded-pill" onclick="downloadReport()">
                        <i class="fas fa-file-download me-2"></i>Stock Report
                    </button>
                    <button class="btn btn-warning px-4 rounded-pill"
                        style="background: #f59e0b; color: #000; border: none;" data-bs-toggle="modal"
                        data-bs-target="#addItemModal">
                        <i class="fas fa-plus me-2"></i>Add Stock
                    </button>
                </div>
            </div>

            <!-- Stats -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="inv-card p-4">
                        <div class="text-muted small fw-bold text-uppercase mb-2">Total Items</div>
                        <div class="display-6 fw-bold text-white" id="totalItems">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="inv-card p-4">
                        <div class="text-muted small fw-bold text-uppercase mb-2">Low Stock</div>
                        <div class="display-6 fw-bold text-danger" id="lowStockCount">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="inv-card p-4">
                        <div class="text-muted small fw-bold text-uppercase mb-2">Expiring Soon</div>
                        <div class="display-6 fw-bold text-warning" id="expiringSoonCount">0</div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="inv-card p-4">
                        <div class="text-muted small fw-bold text-uppercase mb-2">Total Valuation</div>
                        <div class="display-6 fw-bold text-white" id="totalValuation">₹0</div>
                    </div>
                </div>
            </div>

            <!-- Inventory List -->
            <div class="inv-card overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                        <thead class="bg-light-subtle">
                            <tr class="text-muted small text-uppercase ls-1">
                                <th class="ps-4">Reagent / Item Name</th>
                                <th>Category</th>
                                <th>Batch No.</th>
                                <th>Stock Level</th>
                                <th>Expiry Date</th>
                                <th class="text-end pe-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTableBody">
                            <tr>
                                <td colspan="6" class="text-center py-5 text-muted">
                                    <div class="spinner-border spinner-border-sm me-2"></div>Loading inventory...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Add Item Modal -->
    <div class="modal fade" id="addItemModal" tabindex="-1">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content glass-card border-color-theme">
                <div class="modal-header border-color-theme">
                    <h5 class="modal-title fw-bold">Add Inventory Item</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addItemForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Item Name *</label>
                                <input type="text" id="itemName" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Manufacturer</label>
                                <input type="text" id="manufacturer" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Category *</label>
                                <select id="category" class="form-select" required>
                                    <option value="">Select...</option>
                                    <option value="Biochemistry">Biochemistry</option>
                                    <option value="Hematology">Hematology</option>
                                    <option value="Microbiology">Microbiology</option>
                                    <option value="Immunology">Immunology</option>
                                    <option value="Histopathology">Histopathology</option>
                                    <option value="General">General</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Batch Number</label>
                                <input type="text" id="batchNumber" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label small fw-bold">Expiry Date</label>
                                <input type="date" id="expiryDate" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Current Stock *</label>
                                <input type="number" id="currentStock" class="form-control" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Max Stock</label>
                                <input type="number" id="maxStock" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Reorder Level</label>
                                <input type="number" id="reorderLevel" class="form-control">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label small fw-bold">Unit Price (₹)</label>
                                <input type="number" step="0.01" id="unitPrice" class="form-control">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Unit</label>
                                <select id="unit" class="form-select">
                                    <option value="Units">Units</option>
                                    <option value="mL">mL</option>
                                    <option value="Kits">Kits</option>
                                    <option value="Tests">Tests</option>
                                    <option value="Bottles">Bottles</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-color-theme">
                    <button type="button" class="btn btn-link text-muted" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-warning rounded-pill px-4" onclick="addItem()">
                        <i class="fas fa-plus me-2"></i>Add Item
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadInventory);

        async function loadInventory() {
            try {
                const response = await fetch('/api/lab/inventory');
                const data = await response.json();

                document.getElementById('totalItems').textContent = data.totalItems || 0;
                document.getElementById('lowStockCount').textContent = data.lowStockCount || 0;
                document.getElementById('expiringSoonCount').textContent = data.expiringSoonCount || 0;

                const valuation = data.totalValuation || 0;
                document.getElementById('totalValuation').textContent = valuation >= 100000
                    ? '₹' + (valuation / 100000).toFixed(1) + 'L'
                    : '₹' + valuation.toLocaleString();

                renderTable(data.items || []);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('inventoryTableBody').innerHTML =
                    '<tr><td colspan="6" class="text-center py-5 text-danger">Error loading inventory</td></tr>';
            }
        }

        function renderTable(items) {
            const tbody = document.getElementById('inventoryTableBody');

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">
                    <i class="fas fa-box-open fa-3x mb-3 opacity-25"></i>
                    <p>No inventory items found. Click "Add Stock" to add items.</p>
                </td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(item => {
                const stockPercent = item.stockPercentage || 0;
                const stockColor = stockPercent > 50 ? 'bg-success' : (stockPercent > 25 ? 'bg-warning' : 'bg-danger');
                const statusClass = 'status-' + (item.stockStatus || 'adequate').toLowerCase();

                const expiryDate = item.expiryDate ? new Date(item.expiryDate) : null;
                const isExpiringSoon = expiryDate && expiryDate <= new Date(Date.now() + 30 * 24 * 60 * 60 * 1000);
                const expiryClass = isExpiringSoon ? 'text-danger' : 'text-white';

                return `
                    <tr class="border-bottom border-light">
                        <td class="ps-4">
                            <div class="fw-bold">${item.itemName}</div>
                            <div class="small text-muted">${item.manufacturer || 'Unknown'}</div>
                        </td>
                        <td>${item.category}</td>
                        <td class="text-white fw-bold">${item.batchNumber || '-'}</td>
                        <td style="width: 200px;">
                            <div class="d-flex justify-content-between mb-1 small text-white">
                                <span>${stockPercent}%</span>
                                <span class="${statusClass}">${item.currentStock} / ${item.maxStock || '∞'} ${item.unit || 'Units'}</span>
                            </div>
                            <div class="stock-indicator">
                                <div class="stock-fill ${stockColor}" style="width: ${stockPercent}%;"></div>
                            </div>
                        </td>
                        <td><span class="${expiryClass}">${expiryDate ? expiryDate.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'}</span></td>
                        <td class="text-end pe-4">
                            <button class="btn btn-link btn-sm text-warning p-0" onclick="editItem(${item.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function addItem() {
            const data = {
                itemName: document.getElementById('itemName').value,
                manufacturer: document.getElementById('manufacturer').value,
                category: document.getElementById('category').value,
                batchNumber: document.getElementById('batchNumber').value,
                expiryDate: document.getElementById('expiryDate').value || null,
                currentStock: document.getElementById('currentStock').value,
                maxStock: document.getElementById('maxStock').value || null,
                reorderLevel: document.getElementById('reorderLevel').value || null,
                unitPrice: document.getElementById('unitPrice').value || null,
                unit: document.getElementById('unit').value
            };

            if (!data.itemName || !data.category || !data.currentStock) {
                alert('Please fill required fields');
                return;
            }

            try {
                const response = await fetch('/api/lab/inventory', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addItemModal')).hide();
                    document.getElementById('addItemForm').reset();
                    loadInventory();
                } else {
                    alert('Error adding item');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error adding item');
            }
        }

        function editItem(id) {
            alert('Edit functionality coming soon for item ID: ' + id);
        }

        function downloadReport() {
            alert('Report download feature coming soon');
        }
    </script>
</body>

</html>
