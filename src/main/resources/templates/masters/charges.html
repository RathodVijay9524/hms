<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Charge Master - Hospital Management System</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/theme.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --success-color: #4cc9f0;
            --info-color: #4895ef;
            --warning-color: #f72585;
            --card-border-radius: 12px;
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
        }

        [data-theme="dark"] body {
            background-color: #0f172a;
            color: #f1f5f9;
        }

        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #ffffff;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000;
            transition: all var(--transition-speed);
        }

        [data-theme="dark"] .sidebar {
            background: #1e293b;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
            transition: all var(--transition-speed);
        }

        .card {
            border: none;
            border-radius: var(--card-border-radius);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s;
            background: #ffffff;
        }

        [data-theme="dark"] .card {
            background: #1e293b;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 0.6rem 1.2rem;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
        }

        .table-container {
            background: #fff;
            border-radius: var(--card-border-radius);
            overflow: hidden;
        }

        [data-theme="dark"] .table-container {
            background: #1e293b;
        }

        .charge-category-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }
    </style>
</head>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<!-- Sidebar -->
<div th:replace="~{fragments/sidebars/owner_sidebar :: owner_sidebar('charges')}"></div>

<!-- Main Content -->
<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Charge Master</h2>
            <p class="text-muted">Manage hospital service prices and taxes</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#chargeModal">
                <i class="fas fa-plus me-2"></i> New Charge
            </button>
        </div>
    </div>

    <!-- Stats Overview -->
    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small">Total Services</div>
                <div class="fs-3 fw-bold" id="totalServices">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small">Consultations</div>
                <div class="fs-3 fw-bold text-primary" id="consultationCount">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small">Lab Tests</div>
                <div class="fs-3 fw-bold text-success" id="labTestCount">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 text-center">
                <div class="text-muted small">Active Charges</div>
                <div class="fs-3 fw-bold text-info" id="activeCount">0</div>
            </div>
        </div>
    </div>

    <!-- Search & Filter -->
    <div class="card mb-4">
        <div class="card-body p-3">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0">
                            <i class="fas fa-search text-muted"></i>
                        </span>
                        <input type="text" id="searchInput" class="form-control border-start-0"
                            placeholder="Search charges by name or category...">
                    </div>
                </div>
                <div class="col-md-3">
                    <select id="categoryFilter" class="form-select">
                        <option value="">All Categories</option>
                        <option value="CONSULTATION">Consultation</option>
                        <option value="LAB_TEST">Lab Test</option>
                        <option value="PROCEDURE">Procedure</option>
                        <option value="REGISTRATION">Registration</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Charge Name</th>
                        <th>Category</th>
                        <th>Base Amount</th>
                        <th>Tax (%)</th>
                        <th>Total Price</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="chargeTableBody">
                    <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
        <div id="noCharges" class="text-center py-5 d-none">
            <i class="fas fa-box-open fs-1 text-muted mb-3"></i>
            <p class="text-muted">No charges found. Start by adding a new service price.</p>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="chargeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">Add New Charge Item</h5>
                <button type="button" class="btn-close" data-bs-toggle="modal" data-bs-target="#chargeModal"></button>
            </div>
            <div class="modal-body">
                <form id="chargeForm">
                    <input type="hidden" id="chargeId">
                    <div class="mb-3">
                        <label class="form-label">Service Name</label>
                        <input type="text" class="form-control" id="chargeName" required
                            placeholder="e.g., General Consultation">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="chargeCategory" required>
                                <option value="CONSULTATION">Consultation</option>
                                <option value="LAB_TEST">Lab Test</option>
                                <option value="PROCEDURE">Procedure</option>
                                <option value="REGISTRATION">Registration</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Status</label>
                            <div class="form-check form-switch mt-2">
                                <input class="form-check-input" type="checkbox" id="chargeActive" checked>
                                <label class="form-check-label">Active</label>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Base Amount (₹)</label>
                            <input type="number" step="0.01" class="form-control" id="baseAmount" required
                                placeholder="0.00">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tax (%)</label>
                            <input type="number" step="0.1" class="form-control" id="taxPercent" required value="0">
                        </div>
                    </div>
                    <div class="bg-light p-3 rounded mb-3">
                        <div class="d-flex justify-content-between mb-1">
                            <span class="text-muted small">Estimated Total:</span>
                            <span class="fw-bold" id="estimatedTotal">₹0.00</span>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light" data-bs-toggle="modal"
                    data-bs-target="#chargeModal">Cancel</button>
                <button type="button" class="btn btn-primary" id="saveChargeBtn">Save Charge</button>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/theme.js"></script>
<script>
    let charges = [];
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));

    if (user) document.getElementById('userName').textContent = user.name;

    // Load charges
    async function loadCharges() {
        try {
            const res = await fetch('/api/billing/charges', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const response = await res.json();
            charges = response.data;
            renderCharges();
            updateStats();
        } catch (err) {
            console.error('Failed to load charges:', err);
        }
    }

    function renderCharges() {
        const tbody = document.getElementById('chargeTableBody');
        const search = document.getElementById('searchInput').value.toLowerCase();
        const category = document.getElementById('categoryFilter').value;

        const filtered = charges.filter(c =>
            (c.name.toLowerCase().includes(search) || c.category.toLowerCase().includes(search)) &&
            (!category || c.category === category)
        );

        if (filtered.length === 0) {
            document.getElementById('noCharges').classList.remove('d-none');
            tbody.innerHTML = '';
            return;
        }

        document.getElementById('noCharges').classList.add('d-none');
        tbody.innerHTML = filtered.map(c => {
            const total = c.baseAmount + (c.baseAmount * c.taxPercent / 100);
            return `
                    <tr>
                        <td class="ps-4 fw-medium">${c.name}</td>
                        <td><span class="charge-category-badge border ${getCategoryClass(c.category)}">${c.category}</span></td>
                        <td>₹${c.baseAmount.toFixed(2)}</td>
                        <td>${c.taxPercent}%</td>
                        <td class="fw-bold">₹${total.toFixed(2)}</td>
                        <td>
                            <span class="badge ${c.active ? 'bg-success' : 'bg-secondary'} rounded-pill">
                                ${c.active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td class="text-end pe-4">
                            <button class="btn btn-sm btn-outline-primary me-1" onclick="editCharge(${c.id})">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteCharge(${c.id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
        }).join('');
    }

    function getCategoryClass(cat) {
        switch (cat) {
            case 'CONSULTATION': return 'text-primary border-primary';
            case 'LAB_TEST': return 'text-success border-success';
            case 'PROCEDURE': return 'text-warning border-warning';
            default: return 'text-secondary border-secondary';
        }
    }

    function updateStats() {
        document.getElementById('totalServices').textContent = charges.length;
        document.getElementById('consultationCount').textContent = charges.filter(c => c.category === 'CONSULTATION').length;
        document.getElementById('labTestCount').textContent = charges.filter(c => c.category === 'LAB_TEST').length;
        document.getElementById('activeCount').textContent = charges.filter(c => c.active).length;
    }

    // Add/Update logic
    document.getElementById('saveChargeBtn').onclick = async () => {
        const id = document.getElementById('chargeId').value;
        const data = {
            name: document.getElementById('chargeName').value,
            category: document.getElementById('chargeCategory').value,
            baseAmount: parseFloat(document.getElementById('baseAmount').value),
            taxPercent: parseFloat(document.getElementById('taxPercent').value),
            active: document.getElementById('chargeActive').checked
        };

        const url = id ? `/api/billing/charges/${id}` : '/api/billing/charges';
        const method = id ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                bootstrap.Modal.getInstance(document.getElementById('chargeModal')).hide();
                document.getElementById('chargeForm').reset();
                loadCharges();
            }
        } catch (err) {
            alert('Failed to save charge');
        }
    };

    function editCharge(id) {
        const c = charges.find(x => x.id === id);
        document.getElementById('chargeId').value = c.id;
        document.getElementById('chargeName').value = c.name;
        document.getElementById('chargeCategory').value = c.category;
        document.getElementById('baseAmount').value = c.baseAmount;
        document.getElementById('taxPercent').value = c.taxPercent;
        document.getElementById('chargeActive').checked = c.active;

        document.getElementById('modalTitle').textContent = 'Edit Charge Item';
        updateEstimatedTotal();
        new bootstrap.Modal(document.getElementById('chargeModal')).show();
    }

    async function deleteCharge(id) {
        if (!confirm('Are you sure you want to delete this charge?')) return;
        try {
            const res = await fetch(`/api/billing/charges/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) loadCharges();
        } catch (err) {
            alert('Delete failed');
        }
    }

    function updateEstimatedTotal() {
        const base = parseFloat(document.getElementById('baseAmount').value) || 0;
        const tax = parseFloat(document.getElementById('taxPercent').value) || 0;
        const total = base + (base * tax / 100);
        document.getElementById('estimatedTotal').textContent = `₹${total.toFixed(2)}`;
    }

    ['baseAmount', 'taxPercent'].forEach(id => {
        document.getElementById(id).addEventListener('input', updateEstimatedTotal);
    });

    document.getElementById('searchInput').oninput = renderCharges;
    document.getElementById('categoryFilter').onchange = renderCharges;

    loadCharges();
</script>
</body>

</html>
