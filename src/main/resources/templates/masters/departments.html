<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Departments - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s;
        }

        .navbar-custom {
            background: var(--navbar-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            background: var(--gradient-primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar {
            background: var(--bg-secondary);
            min-height: calc(100vh - 56px);
            border-right: 1px solid var(--border-color);
            padding: 1.5rem 1rem;
            position: fixed;
            width: 250px;
            top: 56px;
        }

        .sidebar-link {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 0.5rem;
            margin-bottom: 0.25rem;
            transition: all 0.3s;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
        }

        .sidebar-link i {
            width: 24px;
            margin-right: 12px;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-primary-gradient {
            background: var(--gradient-primary);
            border: none;
            color: white;
            font-weight: 600;
            padding: 0.6rem 1.25rem;
            border-radius: 0.5rem;
        }

        .table-wrapper {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            overflow: hidden;
        }

        .table-custom {
            margin-bottom: 0;
            color: var(--text-primary);
        }

        .table-custom thead th {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem;
        }

        .table-custom tbody td {
            border-color: var(--border-light);
            padding: 1rem;
            vertical-align: middle;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-muted);
            transition: all 0.3s;
            margin-right: 0.25rem;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .search-box {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            width: 300px;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
        }

        .form-control {
            background: var(--input-bg);
            border-color: var(--border-color);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div th:replace="~{fragments/sidebars/owner_sidebar :: owner_sidebar('owner-depts')}"></div>

    <div class="main-content">
        <div class="page-header">
            <div>
                <h1 class="page-title">Departments</h1>
                <p class="text-muted mb-0">Manage hospital departments</p>
            </div>
            <div class="d-flex gap-2">
                <input type="text" class="search-box" placeholder="Search departments...">
                <button class="btn btn-primary-gradient" onclick="openModal()"><i class="fas fa-plus me-1"></i> Add
                    Department</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Department Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="deptTableBody">
                    <tr th:each="dept : ${departments}">
                        <td><strong th:text="${dept.name}">Cardiology</strong></td>
                        <td th:text="${dept.description}">Heart and blood vessel specialist</td>
                        <td>
                            <button class="btn-icon edit" th:onclick="'editDept(' + ${dept.id} + ')'"><i
                                    class="fas fa-pen"></i></button>
                            <button class="btn-icon delete" th:onclick="'deleteDept(' + ${dept.id} + ')'"><i
                                    class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="deptModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add Department</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="deptForm">
                        <input type="hidden" id="deptId">
                        <div class="mb-3">
                            <label class="form-label">Department Name</label>
                            <input type="text" id="deptName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea id="deptDescription" class="form-control" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary-gradient" onclick="saveDept()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('deptModal'));

        function openModal() {
            document.getElementById('deptForm').reset();
            document.getElementById('deptId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Department';
            modal.show();
        }

        function editDept(id) {
            fetch(`/api/masters/departments/${id}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('deptId').value = d.id;
                    document.getElementById('deptName').value = d.name;
                    document.getElementById('deptDescription').value = d.description || '';
                    document.getElementById('modalTitle').innerText = 'Edit Department';
                    modal.show();
                });
        }

        function saveDept() {
            const id = document.getElementById('deptId').value;
            const data = {
                name: document.getElementById('deptName').value,
                description: document.getElementById('deptDescription').value
            };
            fetch(id ? `/api/masters/departments/${id}` : '/api/masters/departments', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => location.reload());
        }

        function deleteDept(id) {
            if (confirm('Delete department?')) {
                fetch(`/api/masters/departments/${id}`, { method: 'DELETE' }).then(() => location.reload());
            }
        }
    </script>
</body>

</html>
