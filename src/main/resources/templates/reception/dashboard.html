<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reception Desk - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            margin-top: 56px;
        }

        .action-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            height: 100%;
            transition: all 0.3s;
        }

        .action-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary-color);
        }

        .icon-box {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.1);
            color: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
        }

        @media (max-width: 992px) {
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar('rec-dash')}"></div>

    <div class="main-content">
        <h1 style="font-family: 'Outfit'; font-weight: 700;" class="mb-4">Reception Desk</h1>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="action-card">
                    <div class="icon-box"><i class="fas fa-user-plus"></i></div>
                    <h4>Patient Registration</h4>
                    <p class="text-muted">Register new patients and generate hospital UHIDs.</p>
                    <a th:href="@{/lab/patients}" class="btn btn-primary-gradient w-100 mt-3">Go to Patients</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="action-card">
                    <div class="icon-box" style="background: rgba(59, 130, 246, 0.1); color: #3b82f6;"><i
                            class="fas fa-calendar-check"></i></div>
                    <h4>Booking Desk</h4>
                    <p class="text-muted">Book new appointments and check doctor availability.</p>
                    <a th:href="@{/lab/appointments}" class="btn btn-outline-primary w-100 mt-3">Book Appointment</a>
                </div>
            </div>
            <div class="col-md-4">
                <div class="action-card">
                    <div class="icon-box" style="background: rgba(139, 92, 246, 0.1); color: #8b5cf6;"><i
                            class="fas fa-list-ol"></i></div>
                    <h4>OPD Queue</h4>
                    <p class="text-muted">Monitor today's patient queue and check-in statuses.</p>
                    <a th:href="@{/admin/appointment-dashboard}" class="btn btn-outline-primary w-100 mt-3">View
                        Queue</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
