<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
    <style>
        .register-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3rem;
            position: relative;
        }

        .step-indicator::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--border-color);
            z-index: 1;
        }

        .step-dot {
            width: 42px;
            height: 42px;
            background: var(--bg-primary);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            font-weight: 700;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .step-dot.active {
            border-color: #a855f7;
            color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .step-dot.completed {
            background: #a855f7;
            border-color: #a855f7;
            color: white;
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .form-control,
        .form-select {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: white;
        }

        .form-control:focus,
        .form-select:focus {
            background: var(--bg-primary);
            border-color: #a855f7;
            color: white;
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
        }

        .section-title {
            font-family: 'Outfit';
            font-weight: 600;
            color: #a855f7;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebars/reception_sidebar :: reception_sidebar('register')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #a855f7;">New Patient Registration
                    </h1>
                    <p class="text-muted mb-0">Onboard a new patient into the hospital management system</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary rounded-pill px-4">Save Draft</button>
                    <button class="btn text-white fw-bold px-4 rounded-pill" style="background: #a855f7;">
                        <i class="fas fa-id-card me-2"></i>Generate UHID
                    </button>
                </div>
            </div>

            <!-- Registration Form -->
            <div class="register-card mx-auto" style="max-width: 900px;">
                <!-- Step Indicator -->
                <div class="step-indicator">
                    <div class="step-dot active">1</div>
                    <div class="step-dot">2</div>
                    <div class="step-dot">3</div>
                    <div class="step-dot">4</div>
                </div>

                <form>
                    <!-- Section 1: Demographics -->
                    <div class="section-title">
                        <i class="fas fa-user-circle"></i>
                        <span>Demographic Information</span>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-2">
                            <label class="form-label">Title</label>
                            <select class="form-select" id="regTitle">
                                <option value="Mr.">Mr.</option>
                                <option value="Ms.">Ms.</option>
                                <option value="Mrs.">Mrs.</option>
                                <option value="Dr.">Dr.</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" id="regFirstName" placeholder="e.g. Tony">
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="regLastName" placeholder="e.g. Stark">
                        </div>
                    </div>

                    <div class="row g-4 mb-5">
                        <div class="col-md-4">
                            <label class="form-label">Date of Birth</label>
                            <input type="date" class="form-control" id="regDob">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Gender</label>
                            <select class="form-select" id="regGender">
                                <option value="MALE">Male</option>
                                <option value="FEMALE">Female</option>
                                <option value="OTHER">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Blood Group</label>
                            <select class="form-select" id="regBloodGroup">
                                <option value="A+">A+</option>
                                <option value="B+">B+</option>
                                <option value="O+">O+</option>
                                <option value="AB+">AB+</option>
                                <option value="A-">A-</option>
                                <option value="B-">B-</option>
                                <option value="O-">O-</option>
                                <option value="AB-">AB-</option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Contact Details -->
                    <div class="section-title">
                        <i class="fas fa-phone-alt"></i>
                        <span>Contact Details</span>
                    </div>

                    <div class="row g-4 mb-5">
                        <div class="col-md-6">
                            <label class="form-label">Primary Mobile</label>
                            <div class="input-group">
                                <span class="input-group-text bg-primary border-0 text-white">+91</span>
                                <input type="text" class="form-control" id="regPhone" placeholder="9876543210">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="tony@stark.com">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">Residential Address</label>
                            <textarea class="form-control" id="regAddress" rows="2"
                                placeholder="Street, Building, Apartment..."></textarea>
                        </div>
                    </div>

                    <div
                        class="d-flex justify-content-between align-items-center pt-4 border-top border-secondary-subtle">
                        <span class="text-muted small">Fields marked with * are mandatory</span>
                        <div class="d-flex gap-2">
                            <button type="button" onclick="location.href='/reception/patients'"
                                class="btn btn-link text-muted text-decoration-none px-4">Cancel</button>
                            <button type="button" id="submitBtn" onclick="registerPatient()"
                                class="btn text-white fw-bold px-5 rounded-pill" style="background: #a855f7;">Register
                                Patient</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        async function registerPatient() {
            const btn = document.getElementById('submitBtn');
            const firstName = document.getElementById('regFirstName').value;
            const lastName = document.getElementById('regLastName').value;

            if (!firstName || !lastName || !document.getElementById('regPhone').value) {
                alert('Please fill First Name, Last Name and Phone Number');
                return;
            }

            const data = {
                title: document.getElementById('regTitle').value,
                name: firstName + ' ' + lastName,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value,
                gender: document.getElementById('regGender').value,
                bloodGroup: document.getElementById('regBloodGroup').value,
                dateOfBirth: document.getElementById('regDob').value,
                address: document.getElementById('regAddress').value
            };

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Registering...';

            try {
                // Using the specific lab patient creation URI for now as it's the main one
                const response = await fetch('/api/lab/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    const saved = await response.json();
                    alert('Patient registered successfully! UHID: ' + saved.uhid);
                    window.location.href = '/reception/patients';
                } else {
                    const error = await response.text();
                    alert('Error: ' + error);
                    btn.disabled = false;
                    btn.innerHTML = 'Register Patient';
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Connection error. Please try again.');
                btn.disabled = false;
                btn.innerHTML = 'Register Patient';
            }
        }
    </script>
</body>

</html>
