<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar (Independent Patient Sidebar) -->
    <div th:replace="~{fragments/sidebars/patient_sidebar :: patient_sidebar('patient-reg')}"></div>

    <main class="main-content">
        <!-- NEW PATIENT MODULE VERSION 2.0 -->
        <div class="container py-4">
            <!-- Page Header -->
            <div class="mb-5 text-center">
                <h3 class="fw-bold" style="font-family: 'Outfit';">New Patient Registration</h3>
                <p class="text-muted">Fill in the primary details to create a new patient profile</p>
            </div>

            <div class="row justify-content-center">
                <div class="col-lg-10">
                    <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                        <div class="card-body p-5">
                            <form id="patientRegistrationForm">
                                <!-- Personal Information -->
                                <h6 class="text-primary text-uppercase fw-bold mb-4"
                                    style="letter-spacing: 0.1em; font-size: 0.8rem;">
                                    Personal Information
                                </h6>
                                <div class="row g-4 mb-5">
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Full Name <span
                                                class="text-danger">*</span></label>
                                        <input type="text" id="patientName" class="form-control form-control-lg"
                                            placeholder="e.g. John Doe" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label small fw-bold">Contact Number <span
                                                class="text-danger">*</span></label>
                                        <input type="tel" id="patientPhone" class="form-control form-control-lg"
                                            placeholder="e.g. +91 9876543210" required>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold">Date of Birth</label>
                                        <input type="date" id="patientDob" class="form-control form-control-lg">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold">Gender <span
                                                class="text-danger">*</span></label>
                                        <select id="patientGender" class="form-select form-select-lg" required>
                                            <option value="">Select Gender</option>
                                            <option value="MALE">Male</option>
                                            <option value="FEMALE">Female</option>
                                            <option value="OTHER">Other</option>
                                        </select>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold">Email Address</label>
                                        <input type="email" id="patientEmail" class="form-control form-control-lg"
                                            placeholder="e.g. john@example.com">
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label small fw-bold">Residential Address</label>
                                        <textarea id="patientAddress" class="form-control" rows="2"
                                            placeholder="Street, City, State, Zip Code"></textarea>
                                    </div>
                                </div>

                                <!-- Emergency Contact -->
                                <h6 class="text-primary text-uppercase fw-bold mb-4"
                                    style="letter-spacing: 0.1em; font-size: 0.8rem;">
                                    Emergency Contact
                                </h6>
                                <div class="row g-4">
                                    <div class="col-md-5">
                                        <label class="form-label small fw-bold">Contact Name</label>
                                        <input type="text" id="emergencyName" class="form-control"
                                            placeholder="Relative or Friend Name">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label small fw-bold">Relationship</label>
                                        <input type="text" id="emergencyRel" class="form-control"
                                            placeholder="e.g. Spouse">
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label small fw-bold">Emergency Phone</label>
                                        <input type="tel" id="emergencyPhone" class="form-control"
                                            placeholder="Contact number">
                                    </div>
                                </div>

                                <div class="mt-5 pt-4 border-top border-light d-flex justify-content-end gap-2">
                                    <button type="reset" class="btn btn-outline-secondary px-4">Clear Form</button>
                                    <button type="submit" class="btn btn-primary px-5 btn-lg">Complete
                                        Registration</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        document.getElementById('patientRegistrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const patientData = {
                name: document.getElementById('patientName').value,
                phone: document.getElementById('patientPhone').value,
                email: document.getElementById('patientEmail').value,
                gender: document.getElementById('patientGender').value,
                dateOfBirth: document.getElementById('patientDob').value,
                address: document.getElementById('patientAddress').value,
                emergencyContactName: document.getElementById('emergencyName').value,
                emergencyContactRelationship: document.getElementById('emergencyRel').value,
                emergencyContactPhone: document.getElementById('emergencyPhone').value
            };

            try {
                const response = await fetch('/api/lab/patients', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patientData)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert(`Patient Registered Successfully!\nUHID: ${result.uhid}`);
                    window.location.href = '/patient/list';
                } else {
                    const error = await response.text();
                    alert('Error: ' + error);
                }
            } catch (err) {
                console.error(err);
                alert('An unexpected error occurred.');
            }
        });
    </script>
</body>

</html>
