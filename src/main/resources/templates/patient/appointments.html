<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar (Independent Patient Sidebar) -->
    <div th:replace="~{fragments/sidebars/patient_sidebar :: patient_sidebar('patient-app')}"></div>

    <main class="main-content">
        <!-- NEW PATIENT MODULE VERSION 2.0 -->
        <div class="container-fluid">
            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h5 class="mb-1 fw-bold" style="font-family: 'Outfit';">Clinic Appointments</h5>
                    <p class="text-muted mb-0">Manage and schedule doctor visits</p>
                </div>
                <button class="btn btn-emerald">
                    <i class="fas fa-plus me-2"></i>New Appointment
                </button>
            </div>

            <!-- Calendar / List Toggle -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                        <div class="card-body p-5 text-center">
                            <i class="fas fa-calendar-alt fs-1 text-muted mb-3"></i>
                            <h4>Appointment Scheduler Integration</h4>
                            <p class="text-muted">Linking with the central hospital calendar system...</p>
                            <div class="spinner-border text-primary mt-3" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
