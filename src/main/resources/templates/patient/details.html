<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient EMR - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Sidebar (Independent Patient Sidebar) -->
    <div th:replace="~{fragments/sidebars/patient_sidebar :: patient_sidebar('patient-list')}"></div>

    <main class="main-content">
        <!-- NEW PATIENT MODULE VERSION 2.0 -->
        <div class="container-fluid">
            <!-- Quick Navigation Back -->
            <a th:href="@{/patient/list}" class="btn btn-link text-decoration-none p-0 mb-4 fw-bold">
                <i class="fas fa-arrow-left me-2"></i>Back to Directory
            </a>

            <!-- Patient Profile Header -->
            <div class="card border-0 shadow-sm mb-4" style="background: var(--bg-secondary);">
                <div class="card-body p-4">
                    <div class="row align-items-center">
                        <div class="col-auto">
                            <div class="rounded-circle bg-primary/10 text-primary p-3 d-flex align-items-center justify-content-center"
                                style="width: 80px; height: 80px; font-size: 2rem;">
                                <i class="fas fa-user"></i>
                            </div>
                        </div>
                        <div class="col">
                            <h3 class="fw-bold mb-1" th:text="${patient.name}">John Doe</h3>
                            <div class="d-flex gap-3 text-muted">
                                <span><i class="fas fa-id-card me-1"></i> <strong
                                        th:text="${patient.uhid}">UHID-001</strong></span>
                                <span><i class="fas fa-venus-mars me-1"></i> <span
                                        th:text="${patient.gender}">Male</span></span>
                                <span><i class="fas fa-phone me-1"></i> <span th:text="${patient.phone}">+91
                                        9876543210</span></span>
                            </div>
                        </div>
                        <div class="col-auto text-end">
                            <button class="btn btn-outline-primary me-2"><i class="fas fa-edit me-2"></i>Edit
                                Profile</button>
                            <button class="btn btn-primary"><i class="fas fa-print me-2"></i>Record Summary</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-4">
                <!-- Vitals & Quick Stats -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm mb-4" style="background: var(--bg-secondary);">
                        <div class="card-header bg-transparent border-bottom border-light p-3">
                            <h6 class="mb-0 fw-bold"><i class="fas fa-heartbeat text-danger me-2"></i>Current Vitals
                            </h6>
                        </div>
                        <div class="card-body">
                            <ul class="list-group list-group-flush bg-transparent">
                                <li
                                    class="list-group-item bg-transparent border-light d-flex justify-content-between px-0">
                                    <span class="text-muted">Blood Pressure</span>
                                    <span class="fw-bold">120/80 mmHg</span>
                                </li>
                                <li
                                    class="list-group-item bg-transparent border-light d-flex justify-content-between px-0">
                                    <span class="text-muted">SpO2</span>
                                    <span class="fw-bold text-success">98%</span>
                                </li>
                                <li
                                    class="list-group-item bg-transparent border-light d-flex justify-content-between px-0">
                                    <span class="text-muted">Heart Rate</span>
                                    <span class="fw-bold">72 bpm</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                        <div class="card-header bg-transparent border-bottom border-light p-3">
                            <h6 class="mb-0 fw-bold"><i class="fas fa-info-circle text-info me-2"></i>Medical Alerts
                            </h6>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-warning-subtle text-warning border-0 small mb-0">
                                No known allergies recorded.
                            </div>
                        </div>
                    </div>
                </div>

                <!-- History & Records -->
                <div class="col-lg-8">
                    <ul class="nav nav-pills mb-4" id="pills-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="pills-visits-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-visits" type="button" role="tab">Doctor Visits</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pills-lab-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-lab" type="button" role="tab">Laboratory Reports</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="pills-presc-tab" data-bs-toggle="pill"
                                data-bs-target="#pills-presc" type="button" role="tab">Prescriptions</button>
                        </li>
                    </ul>
                    <div class="tab-content" id="pills-tabContent">
                        <div class="tab-pane fade show active" id="pills-visits" role="tabpanel">
                            <div class="text-center py-5">
                                <p class="text-muted">No clinical visits recorded yet.</p>
                                <button class="btn btn-sm btn-outline-primary">Record First Visit</button>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="pills-lab" role="tabpanel">
                            <div class="text-center py-5">
                                <p class="text-muted">No lab orders found for this patient.</p>
                            </div>
                        </div>
                        <div class="tab-pane fade" id="pills-presc" role="tabpanel">
                            <div class="text-center py-5">
                                <p class="text-muted">No active prescriptions.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
</body>

</html>
