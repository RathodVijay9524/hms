<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - MedLab Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">
    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body class="d-flex align-items-center justify-content-center vh-100 bg-primary">
    <div class="text-center p-5 rounded-4 bg-secondary shadow-lg"
        style="max-width: 500px; border: 1px solid var(--border-color);">
        <div class="mb-4">
            <i class="fas fa-exclamation-triangle display-1 text-warning shadow-sm"></i>
        </div>
        <h1 class="fw-bold mb-3" style="font-family: 'Outfit';">Something Went Wrong</h1>
        <p class="text-muted mb-4">We couldn't find the page you were looking for or an unexpected error occurred.</p>

        <div class="alert alert-dark bg-dark bg-opacity-50 border-light small text-start mb-4">
            <strong>Status:</strong> <span th:text="${status ?: '404'}">404</span><br>
            <strong>Error:</strong> <span th:text="${error ?: 'Not Found'}">Not Found</span>
        </div>

        <div class="d-grid gap-2">
            <a href="/select-role" class="btn btn-emerald rounded-pill py-2 fw-bold">Return to Dashboard</a>
            <a href="javascript:history.back()" class="btn btn-outline-light rounded-pill py-2">Go Back</a>
        </div>
    </div>

    <script th:src="@{/js/theme.js}"></script>
    <style>
        .btn-emerald {
            background-color: #10b981;
            border: none;
            color: white;
        }

        .btn-emerald:hover {
            background-color: #059669;
            color: white;
        }
    </style>
</body>

</html>
