<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctors - Owner Portal - MedLab Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link th:href="@{/css/theme.css}" rel="stylesheet">

    <script>
        (function () {
            const savedTheme = localStorage.getItem('medlab-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>

<body>
    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <!-- Owner Sidebar -->
    <div th:replace="~{fragments/sidebars/owner_sidebar :: owner_sidebar('owner-doctors')}"></div>

    <main class="main-content">
        <div class="container-fluid">
            <!-- Executive Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-4">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/owner/dashboard}"
                            class="text-warning text-decoration-none">Executive Dashboard</a></li>
                    <li class="breadcrumb-item active text-muted">Physician Roster</li>
                </ol>
            </nav>

            <!-- Page Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1" style="font-family: 'Outfit'; color: #f59e0b;">Physician Roster</h2>
                    <p class="text-muted mb-0">Manage doctor credentials and department assignments</p>
                </div>
                <button class="btn btn-warning fw-bold text-dark px-4" onclick="openModal()">
                    <i class="fas fa-user-md me-2"></i>Add/Link Doctor
                </button>
            </div>

            <!-- Doctors Table -->
            <div class="card border-0 shadow-sm" style="background: var(--bg-secondary);">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead style="background: var(--bg-tertiary);">
                                <tr>
                                    <th class="ps-4 py-3">Doctor Name</th>
                                    <th class="py-3">Department</th>
                                    <th class="py-3">Specialization</th>
                                    <th class="py-3">Reg. Number</th>
                                    <th class="py-3">Status</th>
                                    <th class="py-3 pe-4 text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="doc : ${doctors}">
                                    <td class="ps-4 py-3">
                                        <div class="d-flex align-items-center">
                                            <div class="rounded-circle p-2 me-3"
                                                style="background: rgba(245, 158, 11, 0.1); width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
                                                <i class="fas fa-user-md text-warning"></i>
                                            </div>
                                            <strong th:text="${doc.doctorName}">Dr. Vijay Rathod</strong>
                                        </div>
                                    </td>
                                    <td class="py-3" th:text="${doc.departmentName}">Cardiology</td>
                                    <td class="py-3 text-muted" th:text="${doc.specialization}">MD Cardiology</td>
                                    <td class="py-3"><span class="badge bg-light text-dark font-monospace"
                                            th:text="${doc.registrationNumber}">REG12345</span></td>
                                    <td class="py-3">
                                        <span class="badge" th:classappend="${doc.status ? 'bg-success' : 'bg-danger'}"
                                            th:text="${doc.status ? 'Active' : 'Inactive'}">Active</span>
                                    </td>
                                    <td class="py-3 pe-4 text-end">
                                        <button class="btn btn-sm btn-outline-warning"
                                            th:onclick="'editDoctor(' + ${doc.userId} + ')'">
                                            <i class="fas fa-pen"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal fade" id="doctorModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="docModalTitle">Doctor Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="docForm">
                        <div class="mb-3">
                            <label class="form-label">Select User (Doctor Account)</label>
                            <select id="docUserId" class="form-select" required>
                                <option value="">Loading users...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Department</label>
                            <select id="docDeptId" class="form-select" required>
                                <option th:each="dept : ${departments}" th:value="${dept.id}" th:text="${dept.name}">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Specialization</label>
                            <input type="text" id="docSpecialization" class="form-control"
                                placeholder="e.g. MBBS, MD (Cardio)">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Registration Number</label>
                            <input type="text" id="docReg" class="form-control">
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="docStatus" checked>
                            <label class="form-check-label">Active</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-warning fw-bold text-dark" onclick="saveDoctor()">Save
                        Profile</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/theme.js}"></script>
    <script>
        const docModal = new bootstrap.Modal(document.getElementById('doctorModal'));

        function openModal() {
            loadUsers();
            document.getElementById('docForm').reset();
            docModal.show();
        }

        function loadUsers() {
            fetch('/api/users/role/ROLE_DOCTOR')
                .then(r => r.json())
                .then(users => {
                    const select = document.getElementById('docUserId');
                    select.innerHTML = '<option value="">Select User</option>';
                    users.forEach(u => {
                        select.innerHTML += `<option value="${u.id}">${u.name} (${u.username})</option>`;
                    });
                });
        }

        function editDoctor(userId) {
            loadUsers();
            fetch(`/api/masters/doctors/user/${userId}`)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('docUserId').value = d.userId;
                    document.getElementById('docDeptId').value = d.departmentId;
                    document.getElementById('docSpecialization').value = d.specialization || '';
                    document.getElementById('docReg').value = d.registrationNumber || '';
                    document.getElementById('docStatus').checked = d.status;
                    docModal.show();
                });
        }

        function saveDoctor() {
            const data = {
                userId: document.getElementById('docUserId').value,
                departmentId: document.getElementById('docDeptId').value,
                specialization: document.getElementById('docSpecialization').value,
                registrationNumber: document.getElementById('docReg').value,
                status: document.getElementById('docStatus').checked
            };
            fetch('/api/masters/doctors', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => location.reload());
        }
    </script>
</body>

</html>
